plugins { id 'com.android.application' }

android {
    namespace 'com.dokterdibya.assistantdaf.monitor'
    compileSdk 34
    defaultConfig {
        applicationId 'com.dokterdibya.assistantdaf.monitor'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def signingPath = System.getenv('ASSISTANT_DAF_MONITOR_KEYSTORE_FILE')
def signingPassword = System.getenv('ASSISTANT_DAF_MONITOR_STORE_PASSWORD')
if (signingPath && signingPassword) {
    android.signingConfigs.create('assistantRelease') {
        storeFile = file(signingPath)
        storePassword = signingPassword
        keyAlias = 'assistant-daf-monitor'
        keyPassword = signingPassword
    }
    android.buildTypes.release.signingConfig = android.signingConfigs.assistantRelease
}
