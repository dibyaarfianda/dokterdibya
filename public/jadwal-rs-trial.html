<!DOCTYPE html>
<html lang="id" data-trial-nav="off" data-trial-nav-active="jadwal">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Jadwal RS - SISIwanita</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script src="/scripts/patient-theme-trial.js?v=20260528home1"></script>
    <link rel="stylesheet" href="/styles/patient-trial-theme.css?v=20260524p">
    <link rel="stylesheet" href="/styles/patient-tool-shell.css?v=20260528z">
    <link rel="stylesheet" href="/styles/patient-tool-retrofit.css?v=20260528z">
    <script>window.__patientTrialHeaderInstalled = true;</script>

    <style>
        :root {
            --bg: #f7f7f4;
            --text-primary: #111111;
            --text-secondary: #4b4b4b;
            --text-muted: #737373;
            --line: rgba(17, 17, 17, 0.1);
            --surface: rgba(255, 255, 255, 0.82);
            --font-main: 'Inter', Arial, sans-serif;
        }

        body.jadwal-rs-page {
            font-family: var(--font-main) !important;
            background: var(--bg) !important;
            color: var(--text-primary) !important;
        }

        body.jadwal-rs-page .rs-section {
            display: grid;
            gap: 12px;
        }

        body.jadwal-rs-page .rs-section-head {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 14px;
            padding: 0 2px;
        }

        body.jadwal-rs-page .rs-section-title {
            margin: 0;
            color: var(--text-primary);
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 0;
        }

        body.jadwal-rs-page .rs-section-sub {
            margin: 4px 0 0;
            color: var(--text-muted);
            font-size: 11px;
            line-height: 1.45;
            font-weight: 700;
        }

        body.jadwal-rs-page .rs-updated {
            flex: 0 0 auto;
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 6px 9px;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.62);
            font-size: 10px;
            font-weight: 900;
            white-space: nowrap;
        }

        body.jadwal-rs-page .rs-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        body.jadwal-rs-page .rs-card {
            display: grid;
            grid-template-columns: 42px 1fr;
            gap: 12px;
            align-items: start;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 14px;
            background: var(--surface);
            box-shadow: 0 10px 26px rgba(17, 17, 17, 0.06);
        }

        body.jadwal-rs-page .rs-icon {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            border-radius: 8px;
            background: rgba(17, 17, 17, 0.06);
            color: var(--hospital-color, #111111);
            font-size: 17px;
        }

        body.jadwal-rs-page .rs-name {
            margin: 0;
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 900;
            line-height: 1.25;
            letter-spacing: 0;
        }

        body.jadwal-rs-page .rs-detail-grid {
            display: grid;
            gap: 7px;
            margin-top: 10px;
        }

        body.jadwal-rs-page .rs-detail {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 800;
            line-height: 1.35;
        }

        body.jadwal-rs-page .rs-detail i {
            width: 14px;
            color: var(--hospital-color, #111111);
            text-align: center;
        }

        body.jadwal-rs-page .rs-note {
            margin-top: 10px;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 700;
            line-height: 1.45;
        }

        body.jadwal-rs-page .rs-state {
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 26px 18px;
            background: rgba(255, 255, 255, 0.76);
            color: var(--text-muted);
            text-align: center;
            font-size: 13px;
            font-weight: 800;
        }

        body.jadwal-rs-page .rs-state i {
            display: block;
            margin-bottom: 10px;
            color: var(--text-primary);
            font-size: 22px;
        }

        @media (min-width: 720px) {
            body.jadwal-rs-page .rs-list {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 400px) {
            body.jadwal-rs-page .rs-section-head {
                align-items: flex-start;
                flex-direction: column;
            }

            body.jadwal-rs-page .rs-card {
                grid-template-columns: 38px 1fr;
                padding: 13px;
            }

            body.jadwal-rs-page .rs-icon {
                width: 38px;
                height: 38px;
            }
        }
    </style>
</head>
<body class="home-sections-locked patient-tool-shell legacy-tool-retrofit jadwal-rs-page" data-tool-shell-active="jadwal" data-tool-kicker="Jadwal Rumah Sakit" data-tool-title="Jadwal praktik RS." data-tool-copy="Lihat rumah sakit, hari praktik, dan jam praktik dokter dalam satu halaman ringkas." data-tool-meta-label="Mode" data-tool-meta-value="Informasi Jadwal">
    <main class="content">
        <section class="rs-section" aria-labelledby="rs-section-title">
            <div class="rs-section-head">
                <div>
                    <h2 class="rs-section-title" id="rs-section-title">Jadwal Praktik Rumah Sakit</h2>
                    <p class="rs-section-sub">Informasi lokasi, hari, dan jam praktik.</p>
                </div>
                <div class="rs-updated" id="rs-updated">Memuat</div>
            </div>
            <div class="rs-list" id="rs-list">
                <div class="rs-state"><i class="fa-solid fa-spinner fa-spin"></i>Memuat jadwal RS...</div>
            </div>
        </section>
    </main>

    <script>
        (function () {
            'use strict';

            var DAY_NAMES = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            var HOSPITALS = [
                { location: 'rsia_melinda', name: 'RSIA Melinda', color: '#b83b6f', icon: 'fa-solid fa-hospital' },
                { location: 'rsud_gambiran', name: 'RSUD Gambiran', color: '#2563eb', icon: 'fa-solid fa-hospital' },
                { location: 'rs_bhayangkara', name: 'RS Bhayangkara', color: '#0f766e', icon: 'fa-solid fa-hospital' }
            ];
            var MOCK_SCHEDULES = [
                { location: 'rsia_melinda', day_of_week: 1, start_time: '08:00:00', end_time: '10:00:00', notes: '' },
                { location: 'rsud_gambiran', day_of_week: 3, start_time: '09:00:00', end_time: '11:00:00', notes: '' },
                { location: 'rs_bhayangkara', day_of_week: 5, start_time: '07:30:00', end_time: '09:30:00', notes: '' }
            ];

            var listEl = document.getElementById('rs-list');
            var updatedEl = document.getElementById('rs-updated');
            var params = new URLSearchParams(window.location.search);
            var mockMode = params.has('mockApi') || window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost';

            function escapeHtml(value) {
                var div = document.createElement('div');
                div.textContent = value == null ? '' : String(value);
                return div.innerHTML;
            }

            function formatTime(value) {
                if (!value) return '-';
                return String(value).slice(0, 5);
            }

            function getHospitalMeta(location) {
                return HOSPITALS.find(function (hospital) { return hospital.location === location; }) || {
                    location: location,
                    name: location,
                    color: '#111111',
                    icon: 'fa-solid fa-hospital'
                };
            }

            function normalizeSchedule(raw) {
                var meta = getHospitalMeta(raw.location);
                var day = Number(raw.day_of_week);
                var safeDay = Number.isFinite(day) ? day : 0;
                return {
                    location: raw.location,
                    hospitalName: meta.name,
                    color: meta.color,
                    icon: meta.icon,
                    dayOfWeek: safeDay,
                    dayName: DAY_NAMES[safeDay] || '-',
                    startTime: formatTime(raw.start_time || raw.startTime),
                    endTime: formatTime(raw.end_time || raw.endTime),
                    notes: raw.notes || ''
                };
            }

            async function fetchSchedules() {
                if (mockMode) return MOCK_SCHEDULES.map(normalizeSchedule);

                var responses = await Promise.all(HOSPITALS.map(function (hospital) {
                    return fetch('/api/practice-schedules?location=' + encodeURIComponent(hospital.location), {
                        headers: { 'Cache-Control': 'no-cache' }
                    }).then(function (response) {
                        if (!response.ok) throw new Error('Gagal memuat ' + hospital.name);
                        return response.json();
                    }).then(function (data) {
                        return (data.schedules || []).map(function (schedule) {
                            return Object.assign({}, schedule, { location: hospital.location });
                        });
                    });
                }));

                return responses.flat().map(normalizeSchedule);
            }

            function renderSchedules(schedules) {
                if (!schedules.length) {
                    listEl.innerHTML = '<div class="rs-state"><i class="fa-regular fa-calendar"></i>Jadwal rumah sakit belum tersedia.</div>';
                    return;
                }

                schedules.sort(function (a, b) {
                    if (a.dayOfWeek !== b.dayOfWeek) return a.dayOfWeek - b.dayOfWeek;
                    if (a.startTime !== b.startTime) return a.startTime.localeCompare(b.startTime);
                    return a.hospitalName.localeCompare(b.hospitalName);
                });

                listEl.innerHTML = schedules.map(function (schedule) {
                    return '' +
                        '<article class="rs-card" style="--hospital-color: ' + escapeHtml(schedule.color) + '">' +
                            '<div class="rs-icon"><i class="' + escapeHtml(schedule.icon) + '"></i></div>' +
                            '<div>' +
                                '<h3 class="rs-name">' + escapeHtml(schedule.hospitalName) + '</h3>' +
                                '<div class="rs-detail-grid">' +
                                    '<div class="rs-detail"><i class="fa-regular fa-calendar"></i><span>' + escapeHtml(schedule.dayName) + '</span></div>' +
                                    '<div class="rs-detail"><i class="fa-regular fa-clock"></i><span>' + escapeHtml(schedule.startTime) + ' - ' + escapeHtml(schedule.endTime) + ' WIB</span></div>' +
                                '</div>' +
                                (schedule.notes ? '<div class="rs-note">' + escapeHtml(schedule.notes) + '</div>' : '') +
                            '</div>' +
                        '</article>';
                }).join('');
            }

            async function init() {
                try {
                    var schedules = await fetchSchedules();
                    renderSchedules(schedules);
                    updatedEl.textContent = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
                } catch (error) {
                    console.error('[JadwalRS] Failed to load schedules:', error);
                    listEl.innerHTML = '<div class="rs-state"><i class="fa-solid fa-circle-exclamation"></i>Gagal memuat jadwal RS.</div>';
                    updatedEl.textContent = 'Gagal';
                }
            }

            init();
        })();
    </script>
    <script src="/js/patient-tracker.js?v=20260209"></script>
    <script src="/js/push-subscribe.js?v=20260209"></script>
    <script src="/scripts/patient-tool-shell.js?v=20260528z"></script>
    <script src="/scripts/patient-tool-retrofit.js?v=20260528z"></script>
</body>
</html>
