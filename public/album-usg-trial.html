<html lang="id" data-trial-nav="off">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#ffffff">
    <title>Album USG - SISIwanita</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/images/logo-dokter-dibya.png">
    <link rel="apple-touch-icon" href="/images/logo-dokter-dibya.png">

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Trial theme sticky navigation -->
    <script src="/scripts/patient-theme-trial.js?v=20260528home1"></script>

    <style>
        /* ========== CSS VARIABLES (Monochrome Design System) ========== */
        :root {
            --bg-page: #ffffff;
            --bg-secondary: #ffffff;
            --bg-surface: #ffffff;
            --bg-elevated: #ebebeb;
            --text-primary: #111111;
            --text-body: #2b2b2b;
            --text-secondary: #606060;
            --text-muted: #686868;
            --accent: #111111;
            --accent-hover: #2a2a2a;
            --accent-soft: rgba(0, 0, 0, 0.08);
            --line-soft: rgba(0, 0, 0, 0.1);
            --line-strong: rgba(0, 0, 0, 0.18);
            --font-main: 'Inter', Arial, sans-serif;
        }

        /* ========== RESET ========== */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            background: var(--bg-page);
        }

        body {
            font-family: var(--font-main);
            background: var(--bg-page);
            min-height: 100vh;
            color: var(--text-primary);
            font-size: 14px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            overflow-x: hidden;
        }

        ::selection {
            background: #e8e8e8;
            color: #141414;
        }

        /* ========== SAFE AREA ========== */
        .safe-area-top {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: env(safe-area-inset-top, 0px);
            background: rgba(255, 255, 255, 0.95);
            z-index: 9999;
        }

        .safe-area-bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: env(safe-area-inset-bottom, 0px);
            background: rgba(255, 255, 255, 0.95);
            z-index: 9999;
        }

        /* ========== TOPBAR ========== */
        .topbar {
            position: fixed;
            top: env(safe-area-inset-top, 0px);
            left: 0;
            right: 0;
            z-index: 40;
            background: rgba(255, 255, 255, 0.9);
            -webkit-backdrop-filter: blur(24px);
            backdrop-filter: blur(24px);
            border-bottom: 1.5px dashed var(--line-soft);
        }

        .topbar-inner {
            max-width: 760px;
            margin: 0 auto;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .back-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1.8px dashed var(--line-strong);
            background: transparent;
            color: var(--text-primary);
            display: grid;
            place-items: center;
            font-size: 14px;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background: var(--accent-soft);
        }

        .back-btn:active {
            transform: scale(0.92);
        }

        .topbar-title {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--text-primary);
        }

        .topbar-count {
            margin-left: auto;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
        }

        /* ========== MAIN CONTENT ========== */
        .main-content {
            max-width: 760px;
            margin: 0 auto;
            padding: 80px 16px 40px;
            padding-top: calc(80px + env(safe-area-inset-top, 0px));
            min-height: 100vh;
        }

        /* ========== STATS ROW ========== */
        .stats-row {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        .stat-box {
            flex: 1;
            border: 1.8px dashed var(--line-soft);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            background: transparent;
        }

        .stat-box .value {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .stat-box .label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            margin-top: 2px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        /* ========== USG GALLERY ========== */
        .usg-gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        @media (min-width: 500px) {
            .usg-gallery {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .usg-item {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 1;
            border: 1.8px dashed var(--line-soft);
            background: var(--bg-page);
            cursor: pointer;
            transition: border-color 0.2s, transform 0.2s;
        }

        .usg-item:hover {
            border-color: var(--line-strong);
            transform: scale(1.02);
        }

        .usg-item:active {
            transform: scale(0.98);
        }

        .usg-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .usg-item .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.7), transparent);
            padding: 28px 10px 10px;
            color: #fff;
            font-size: 11px;
            font-weight: 500;
        }

        .usg-item .new-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: var(--text-primary);
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 20px;
            z-index: 3;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .usg-item .thumbnail-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: var(--text-primary);
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 20px;
            z-index: 3;
        }

        /* ========== LOADING STATE ========== */
        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            color: var(--text-muted);
            gap: 12px;
        }

        .loading-state i {
            font-size: 24px;
        }

        .loading-state span {
            font-size: 13px;
            font-weight: 500;
        }

        /* ========== EMPTY STATE ========== */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            color: var(--text-muted);
            gap: 12px;
            border: 1.8px dashed var(--line-soft);
            border-radius: 12px;
        }

        .empty-state i {
            font-size: 36px;
            color: var(--line-strong);
        }

        .empty-state p {
            font-size: 13px;
            font-weight: 500;
        }

        /* ========== LIGHTBOX MODAL ========== */
        .lightbox-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #ffffff;
            z-index: 9999;
            flex-direction: column;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        .lightbox-modal.active {
            display: flex;
        }

        .lightbox-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            padding-top: calc(14px + env(safe-area-inset-top, 0px));
            border-bottom: 1.5px dashed var(--line-soft);
        }

        .lightbox-header h3 {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .lightbox-close {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1.8px dashed var(--line-strong);
            background: transparent;
            color: var(--text-primary);
            font-size: 16px;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: background 0.2s;
        }

        .lightbox-close:hover {
            background: var(--accent-soft);
        }

        .lightbox-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: auto;
            position: relative;
            background: #fafafa;
        }

        .lightbox-body img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
            border: 1.8px dashed var(--line-soft);
        }

        .lightbox-footer {
            padding: 16px 20px;
            padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            border-top: 1.5px dashed var(--line-soft);
            text-align: center;
        }

        .lightbox-footer .date {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .lightbox-footer .notes {
            font-size: 12px;
            color: var(--text-muted);
        }

        .lightbox-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 14px;
        }

        .lightbox-actions button {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-main);
            transition: background 0.2s, border-color 0.2s;
        }

        .lightbox-actions .btn-thumbnail {
            background: transparent;
            border: 1.8px dashed var(--line-strong);
            color: var(--text-primary);
        }

        .lightbox-actions .btn-thumbnail:hover {
            background: var(--accent-soft);
        }

        .lightbox-actions .btn-thumbnail.active {
            background: var(--text-primary);
            border-color: var(--text-primary);
            border-style: solid;
            color: #fff;
        }

        .lightbox-actions .btn-download {
            background: var(--text-primary);
            border: 1.8px solid var(--text-primary);
            color: #fff;
        }

        .lightbox-actions .btn-download:hover {
            background: var(--accent-hover);
        }

        /* Navigation Arrows */
        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1.8px dashed var(--line-strong);
            background: rgba(255, 255, 255, 0.9);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            color: var(--text-primary);
            font-size: 16px;
            cursor: pointer;
            z-index: 10;
            display: grid;
            place-items: center;
            transition: background 0.2s;
        }

        .lightbox-nav:hover {
            background: var(--accent-soft);
        }

        .lightbox-nav.prev {
            left: 12px;
        }

        .lightbox-nav.next {
            right: 12px;
        }

        /* ========== TOAST ========== */
        #toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }

        .toast {
            background: var(--text-primary);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            font-family: var(--font-main);
            pointer-events: auto;
            animation: toastIn 0.3s ease;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

<body class="home-sections-locked patient-tool-shell legacy-tool-retrofit album-usg-page" data-tool-shell-active="dokumen" data-tool-kicker="Album USG" data-tool-title="Album USG." data-tool-copy="Galeri privat untuk foto USG dari kunjungan Anda, termasuk penanda foto baru dan pilihan thumbnail." data-tool-meta-label="Status" data-tool-meta-value="Galeri USG">
    <!-- Safe Area Overlays -->
    <div class="safe-area-top"></div>
    <div class="safe-area-bottom"></div>

    <!-- Topbar -->
    <header class="topbar">
        <div class="topbar-inner">
            <button class="back-btn" onclick="window.location.href='/patient-menu-simple-trial.html'">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <span class="topbar-title">Album USG</span>
            <span class="topbar-count" id="total-count">0 foto</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Loading State -->
        <div class="loading-state" id="loading-state">
            <i class="fa-solid fa-spinner fa-spin"></i>
            <span>Memuat album...</span>
        </div>

        <!-- Content (hidden until loaded) -->
        <div id="content-wrapper" style="display: none;">
            <!-- Stats -->
            <div class="stats-row">
                <div class="stat-box">
                    <div class="value" id="stat-total">0</div>
                    <div class="label">Total Foto</div>
                </div>
                <div class="stat-box">
                    <div class="value" id="stat-new">0</div>
                    <div class="label">Foto Baru</div>
                </div>
            </div>

            <!-- Gallery -->
            <div class="usg-gallery" id="usg-gallery">
                <!-- USG items will be populated -->
            </div>
        </div>
    </main>

    <!-- Lightbox Modal -->
    <div class="lightbox-modal" id="lightbox-modal">
        <div class="lightbox-header">
            <h3 id="lightbox-title">USG</h3>
            <button class="lightbox-close" onclick="closeLightbox()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="lightbox-body">
            <button class="lightbox-nav prev" onclick="navigateLightbox(-1)">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <img id="lightbox-img" src="" alt="USG">
            <button class="lightbox-nav next" onclick="navigateLightbox(1)">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>
        <div class="lightbox-footer">
            <div class="date" id="lightbox-date"></div>
            <div class="notes" id="lightbox-notes"></div>
            <div class="lightbox-actions">
                <button class="btn-thumbnail" id="btn-thumbnail" onclick="setAsThumbnail()">
                    <i class="fa-regular fa-star"></i> Set Thumbnail
                </button>
                <button class="btn-download" onclick="downloadImage()">
                    <i class="fa-solid fa-download"></i> Download
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Socket.IO for real-time USG updates from staff -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        // Trial theme switch
        (function() {
            var p = new URLSearchParams(window.location.search);
            var t = p.get('theme');
            if (t === 'off' || t === 'old' || t === 'default') {
                try { sessionStorage.removeItem('patient_portal_theme_mode'); } catch(e) {}
                window.location.replace('/album-usg.html');
                return;
            }
            try { sessionStorage.setItem('patient_portal_theme_mode', 'newdesign'); } catch(e) {}
        })();
    </script>
    <script>
        (function() {
            var socketUrl = location.hostname === 'localhost'
                ? 'http://localhost:3000'
                : 'https://dokterdibya.com';
            var socket = io(socketUrl, { transports: ['polling'] });

            socket.on('usg:patient_updated', function(data) {
                if (window.refreshUsgGallery) {
                    window.refreshUsgGallery();
                }
            });
        })();
    </script>

    <script type="module">
        import { getToken, checkAuth, apiRequest, showToast, formatDate, showEmptyState, escapeHtml } from '/scripts/patient-utils.js';

        // State - declared on window to ensure accessibility
        window.allImages = [];
        window.filteredImages = [];
        window.currentFilter = 'all';
        window.currentLightboxIndex = 0;
        window.customThumbnailId = localStorage.getItem('usg_thumbnail_id');

        // Initialize
        document.addEventListener('DOMContentLoaded', async function() {
            if (!checkAuth()) return;

            await loadUsgImages();

            // Mark bell notifications for this page as read
            try {
                await apiRequest('/api/patient-notifications/mark-read-by-link', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ link: '/album-usg.html' })
                });
            } catch (e) { /* silent */ }

            document.getElementById('loading-state').style.display = 'none';
            document.getElementById('content-wrapper').style.display = 'block';
        });

        // Load USG Images
        async function loadUsgImages() {
            try {
                // Single API call for all USG types with cache-bust parameter
                const cacheBust = Math.floor(Date.now() / 60000); // Change every minute
                const response = await apiRequest(`/api/patient-documents/my-documents?type=usg_photo,usg_2d,usg_4d,patient_usg&t=${cacheBust}`);

                window.allImages = [];

                if (response && response.success && response.documents) {
                    window.allImages = response.documents;
                } else if (!response.success) {
                    // API returned error response
                    console.error('API error:', response.message);
                    showToast(`Error: ${response.message}`, 'error');
                    throw new Error(response.message || 'Failed to load documents');
                }

                // Sort by date descending
                window.allImages.sort((a, b) => new Date(b.published_at || b.created_at) - new Date(a.published_at || a.created_at));

                // Update stats
                const newCount = window.allImages.filter(img => !img.first_viewed_at).length;
                document.getElementById('stat-total').textContent = window.allImages.length;
                document.getElementById('stat-new').textContent = newCount;
                document.getElementById('total-count').textContent = `${window.allImages.length} foto`;

                filterByType('all');
            } catch (error) {
                console.error('Error loading USG:', error);
                document.getElementById('usg-gallery').innerHTML = '<div style="grid-column:1/-1;color:red;padding:20px;word-break:break-all;">DEBUG: ' + error.message + '<br>' + error.stack + '</div>';
                showToast(`Gagal memuat album: ${error.message}`, 'error');
            }
        }

        // Show all images (no type filtering)
        function filterByType(type) {
            window.currentFilter = 'all';
            window.filteredImages = [...window.allImages];
            renderGallery();
        }

        // Render gallery
        function renderGallery() {
            const gallery = document.getElementById('usg-gallery');

            if (window.filteredImages.length === 0) {
                gallery.innerHTML = `
                    <div style="grid-column: 1 / -1;">
                        <div class="empty-state">
                            <i class="fa-regular fa-image"></i>
                            <p>Belum ada foto USG</p>
                        </div>
                    </div>
                `;
                return;
            }

            const typeLabels = {
                'usg_2d': '2D',
                'usg_4d': '4D'
            };

            gallery.innerHTML = window.filteredImages.map((img, index) => {
                const date = new Date(img.published_at || img.created_at);
                const dateStr = date.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
                const isNew = !img.first_viewed_at;
                const isThumbnail = window.customThumbnailId && parseInt(window.customThumbnailId) === img.id;

                // Use detectedType for badge, fallback to original type
                const effectiveType = img.detectedType || img.type;
                const typeLabel = typeLabels[effectiveType] || '';

                return `
                    <div class="usg-item" onclick="openLightbox(${index})">
                        ${isNew ? '<span class="new-badge">Baru</span>' : ''}
                        ${isThumbnail ? '<span class="thumbnail-badge"><i class="fa-solid fa-star"></i></span>' : ''}

                        <img src="${img.file_url}" alt="USG ${dateStr}" loading="lazy"
                             onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27200%27 height=%27200%27%3E%3Crect width=%27200%27 height=%27200%27 fill=%27%23f0f0f0%27/%3E%3Ctext x=%2750%25%27 y=%2750%25%27 font-size=%2714%27 fill=%27%23999%27 text-anchor=%27middle%27 dy=%27.3em%27 font-family=%27Inter%27%3EError%3C/text%3E%3C/svg%3E'">
                        <div class="overlay">
                            ${dateStr}
                            ${img.title ? '<br>' + escapeHtml(img.title) : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Open lightbox
        async function openLightbox(index) {
            window.currentLightboxIndex = index;
            const img = window.filteredImages[index];

            document.getElementById('lightbox-modal').classList.add('active');
            document.body.style.overflow = 'hidden';

            updateLightboxContent(img);

            // Mark as viewed
            if (!img.first_viewed_at) {
                try {
                    await apiRequest(`/api/patient-documents/${img.id}/view`, { method: 'POST' });
                    img.first_viewed_at = new Date().toISOString();
                    // Update stats and re-render to remove BARU badge
                    const newCount = window.allImages.filter(i => !i.first_viewed_at).length;
                    document.getElementById('stat-new').textContent = newCount;
                    renderGallery();
                } catch (e) {
                    console.error('Error marking viewed:', e);
                }
            }
        }

        // Update lightbox content
        function updateLightboxContent(img) {
            const date = new Date(img.published_at || img.created_at);
            const dateStr = date.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

            document.getElementById('lightbox-img').src = img.file_url;
            document.getElementById('lightbox-date').textContent = dateStr;
            document.getElementById('lightbox-notes').textContent = img.title || img.description || '';
            document.getElementById('lightbox-title').textContent = img.title || 'USG';

            // Update thumbnail button
            const isThumbnail = window.customThumbnailId && parseInt(window.customThumbnailId) === img.id;
            const btnThumbnail = document.getElementById('btn-thumbnail');
            if (isThumbnail) {
                btnThumbnail.classList.add('active');
                btnThumbnail.innerHTML = '<i class="fa-solid fa-star"></i> Thumbnail';
            } else {
                btnThumbnail.classList.remove('active');
                btnThumbnail.innerHTML = '<i class="fa-regular fa-star"></i> Set Thumbnail';
            }
        }

        // Close lightbox
        function closeLightbox() {
            document.getElementById('lightbox-modal').classList.remove('active');
            document.body.style.overflow = '';
        }

        // Navigate lightbox
        function navigateLightbox(direction) {
            window.currentLightboxIndex += direction;

            if (window.currentLightboxIndex < 0) {
                window.currentLightboxIndex = window.filteredImages.length - 1;
            } else if (window.currentLightboxIndex >= window.filteredImages.length) {
                window.currentLightboxIndex = 0;
            }

            updateLightboxContent(window.filteredImages[window.currentLightboxIndex]);
        }

        // Set as thumbnail
        function setAsThumbnail() {
            const img = window.filteredImages[window.currentLightboxIndex];
            window.customThumbnailId = img.id.toString();
            localStorage.setItem('usg_thumbnail_id', window.customThumbnailId);

            // Update button
            const btnThumbnail = document.getElementById('btn-thumbnail');
            btnThumbnail.classList.add('active');
            btnThumbnail.innerHTML = '<i class="fa-solid fa-star"></i> Thumbnail';

            showToast('Berhasil diset sebagai thumbnail', 'success');

            // Re-render gallery to show badge
            renderGallery();
        }

        // Download image
        function downloadImage() {
            const img = window.filteredImages[window.currentLightboxIndex];
            const link = document.createElement('a');
            link.href = img.file_url;
            link.download = `USG_${new Date(img.published_at || img.created_at).toISOString().split('T')[0]}.jpg`;
            link.target = '_blank';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (!document.getElementById('lightbox-modal').classList.contains('active')) return;

            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') navigateLightbox(-1);
            if (e.key === 'ArrowRight') navigateLightbox(1);
        });

        // Export functions to global scope AFTER all functions are defined
        window.filterByType = filterByType;
        window.openLightbox = openLightbox;
        window.closeLightbox = closeLightbox;
        window.navigateLightbox = navigateLightbox;
        window.setAsThumbnail = setAsThumbnail;
        window.downloadImage = downloadImage;
        window.refreshUsgGallery = loadUsgImages;
    </script>
