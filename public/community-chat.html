<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Chat - dokterDIBYA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        :root {
            --bg: #f5fbff;
            --card: #ffffff;
            --line: #d9d9d9;
            --text: #111b21;
            --muted: #667781;
            --accent: #25d366;
            --accent-2: #128c7e;
            --danger: #ef4444;
            --mobile-bottom-offset: 0px;
            --app-height: 100vh;
            --chat-font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            --chat-font-size: 16px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            background-image:
                radial-gradient(circle at 1px 1px, rgba(32, 84, 129, 0.06) 1px, transparent 0),
                linear-gradient(180deg, rgba(232, 245, 255, 0.85) 0%, rgba(245, 251, 255, 0.9) 45%, rgba(255, 255, 255, 0.96) 100%);
            background-size: 20px 20px, 100% 100%;
            background-position: 0 0, 0 0;
            color: var(--text);
            min-height: var(--app-height);
            height: var(--app-height);
            overflow: hidden;
        }

        body.theme-dark {
            color: #e5eef7;
            background-color: #0f1823;
            background-image:
                radial-gradient(circle at 1px 1px, rgba(138, 175, 211, 0.08) 1px, transparent 0),
                linear-gradient(180deg, rgba(20, 32, 46, 0.95) 0%, rgba(12, 21, 32, 0.96) 100%);
        }

        body.embed-staff {
            background: transparent;
            min-height: var(--app-height);
            height: var(--app-height);
        }

        .page {
            width: 100%;
            max-width: none;
            margin: 0;
            padding: 0;
            padding-top: env(safe-area-inset-top);
            padding-bottom: 0;
            min-height: var(--app-height);
            height: var(--app-height);
            display: flex;
            flex-direction: column;
        }

        body.embed-staff .page {
            max-width: 100%;
            margin: 0;
            padding: 0;
        }

        body.embed-staff .topbar {
            display: none;
        }

        body.embed-staff .layout {
            gap: 0;
        }

        body.embed-staff .card {
            border-radius: 0;
            box-shadow: none;
            border-color: rgba(0,0,0,0.08);
        }

        body.embed-staff .messages {
            min-height: calc(100vh - 360px);
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0;
            gap: 8px;
            padding: 10px 12px;
            border-bottom: 1px solid #d7e0e8;
            background: #eaf4fb;
        }

        .topbar-room {
            min-width: 0;
            flex: 1;
        }

        .topbar-room-title {
            font-size: 23px;
            line-height: 1.1;
            font-weight: 800;
            color: #0f2029;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .status-wrap {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            position: relative;
        }

        .status-chip {
            border: 1px solid #c8d3dd;
            background: #ffffff;
            color: #5e7380;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            line-height: 1;
        }

        .status-chip.active {
            background: #dcf8c6;
            border-color: #b8e5b5;
            color: #1b5e20;
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0;
            flex: 1;
            min-height: 0;
        }

        .card {
            background: var(--card);
            border: 0;
            border-radius: 0;
            box-shadow: none;
        }

        .panel {
            display: none;
        }

        input, textarea, select, button {
            font: inherit;
        }

        input, textarea, select {
            width: 100%;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: #fff;
            color: var(--text);
            padding: 10px;
            outline: none;
        }

        button {
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: white;
            font-weight: bold;
            padding: 10px 12px;
            cursor: pointer;
        }

        button.secondary {
            background: #f1f3f4;
            border: 1px solid var(--line);
            color: #1f2c34;
        }

        .rooms {
            max-height: none;
            height: calc(100svh - 220px);
            overflow: auto;
            display: grid;
            gap: 0;
        }

        .room-item {
            border: 0;
            border-bottom: 1px solid #eef0f2;
            border-left: 4px solid transparent;
            border-radius: 0;
            padding: 10px 8px;
            background: #fff;
            cursor: pointer;
            display: grid;
            grid-template-columns: 46px 1fr;
            gap: 10px;
            align-items: center;
        }

        .room-item.active {
            background: #f0f2f5;
        }

        .room-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .room-row-top {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            align-items: baseline;
        }

        .room-name {
            font-weight: bold;
            margin-bottom: 2px;
            font-size: 15px;
        }

        .room-meta {
            color: var(--muted);
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .room-time {
            color: #8696a0;
            font-size: 11px;
            white-space: nowrap;
        }

        .chat-wrapper {
            display: grid;
            grid-template-rows: auto auto 1fr auto auto;
            min-height: 0;
            height: 100%;
            background: #fff;
        }

        .chat-head {
            padding: 14px;
            border-bottom: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            background: #f0f2f5;
        }

        .active-room-title {
            font-weight: bold;
            font-size: 18px;
        }

        .active-room-desc {
            color: #667781;
            font-size: 13px;
        }

        .active-room-color {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #2563eb;
        }

        .chat-head-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
        }

        .chat-menu-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #d0d7dc;
            background: #ffffff;
            color: #41525d;
        }

        body.theme-dark .chat-menu-btn {
            border-color: #304861;
            background: #1a2d40;
            color: #d8e6f2;
        }

        .chat-menu {
            position: absolute;
            right: 0;
            top: calc(100% + 6px);
            min-width: 180px;
            background: #ffffff;
            border: 1px solid #d9e1e7;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(17, 27, 33, 0.12);
            display: none;
            z-index: 20;
            padding: 6px;
        }

        body.theme-dark .chat-menu {
            background: #102133;
            border-color: #2f465d;
        }

        .chat-menu.show {
            display: grid;
            gap: 4px;
        }

        .chat-menu-item {
            width: 100%;
            text-align: left;
            background: #ffffff;
            color: #1f2c34;
            border: 0;
            border-radius: 8px;
            font-weight: 600;
            padding: 9px 10px;
            cursor: pointer;
        }

        .chat-menu-item:hover {
            background: #f3f6f8;
        }

        body.theme-dark .chat-menu-item {
            background: #102133;
            color: #d6e4f1;
        }

        body.theme-dark .chat-menu-item:hover {
            background: #193044;
        }

        .chat-menu-item[disabled] {
            color: #90a4ae;
            background: #f8f9fb;
            cursor: not-allowed;
        }

        .typing {
            color: #00a884;
            font-size: 12px;
            padding: 0 14px 8px;
            min-height: 18px;
            background: #f7f8fa;
        }

        .typing:empty {
            display: none;
        }

        body.theme-dark .typing {
            background: #0f1f2f;
            color: #6de4c6;
        }

        .messages {
            overflow: auto;
            padding: 14px;
            display: grid;
            gap: 10px;
            align-content: start;
            background-color: #f8fcff;
            background-image:
                linear-gradient(180deg, rgba(224, 242, 255, 0.6) 0%, rgba(248, 252, 255, 0.9) 34%, rgba(255, 255, 255, 1) 100%),
                radial-gradient(circle at 1px 1px, rgba(32, 84, 129, 0.06) 1px, transparent 0);
            background-size: 100% 100%, 22px 22px;
            font-family: var(--chat-font-family);
            font-size: var(--chat-font-size);
        }

        .date-divider {
            justify-self: center;
            background: rgba(255, 255, 255, 0.95);
            color: #54656f;
            font-size: 11px;
            font-weight: 600;
            border-radius: 8px;
            padding: 4px 10px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.08);
        }

        .msg-row {
            display: grid;
            grid-template-columns: 34px minmax(0, 1fr);
            gap: 8px;
            align-items: end;
        }

        .msg-row.me {
            grid-template-columns: minmax(0, 1fr);
            justify-items: end;
        }

        .msg-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 1px solid #d7e3ea;
            object-fit: cover;
            background: #dce9f1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: #4d6470;
            overflow: hidden;
        }

        .msg {
            max-width: 78%;
            border-radius: 8px;
            border-top-left-radius: 0;
            padding: 8px 10px 7px;
            border: 1px solid #dfe5e7;
            background: #ffffff;
            position: relative;
            box-shadow: 0 1px 0 rgba(0,0,0,0.05);
        }

        .msg.quote-ready {
            transition: transform 0.18s ease;
        }

        .msg.quote-ready.quote-active {
            transform: translateX(-10px);
        }

        .msg.me {
            justify-self: end;
            background: #dcf8c6;
            border-color: #c6e9b4;
            border-top-left-radius: 8px;
            border-top-right-radius: 0;
        }

        .msg::before {
            content: "";
            position: absolute;
            top: -1px;
            left: -7px;
            width: 8px;
            height: 12px;
            border-top-right-radius: 8px;
            background: #ffffff;
            border-left: 1px solid #dfe5e7;
            border-top: 1px solid #dfe5e7;
        }

        .msg.me::before {
            left: auto;
            right: -7px;
            border-top-right-radius: 0;
            border-top-left-radius: 8px;
            border-left: none;
            border-right: 1px solid #c6e9b4;
            border-top: 1px solid #c6e9b4;
            background: #dcf8c6;
        }

        .msg-head {
            font-size: 12px;
            color: #00a884;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .msg-user {
            color: #0b7a63;
            font-weight: bold;
            text-decoration: none;
        }

        .msg-user:hover { text-decoration: underline; }

        .msg-time {
            color: var(--muted);
            white-space: nowrap;
        }

        .msg-body {
            white-space: pre-wrap;
            line-height: 1.45;
            word-break: break-word;
            color: #111b21;
            font-family: var(--chat-font-family);
            font-size: var(--chat-font-size);
        }

        body.theme-dark .msg {
            background: #182a3d;
            border-color: #2f465d;
        }

        body.theme-dark .msg.me {
            background: #1c5a47;
            border-color: #2f7a64;
        }

        body.theme-dark .msg::before {
            background: #182a3d;
            border-left-color: #2f465d;
            border-top-color: #2f465d;
        }

        body.theme-dark .msg.me::before {
            background: #1c5a47;
            border-right-color: #2f7a64;
            border-top-color: #2f7a64;
        }

        body.theme-dark .msg-body,
        body.theme-dark .msg-time,
        body.theme-dark .msg-quote-text {
            color: #d4e4f3;
        }

        body.theme-dark .date-divider {
            background: rgba(20, 36, 53, 0.95);
            color: #c9daea;
        }

        .msg-quote {
            border-left: 3px solid #16a085;
            background: rgba(22, 160, 133, 0.1);
            border-radius: 6px;
            padding: 6px 8px;
            margin-bottom: 6px;
        }

        .msg-quote-user {
            font-size: 11px;
            font-weight: 700;
            color: #0f766e;
            margin-bottom: 2px;
        }

        .msg-quote-text {
            font-size: 12px;
            color: #405b66;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .msg-body-text {
            display: block;
        }

        .composer {
            border-top: 1px solid var(--line);
            padding: 10px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            align-items: center;
            position: relative;
            background: #f0f2f5;
        }

        .quote-preview {
            display: none;
            grid-column: 1 / -1;
            border-left: 3px solid #16a085;
            background: #eaf5f3;
            border-radius: 8px;
            padding: 7px 10px;
            margin-bottom: 2px;
            grid-template-columns: 1fr auto;
            align-items: start;
            gap: 8px;
        }

        .quote-preview.show {
            display: grid;
        }

        .quote-preview-meta {
            font-size: 11px;
            font-weight: 700;
            color: #0f766e;
        }

        .quote-preview-text {
            font-size: 13px;
            color: #3f5762;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .quote-cancel {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 1px solid #bed2cf;
            background: #ffffff;
            color: #4b616c;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .composer-input-wrap {
            position: relative;
            width: 100%;
        }

        #message-input {
            border-radius: 22px;
            padding: 11px 52px 11px 14px;
            min-height: 44px;
            height: 44px;
            max-height: 132px;
            resize: none;
            overflow-y: auto;
            line-height: 1.35;
            border-color: #d0d7dc;
            font-family: var(--chat-font-family);
            font-size: var(--chat-font-size);
        }

        body.theme-dark #message-input {
            background: #1a2e43;
            border-color: #355069;
            color: #e2edf7;
        }

        #emoji-toggle {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            border: 1px solid #d0d7dc;
            background: #f6f8f9;
            color: #4d5d66;
            z-index: 2;
        }

        #send-btn {
            font-size: 0;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        #send-btn i {
            font-size: 16px;
        }

        .emoji-panel {
            position: absolute;
            bottom: 58px;
            right: 64px;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 8px;
            width: 240px;
            display: none;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
            z-index: 10;
        }

        .emoji-panel.show { display: grid; }

        .emoji-btn {
            border: 1px solid transparent;
            background: #f5f7f8;
            border-radius: 6px;
            padding: 4px;
            cursor: pointer;
            font-size: 16px;
            text-align: center;
        }

        .menu-modal {
            position: fixed;
            inset: 0;
            background: rgba(17, 27, 33, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 30;
            padding: 16px;
        }

        .menu-modal.show {
            display: flex;
        }

        .menu-modal-card {
            width: min(480px, 100%);
            background: #ffffff;
            border-radius: 14px;
            border: 1px solid #dde5eb;
            box-shadow: 0 18px 40px rgba(17, 27, 33, 0.2);
            padding: 14px;
            display: grid;
            gap: 10px;
        }

        body.theme-dark .menu-modal-card {
            background: #102133;
            border-color: #304861;
        }

        .menu-modal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .menu-modal-title {
            margin: 0;
            font-size: 18px;
        }

        .menu-modal-close {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            padding: 0;
            background: #f2f4f6;
            color: #30414b;
        }

        body.theme-dark .menu-modal-close {
            background: #1c3145;
            color: #d4e4f2;
        }

        .room-form {
            display: grid;
            gap: 8px;
        }

        .room-picker-current {
            border: 1px solid #d9e1e7;
            border-radius: 10px;
            padding: 9px 10px;
            background: #f7fafc;
            margin-bottom: 8px;
        }

        .room-picker-current-title {
            font-size: 11px;
            color: #60717a;
            margin-bottom: 2px;
            font-weight: 700;
        }

        .room-picker-current-name {
            font-size: 14px;
            font-weight: 700;
            color: #1d2c34;
        }

        .room-picker-list {
            height: auto;
            max-height: 55vh;
            border: 1px solid #d9e1e7;
            border-radius: 10px;
            overflow: auto;
        }

        .setting-note {
            color: #51636d;
            font-size: 14px;
            line-height: 1.5;
            margin: 0;
        }

        .setting-group {
            display: grid;
            gap: 8px;
        }

        .setting-label {
            font-size: 13px;
            font-weight: 700;
            color: #3b4e58;
        }

        .setting-inline {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .setting-pill {
            border: 1px solid #cfdae1;
            background: #f7fafc;
            border-radius: 999px;
            padding: 4px 9px;
            font-size: 12px;
            color: #3d5565;
            min-width: 54px;
            text-align: center;
        }

        body.theme-dark .setting-note,
        body.theme-dark .setting-label {
            color: #b5cada;
        }

        body.theme-dark .setting-pill {
            border-color: #3c566e;
            background: #1a3147;
            color: #d8e6f3;
        }

        .room-create-note {
            display: none;
            color: #667781;
            font-size: 13px;
        }

        .moderator-note {
            color: #667781;
            margin: 6px 0 10px;
            font-size: 13px;
        }

        .moderator-panel {
            border-top: 1px solid var(--line);
            padding: 12px 14px;
            display: none;
        }

        .moderator-panel.show { display: block; }

        .staff-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 8px;
            max-height: 150px;
            overflow: auto;
            margin-bottom: 10px;
        }

        .staff-item {
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 8px;
            background: #fff;
            font-size: 13px;
        }

        .back-link {
            color: #0f766e;
            text-decoration: none;
            font-size: 14px;
        }

        @media (max-width: 1000px) {
            body {
                min-height: var(--app-height);
                height: var(--app-height);
            }

            .page {
                padding: 0;
                padding-top: env(safe-area-inset-top);
                padding-bottom: 0;
            }

            .topbar { padding: 10px 10px; }

            .topbar-room-title {
                font-size: 20px;
            }

            .layout {
                grid-template-columns: 1fr;
                min-height: 0;
            }

            .chat-wrapper {
                min-height: 0;
                height: 100%;
                padding-bottom: 0;
            }

            .messages {
                min-height: 0;
                max-height: none;
                padding-bottom: calc(116px + var(--mobile-bottom-offset));
            }

            .composer { grid-template-columns: 1fr auto; }
            .emoji-panel { right: 10px; }

            .composer {
                position: fixed;
                left: 0;
                right: 0;
                bottom: var(--mobile-bottom-offset);
                z-index: 15;
                padding: 8px 10px 2px;
            }

            #send-btn {
                width: 40px;
                height: 40px;
            }

            #emoji-toggle {
                width: 32px;
                height: 32px;
                right: 6px;
            }

            .status-chip {
                padding: 4px 9px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
<div class="page">
    <div class="topbar">
        <div class="topbar-room">
            <div id="active-room-name" class="topbar-room-title">-</div>
        </div>
        <div class="status-wrap">
            <span class="status-chip" id="status-badge">User</span>

<script type="module">

    function applyCreateRoomPermission() {
        const allowed = !!canCreateRoomPermission;
        if (el.menuRoomPicker) {
            el.menuRoomPicker.disabled = rooms.length === 0;
        }
        if (el.menuCreateRoom) {
            el.menuCreateRoom.disabled = !allowed;
            el.menuCreateRoom.title = allowed ? 'Buat room baru' : 'Fitur ini khusus user VIP';
        }
        if (el.createRoomBtn) {
            el.createRoomBtn.disabled = !allowed;
            el.createRoomBtn.style.opacity = allowed ? '1' : '0.6';
            el.createRoomBtn.style.cursor = allowed ? 'pointer' : 'not-allowed';
            el.createRoomBtn.title = allowed ? 'Buat room baru' : 'Fitur ini khusus user VIP';
        }
        if (el.roomName) el.roomName.disabled = !allowed;
        if (el.roomDesc) el.roomDesc.disabled = !allowed;
        if (el.roomColor) el.roomColor.disabled = !allowed;

        if (el.roomCreatePanel) {
            el.roomCreatePanel.style.display = allowed ? 'grid' : 'none';
        }
        if (el.roomCreateNote) {
            el.roomCreateNote.style.display = allowed ? 'none' : 'block';
        }
    }

    function getFontFamilyByKey(key) {
        const fonts = {
            segoe: '"Segoe UI", "Helvetica Neue", Arial, sans-serif',
            trebuchet: '"Trebuchet MS", "Segoe UI", sans-serif',
            verdana: 'Verdana, "Segoe UI", sans-serif',
            georgia: 'Georgia, serif'
        };
        return fonts[key] || fonts.segoe;
    }

    function composeMessageBackground() {
        const isDark = uiSettings.theme === 'dark';
        const overlay = isDark
            ? 'linear-gradient(180deg, rgba(21, 34, 51, 0.68) 0%, rgba(15, 27, 41, 0.9) 48%, rgba(12, 22, 33, 0.95) 100%)'
            : 'linear-gradient(180deg, rgba(224, 242, 255, 0.6) 0%, rgba(248, 252, 255, 0.9) 34%, rgba(255, 255, 255, 1) 100%)';
        const dots = isDark
            ? 'radial-gradient(circle at 1px 1px, rgba(117, 169, 219, 0.09) 1px, transparent 0)'
            : 'radial-gradient(circle at 1px 1px, rgba(32, 84, 129, 0.06) 1px, transparent 0)';

        if (uiSettings.wallpaperDataUrl) {
            const wallpaperTint = isDark
                ? 'linear-gradient(180deg, rgba(12, 22, 33, 0.56) 0%, rgba(12, 22, 33, 0.56) 100%)'
                : 'linear-gradient(180deg, rgba(255, 255, 255, 0.34) 0%, rgba(255, 255, 255, 0.34) 100%)';
            return {
                image: `${wallpaperTint}, url(${uiSettings.wallpaperDataUrl}), ${dots}`,
                size: '100% 100%, cover, 22px 22px',
                position: '0 0, center top, 0 0',
                repeat: 'no-repeat, no-repeat, repeat'
            };
        }

        return {
            image: `${overlay}, ${dots}`,
            size: '100% 100%, 22px 22px',
            position: '0 0, 0 0',
            repeat: 'no-repeat, repeat'
        };
    }

    function applyUiSettings() {
        document.body.classList.toggle('theme-dark', uiSettings.theme === 'dark');
        document.documentElement.style.setProperty('--chat-font-family', getFontFamilyByKey(uiSettings.fontFamily));
        document.documentElement.style.setProperty('--chat-font-size', `${uiSettings.fontSize}px`);

        if (el.settingTheme) el.settingTheme.value = uiSettings.theme;
        if (el.settingFontFamily) el.settingFontFamily.value = uiSettings.fontFamily;
        if (el.settingFontSize) el.settingFontSize.value = String(uiSettings.fontSize);
        if (el.settingFontSizeValue) el.settingFontSizeValue.textContent = `${uiSettings.fontSize}px`;

        const bg = composeMessageBackground();
        el.messages.style.backgroundImage = bg.image;
        el.messages.style.backgroundSize = bg.size;
        el.messages.style.backgroundPosition = bg.position;
        el.messages.style.backgroundRepeat = bg.repeat;

        autoResizeMessageInput();
    }

    function persistUiSettings() {
        localStorage.setItem(UI_SETTINGS_KEY, JSON.stringify(uiSettings));
    }

    function loadUiSettings() {
        try {
            const raw = localStorage.getItem(UI_SETTINGS_KEY);
            if (!raw) return;
            const parsed = JSON.parse(raw);
            uiSettings = {
                theme: parsed.theme === 'dark' ? 'dark' : 'light',
                wallpaperDataUrl: typeof parsed.wallpaperDataUrl === 'string' ? parsed.wallpaperDataUrl : '',
                fontFamily: ['segoe', 'trebuchet', 'verdana', 'georgia'].includes(parsed.fontFamily) ? parsed.fontFamily : 'segoe',
                fontSize: Math.max(13, Math.min(Number(parsed.fontSize) || 16, 22))
            };
        } catch (_) {
            // Ignore invalid cached settings and use defaults.
        }
    }

    function toggleChatMenu(force) {
        const nextState = typeof force === 'boolean' ? force : !el.chatMenu.classList.contains('show');
        el.chatMenu.classList.toggle('show', nextState);
    }

    function setModalOpen(modal, open) {
        if (!modal) return;
        modal.classList.toggle('show', !!open);
    }

    function getUserStatusLabel() {
        if (!isStaff) return 'User';

        const roleName = String(currentUser?.role || '').toLowerCase();
        if (roleName.includes('admin') || roleName === 'dokter' || roleName === 'superadmin') {
            return 'Admin';
        }

        if (roleName.includes('moderator')) {
            return 'Moderator';
        }

        return 'Moderator';
    }

    function updateStatusChips() {
        const label = getUserStatusLabel();
        el.statusBadge.textContent = label;
        el.statusBadge.classList.add('active');
    }

    function renderRoomPickerCurrent() {
        const lobbyRoom = rooms.find((room) => room.slug === 'lobby');
        const lobbyName = lobbyRoom ? lobbyRoom.name : 'Lobby';

        if (!activeRoom) {
            el.roomPickerCurrent.innerHTML = `
                <div class="room-picker-current-title">Pilih Room</div>
                <div class="room-picker-current-name">Room aktif: -</div>
                <div class="room-picker-current-name">Lobby: ${escapeHtml(lobbyName)}</div>
            `;
            return;
        }

        el.roomPickerCurrent.innerHTML = `
            <div class="room-picker-current-title">Pilih Room</div>
            <div class="room-picker-current-name">Room aktif: ${escapeHtml(activeRoom.name)}</div>
            <div class="room-picker-current-name">Lobby: ${escapeHtml(lobbyName)}</div>
        `;
    }

    function openRoomPickerModal() {
        setModalOpen(el.roomPickerModal, true);
    }

    function openCreateRoomModal() {
        if (!canCreateRoomPermission) {
            showToast('Fitur buat room hanya untuk user VIP', 'warning');
            return;
        }
        setModalOpen(el.createRoomModal, true);
        setTimeout(() => {
            if (el.roomName) el.roomName.focus();
        }, 0);
    }

    function initChatMenu() {
        el.chatMenuBtn.addEventListener('click', (event) => {
            event.stopPropagation();
            toggleChatMenu();
        });

        el.menuRoomPicker.addEventListener('click', () => {
            toggleChatMenu(false);
            openRoomPickerModal();
        });

        el.menuCreateRoom.addEventListener('click', () => {
            toggleChatMenu(false);
            openCreateRoomModal();
        });

        el.menuSetting.addEventListener('click', () => {
            toggleChatMenu(false);
            setModalOpen(el.settingModal, true);
        });

        el.menuExit.addEventListener('click', () => {
            toggleChatMenu(false);
            window.location.href = '/patient-menu.html';
        });

        el.createRoomClose.addEventListener('click', () => setModalOpen(el.createRoomModal, false));
        el.settingClose.addEventListener('click', () => setModalOpen(el.settingModal, false));
        el.roomPickerClose.addEventListener('click', () => setModalOpen(el.roomPickerModal, false));

        el.settingTheme.addEventListener('change', (event) => {
            uiSettings.theme = event.target.value === 'dark' ? 'dark' : 'light';
            applyUiSettings();
            persistUiSettings();
        });

        el.settingFontFamily.addEventListener('change', (event) => {
            uiSettings.fontFamily = event.target.value;
            applyUiSettings();
            persistUiSettings();
        });

        el.settingFontSize.addEventListener('input', (event) => {
            uiSettings.fontSize = Math.max(13, Math.min(Number(event.target.value) || 16, 22));
            applyUiSettings();
            persistUiSettings();
        });

        el.settingWallpaper.addEventListener('change', (event) => {
            const file = event.target.files && event.target.files[0];
            if (!file) return;

            if (!file.type || !file.type.startsWith('image/')) {
                showToast('File wallpaper harus gambar.', 'warning');
                return;
            }

            const reader = new FileReader();
            reader.onload = () => {
                const result = typeof reader.result === 'string' ? reader.result : '';
                uiSettings.wallpaperDataUrl = result;
                applyUiSettings();
                persistUiSettings();
                showToast('Wallpaper berhasil diterapkan', 'success');
            };
            reader.onerror = () => {
                showToast('Gagal membaca file wallpaper', 'error');
            };
            reader.readAsDataURL(file);
        });

        el.settingWallpaperClear.addEventListener('click', () => {
            uiSettings.wallpaperDataUrl = '';
            el.settingWallpaper.value = '';
            applyUiSettings();
            persistUiSettings();
            showToast('Wallpaper dihapus', 'success');
        });

        [el.createRoomModal, el.settingModal, el.roomPickerModal].forEach((modal) => {
            modal.addEventListener('click', (event) => {
                if (event.target === modal) setModalOpen(modal, false);
            });
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                toggleChatMenu(false);
                setModalOpen(el.createRoomModal, false);
                setModalOpen(el.settingModal, false);
                setModalOpen(el.roomPickerModal, false);
            }
        });

        document.addEventListener('click', (event) => {
            if (!el.chatMenu.contains(event.target) && !el.chatMenuBtn.contains(event.target)) {
                toggleChatMenu(false);
            }
        });
    }

    function getToken() {
        for (const key of TOKEN_KEYS) {
            const fromLocal = localStorage.getItem(key);
            const fromSession = sessionStorage.getItem(key);
            if (fromLocal) return fromLocal;
            if (fromSession) return fromSession;
        }
        return null;
    }

    function applyEmbedMode() {
        if (!isStaffEmbed) return;
        document.body.classList.add('embed-staff');
    }

    function decodeToken(value) {
        try {
            const payload = JSON.parse(atob(value.split('.')[1] || ''));
            return payload;
        } catch (_) {
            return null;
        }
    }

    async function api(path, options = {}) {
        const response = await fetch(`${API_BASE}/api/community-chat${path}`, {
            ...options,
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json',
                ...(options.headers || {})
            }
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok || data.success === false) {
            throw new Error(data.message || 'Request gagal');
        }
        return data;
    }

    function renderRooms() {
        const orderedRooms = [...rooms].sort((a, b) => {
            if (a.slug === 'lobby') return -1;
            if (b.slug === 'lobby') return 1;
            return 0;
        });

        el.roomPickerList.innerHTML = orderedRooms.map((room) => {
            const active = activeRoom && activeRoom.slug === room.slug ? 'active' : '';
            const roomColor = room.color || '#2563eb';
            const roomTime = formatRoomTime(room.last_message_at || room.created_at);
            return `
                <div class="room-item ${active}" data-room="${room.slug}" style="border-left-color:${roomColor}">
                    <div class="room-avatar" style="background:${roomColor}">${getInitials(room.name)}</div>
                    <div class="room-content">
                        <div class="room-row-top">
                            <div class="room-name">${room.name}</div>
                            <div class="room-time">${roomTime}</div>
                        </div>
                        <div class="room-meta">${room.description || 'Room komunitas'}</div>
                    </div>
                </div>
            `;
        }).join('');

        el.roomPickerList.querySelectorAll('.room-item').forEach((item) => {
            item.addEventListener('click', async () => {
                const slug = item.getAttribute('data-room');
                await openRoom(slug);
                setModalOpen(el.roomPickerModal, false);
            });
        });

        renderRoomPickerCurrent();
    }

    function toBase64Unicode(value) {
        const bytes = new TextEncoder().encode(String(value || ''));
        let binary = '';
        bytes.forEach((byte) => {
            binary += String.fromCharCode(byte);
        });
        return btoa(binary);
    }

    function fromBase64Unicode(value) {
        const binary = atob(String(value || ''));
        const bytes = Uint8Array.from(binary, (ch) => ch.charCodeAt(0));
        return new TextDecoder().decode(bytes);
    }

    function parseMessagePayload(rawMessage) {
        const source = String(rawMessage || '');
        const quoteMatch = source.match(/^\[\[q:([A-Za-z0-9+/=]+)\]\]\n?/);
        if (!quoteMatch) {
            return { quote: null, body: source };
        }

        const encoded = quoteMatch[1];
        const body = source.slice(quoteMatch[0].length);

        try {
            const quote = JSON.parse(fromBase64Unicode(encoded));
            return {
                quote: {
                    sender: String(quote.sender || 'User'),
                    text: String(quote.text || '')
                },
                body
            };
        } catch (_) {
            return { quote: null, body: source };
        }
    }

    function buildQuotedMessage(rawMessage) {
        const payload = parseMessagePayload(rawMessage);
        const quoteHtml = payload.quote
            ? `<div class="msg-quote"><div class="msg-quote-user">${escapeHtml(payload.quote.sender)}</div><div class="msg-quote-text">${escapeHtml(payload.quote.text)}</div></div>`
            : '';

        return {
            bodyText: payload.body,
            html: `${quoteHtml}<span class="msg-body-text">${escapeHtml(payload.body)}</span>`
        };
    }

    function setQuotedMessage(data) {
        quotedMessage = {
            sender: String(data.sender || 'User').slice(0, 40),
            text: String(data.text || '').trim().slice(0, 180)
        };

        el.quotePreviewMeta.textContent = `Quote: ${quotedMessage.sender}`;
        el.quotePreviewText.textContent = quotedMessage.text;
        el.quotePreview.classList.add('show');
    }

    function clearQuotedMessage() {
        quotedMessage = null;
        el.quotePreview.classList.remove('show');
        el.quotePreviewMeta.textContent = '';
        el.quotePreviewText.textContent = '';
    }

    function attachQuoteGesture(node, messageMeta) {
        let startX = 0;
        let startY = 0;
        let triggered = false;
        let tracking = false;
        let dragX = 0;

        const resetSwipeState = () => {
            tracking = false;
            dragX = 0;
            node.classList.remove('quote-active');
            node.style.transition = 'transform 0.18s ease';
            node.style.transform = 'translateX(0px)';
        };

        node.classList.add('quote-ready');

        node.addEventListener('touchstart', (event) => {
            if (!event.touches || event.touches.length !== 1) return;
            const touch = event.touches[0];
            startX = touch.clientX;
            startY = touch.clientY;
            triggered = false;
            tracking = true;
            dragX = 0;
            node.classList.remove('quote-active');
            node.style.transition = 'none';
            node.style.transform = 'translateX(0px)';
        }, { passive: true });

        node.addEventListener('touchmove', (event) => {
            if (!tracking || !event.touches || event.touches.length !== 1) return;
            const touch = event.touches[0];
            const dx = touch.clientX - startX;
            const dy = touch.clientY - startY;

            // Keep vertical scrolling smooth; only handle mostly horizontal swipes.
            if (Math.abs(dy) > Math.abs(dx) + 8) {
                resetSwipeState();
                return;
            }

            if (triggered) return;

            if (dx < 0 && Math.abs(dy) < 44) {
                dragX = Math.max(dx, -64);
                node.style.transform = `translateX(${dragX}px)`;
            }

            if (dragX < -16) {
                node.classList.add('quote-active');
            } else {
                node.classList.remove('quote-active');
            }

            if (dragX < -48) {
                triggered = true;
                setQuotedMessage(messageMeta);
                resetSwipeState();
            }
        }, { passive: true });

        node.addEventListener('touchend', resetSwipeState, { passive: true });
        node.addEventListener('touchcancel', resetSwipeState, { passive: true });
    }

    function packOutgoingMessage(rawText) {
        if (!quotedMessage) return rawText;
        const quotePayload = toBase64Unicode(JSON.stringify({
            sender: quotedMessage.sender,
            text: quotedMessage.text
        }));
        return `[[q:${quotePayload}]]\n${rawText}`;
    }

    function formatTime(value) {
        return new Date(value).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    }

    function formatRoomTime(value) {
        if (!value) return '';
        const date = new Date(value);
        const now = new Date();
        const sameDay = date.toDateString() === now.toDateString();
        if (sameDay) return formatTime(value);
        return date.toLocaleDateString('id-ID', { day: '2-digit', month: 'short' });
    }

    function getInitials(name) {
        const source = String(name || '').trim();
        if (!source) return '#';
        const parts = source.split(/\s+/).slice(0, 2);
        return parts.map((part) => part.charAt(0).toUpperCase()).join('');
    }

    function getDateKey(value) {
        const d = new Date(value);
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function formatDateDivider(value) {
        const d = new Date(value);
        return d.toLocaleDateString('id-ID', {
            weekday: 'long',
            day: 'numeric',
            month: 'long',
            year: 'numeric'
        });
    }

    function buildMessageNode(msg) {
        const mine = String(msg.sender_id) === String(currentUser.id);
        const displayName = msg.sender_nickname || msg.sender_name || 'User';
        const builtMessage = buildQuotedMessage(msg.message);
        const row = document.createElement('div');
        row.className = `msg-row ${mine ? 'me' : ''}`;
        row.dataset.id = msg.id;
        row.dataset.dateKey = getDateKey(msg.created_at);

        const avatarHtml = !mine
            ? (msg.sender_avatar
                ? `<img class="msg-avatar" src="${escapeHtml(msg.sender_avatar)}" alt="${escapeHtml(displayName)}">`
                : `<div class="msg-avatar">${escapeHtml(getInitials(displayName))}</div>`)
            : '';

        row.innerHTML = `
            ${avatarHtml}
            <div class="msg ${mine ? 'me' : ''}">
                <div class="msg-head">
                    <a class="msg-user" href="/community-profile.html?userType=${encodeURIComponent(msg.sender_type)}&userId=${encodeURIComponent(msg.sender_id)}">${displayName}</a>
                    <span class="msg-time">${formatTime(msg.created_at)}</span>
                </div>
                <div class="msg-body">${builtMessage.html}</div>
            </div>
        `;

        const bubble = row.querySelector('.msg');
        attachQuoteGesture(bubble, {
            sender: displayName,
            text: builtMessage.bodyText
        });

        return row;
    }

    function autoResizeMessageInput(reset) {
        if (!el.messageInput) return;
        const minHeight = 44;
        const maxHeight = 132;

        if (reset) {
            el.messageInput.style.height = `${minHeight}px`;
            el.messageInput.scrollTop = 0;
            return;
        }

        el.messageInput.style.height = 'auto';
        const nextHeight = Math.max(minHeight, Math.min(el.messageInput.scrollHeight, maxHeight));
        el.messageInput.style.height = `${nextHeight}px`;
    }

    function buildDateDivider(dateValue) {
        const divider = document.createElement('div');
        divider.className = 'date-divider';
        divider.dataset.dateKey = getDateKey(dateValue);
        divider.textContent = formatDateDivider(dateValue);
        return divider;
    }

    function renderMessages(messages) {
        renderedMessageIds = new Set((messages || []).map((msg) => String(msg.id)));
        el.messages.innerHTML = '';

        let currentDateKey = null;
        (messages || []).forEach((msg) => {
            const messageDateKey = getDateKey(msg.created_at);
            if (messageDateKey !== currentDateKey) {
                el.messages.appendChild(buildDateDivider(msg.created_at));
                currentDateKey = messageDateKey;
            }
            el.messages.appendChild(buildMessageNode(msg));
        });

        el.messages.scrollTop = el.messages.scrollHeight;
    }

    function escapeHtml(text) {
        return String(text || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    async function openRoom(slug) {
        const data = await api(`/rooms/${encodeURIComponent(slug)}/messages?limit=120`);
        activeRoom = data.room;
        clearQuotedMessage();

        el.activeRoomName.textContent = data.room.name;
        el.activeRoomDesc.textContent = data.room.description || 'Room chat komunitas';
        el.activeRoomColor.style.background = data.room.color || '#2563eb';

        renderMessages(data.messages || []);
        renderRooms();

        if (socket) {
            socket.emit('community:join', { room: data.room.slug, token });
        }

        if (isStaff) {
            el.moderatorPanel.classList.add('show');
            await loadStaffModerators();
        }
    }

    function appendMessage(message) {
        if (!activeRoom) return;
        const messageId = String(message.id);
        if (renderedMessageIds.has(messageId)) return;

        renderedMessageIds.add(messageId);

        const lastDateNode = el.messages.querySelector('.date-divider:last-of-type');
        const lastDateKey = lastDateNode ? lastDateNode.dataset.dateKey : null;
        const messageDateKey = getDateKey(message.created_at);
        if (lastDateKey !== messageDateKey) {
            el.messages.appendChild(buildDateDivider(message.created_at));
        }

        const node = buildMessageNode(message);

        el.messages.appendChild(node);
        el.messages.scrollTop = el.messages.scrollHeight;
    }

    async function sendMessage() {
        if (!activeRoom) {
            showToast('Pilih room dulu', 'warning');
            return;
        }

        const message = el.messageInput.value.trim();
        if (!message) return;

        try {
            const payload = await api(`/rooms/${encodeURIComponent(activeRoom.slug)}/messages`, {
                method: 'POST',
                body: JSON.stringify({ message: packOutgoingMessage(message) })
            });

            el.messageInput.value = '';
            autoResizeMessageInput(true);
            clearQuotedMessage();
            appendMessage(payload.message);

            if (socket) {
                socket.emit('community:stop-typing', {
                    room: activeRoom.slug,
                    user_id: currentUser.id
                });
            }
        } catch (error) {
            showToast(error.message, 'error');
        }
    }

    async function createRoom() {
        if (!canCreateRoomPermission) {
            showToast('Fitur buat room hanya untuk user VIP', 'warning');
            return;
        }

        const name = el.roomName.value.trim();
        const description = el.roomDesc.value.trim();
        const color = el.roomColor.value.trim();

        if (!name) {
            showToast('Nama room wajib diisi', 'warning');
            return;
        }

        try {
            await api('/rooms', {
                method: 'POST',
                body: JSON.stringify({ name, description, color })
            });
            el.roomName.value = '';
            el.roomDesc.value = '';
            el.roomColor.value = '';
            await loadRooms();
            showToast('Room berhasil dibuat', 'success');
        } catch (error) {
            showToast(error.message, 'error');
        }
    }

    async function loadRooms(forceLobby = false) {
        const data = await api('/rooms');
        rooms = data.rooms || [];
        canCreateRoomPermission = !!(data.permissions && data.permissions.can_create_room);
        applyCreateRoomPermission();
        renderRooms();

        if (rooms.length === 0) return;

        if (forceLobby) {
            const lobbyForced = rooms.find((r) => r.slug === 'lobby');
            await openRoom((lobbyForced || rooms[0]).slug);
            return;
        }

        if (!activeRoom) {
            const lobby = rooms.find((r) => r.slug === 'lobby');
            await openRoom((lobby || rooms[0]).slug);
        }
    }

    function initEmojiPicker() {
        el.emojiPanel.innerHTML = EMOJIS.map((emoji) => `<button class="emoji-btn" type="button">${emoji}</button>`).join('');
        el.emojiPanel.querySelectorAll('.emoji-btn').forEach((button) => {
            button.addEventListener('click', () => {
                el.messageInput.value += button.textContent;
                autoResizeMessageInput();
                el.messageInput.focus();
                el.emojiPanel.classList.remove('show');
            });
        });

        el.emojiToggle.addEventListener('click', () => {
            el.emojiPanel.classList.toggle('show');
        });

        document.addEventListener('click', (event) => {
            if (!el.emojiPanel.contains(event.target) && event.target !== el.emojiToggle) {
                el.emojiPanel.classList.remove('show');
            }
        });
    }

    function initSocket() {
        const socketUrl = window.location.hostname === 'localhost' ? 'http://localhost:3000' : window.location.origin;
        socket = window.io(socketUrl, { transports: ['polling'] });

        socket.on('connect', () => {
            if (activeRoom) {
                socket.emit('community:join', { room: activeRoom.slug, token });
            }
        });

        socket.on('community:message:new', (payload) => {
            if (!activeRoom || payload.room !== activeRoom.slug) return;
            appendMessage(payload.message);
        });

        socket.on('community:message:deleted', (payload) => {
            if (!activeRoom || payload.room !== activeRoom.slug) return;
            const node = el.messages.querySelector(`[data-id="${payload.message_id}"]`);
            if (node) node.remove();
            renderedMessageIds.delete(String(payload.message_id));
        });

        socket.on('community:typing', (payload) => {
            if (!activeRoom || payload.room !== activeRoom.slug) return;
            if (String(payload.user_id) === String(currentUser.id)) return;
            el.typingIndicator.textContent = `${payload.user_name || 'User'} sedang mengetik...`;
        });

        socket.on('community:stop-typing', (payload) => {
            if (!activeRoom || payload.room !== activeRoom.slug) return;
            el.typingIndicator.textContent = '';
        });

        socket.on('community:rooms:changed', async () => {
            await loadRooms(false);
        });
    }

    async function loadStaffModerators() {
        if (!isStaff || !activeRoom) return;

        try {
            const [staffData, modData] = await Promise.all([
                api('/admin/staff-users'),
                api(`/rooms/${encodeURIComponent(activeRoom.slug)}/moderators`)
            ]);

            const selectedIds = new Set((modData.moderators || []).map((m) => String(m.staff_user_id)));

            el.staffGrid.innerHTML = (staffData.staff_users || []).map((user) => {
                const checked = selectedIds.has(String(user.new_id)) ? 'checked' : '';
                const roleName = user.role_display_name || user.role || 'Staff';
                return `
                    <label class="staff-item">
                        <input type="checkbox" value="${user.new_id}" ${checked}> ${user.name || user.email}
                        <div style="color:#9fb0d9; margin-top:4px;">${roleName}</div>
                    </label>
                `;
            }).join('');
        } catch (error) {
            el.staffGrid.innerHTML = `<div style="color:#fca5a5;">${escapeHtml(error.message)}</div>`;
        }
    }

    async function saveModerators() {
        if (!isStaff || !activeRoom) return;

        const moderatorIds = Array.from(el.staffGrid.querySelectorAll('input[type="checkbox"]:checked')).map((input) => input.value);

        try {
            await api(`/rooms/${encodeURIComponent(activeRoom.slug)}/moderators`, {
                method: 'PUT',
                body: JSON.stringify({ moderator_user_ids: moderatorIds })
            });
            showToast('Moderator room diperbarui', 'success');
        } catch (error) {
            showToast(error.message, 'error');
        }
    }

    function initTypingHandler() {
        el.messageInput.addEventListener('input', () => {
            autoResizeMessageInput();
            if (!socket || !activeRoom) return;

            socket.emit('community:typing', {
                room: activeRoom.slug,
                user_id: currentUser.id,
                user_name: currentUser.name || currentUser.email || 'User'
            });

            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                socket.emit('community:stop-typing', {
                    room: activeRoom.slug,
                    user_id: currentUser.id
                });
            }, 800);
        });
    }

    function updateMobileBottomOffset() {
        const baseHeight = Math.round(window.innerHeight || document.documentElement.clientHeight || 0);
        const viewport = window.visualViewport;
        const visualHeight = viewport ? Math.round(viewport.height + viewport.offsetTop) : baseHeight;
        const candidateHeight = Math.max(baseHeight, visualHeight);
        if (candidateHeight > 0) {
            if (!stableAppHeight || candidateHeight > stableAppHeight) {
                stableAppHeight = candidateHeight;
            }
            document.documentElement.style.setProperty('--app-height', `${stableAppHeight}px`);
        }

        if (!window.matchMedia('(max-width: 1000px)').matches) {
            document.documentElement.style.setProperty('--mobile-bottom-offset', '0px');
            return;
        }

        if (!viewport) {
            const fallbackInset = useAndroidBottomNavFallback ? 52 : 0;
            document.documentElement.style.setProperty('--mobile-bottom-offset', `${fallbackInset}px`);
            return;
        }

        const viewportInset = Math.max(0, Math.round(window.innerHeight - (viewport.height + viewport.offsetTop)));
        const keyboardLikelyOpen = viewport.height < (window.innerHeight * 0.78);
        const fallbackInset = useAndroidBottomNavFallback && !keyboardLikelyOpen ? 52 : 0;
        const nextInset = Math.max(viewportInset, fallbackInset);

        document.documentElement.style.setProperty('--mobile-bottom-offset', `${nextInset}px`);
    }

    function initMobileViewportGuard() {
        updateMobileBottomOffset();
        window.addEventListener('resize', updateMobileBottomOffset);
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', updateMobileBottomOffset);
            window.visualViewport.addEventListener('scroll', updateMobileBottomOffset);
        }
        el.messageInput.addEventListener('focus', updateMobileBottomOffset);
        el.messageInput.addEventListener('blur', updateMobileBottomOffset);
    }

    async function init() {
        applyEmbedMode();

        token = getToken();
        if (!token) {
            window.location.href = '/patient-login.html';
            return;
        }

        currentUser = decodeToken(token);
        if (!currentUser || !currentUser.id) {
            showToast('Token tidak valid. Silakan login ulang.', 'error');
            window.location.href = '/patient-login.html';
            return;
        }

        isStaff = currentUser.user_type !== 'patient' && currentUser.role !== 'patient';
        updateStatusChips();

        loadUiSettings();
        applyUiSettings();

        initEmojiPicker();
        initSocket();
        initTypingHandler();
        initChatMenu();
        initMobileViewportGuard();
        autoResizeMessageInput(true);

        el.sendBtn.addEventListener('click', sendMessage);
        el.messageInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });
        el.createRoomBtn.addEventListener('click', createRoom);
        el.saveModeratorsBtn.addEventListener('click', saveModerators);
        el.quoteCancel.addEventListener('click', clearQuotedMessage);
        await loadRooms(true);
    }

    init().catch((error) => {
        console.error(error);
        showToast(error.message || 'Gagal memuat community chat', 'error');
    });
</script>
</body>
