<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Perjalanan menjadi Ibu - dokterDIBYA</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0066FF;
            --primary-dark: #0052CC;
            --success: #10b981;
            --danger: #ef4444;
            --bg-gradient: #000000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            color: #ffffff;
            overflow-x: hidden;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        .safe-area-top {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: env(safe-area-inset-top, 0px);
            background: #000000;
            z-index: 9999;
        }

        .safe-area-bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: env(safe-area-inset-bottom, 0px);
            background: #000000;
            z-index: 9999;
        }

        .bg-animation {
            display: none;
        }

        .bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 8s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-100px) rotate(180deg); }
        }

        .container-wrapper {
            position: relative;
            z-index: 1;
            padding: 40px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: 42px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.7);
        }

        .back-btn {
            position: fixed;
            top: calc(30px + env(safe-area-inset-top, 0px));
            left: 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 1000;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--primary);
            color: #ffffff;
            text-decoration: none;
            transform: translateX(-5px);
        }

        /* Flipbook Container */
        .flipbook-container {
            perspective: 2000px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 40px auto;
            position: relative;
        }

        .book {
            position: relative;
            width: 700px;
            height: 900px;
            transform-style: preserve-3d;
            transition: transform 0.5s;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
        }

        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            transform-origin: left center;
            transition: all 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            transform: translateX(-100%);
        }

        .page.active {
            opacity: 1;
            visibility: visible;
            transform: translateX(0);
            z-index: 10;
        }

        .page.flipped {
            opacity: 0;
            visibility: hidden;
            transform: translateX(-100%);
            z-index: 1;
        }

        .page-left {
            display: none;
        }

        .page-content {
            width: 100%;
            height: 100%;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backface-visibility: hidden;
            touch-action: pinch-zoom;
        }

        .page-content img {
            max-width: 100%;
            max-height: 100%;
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            touch-action: pinch-zoom;
            cursor: zoom-in;
        }

        /* Mobile optimization - even more zoom */
        @media (max-width: 768px) {
            .page-content {
                padding: 5px;
            }

            .page-content img {
                object-fit: cover;
                border-radius: 4px;
            }

            .page-number {
                font-size: 12px;
                bottom: 10px;
                right: 15px;
            }
        }

        .page-number {
            position: absolute;
            bottom: 20px;
            right: 30px;
            font-size: 14px;
            color: #666;
            font-weight: 600;
        }

        /* Navigation Controls */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-top: 40px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 14px 28px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-btn:hover:not(:disabled) {
            background: var(--primary);
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 102, 255, 0.4);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .page-indicator {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
        }

        /* Responsive */
        @media (max-width: 992px) {
            .book {
                width: 90vw;
                max-width: 600px;
                height: 120vw;
                max-height: 800px;
            }
        }

        @media (max-width: 768px) {
            .book {
                width: 95vw;
                height: 130vw;
            }

            .header h1 {
                font-size: 32px;
            }

            .back-btn {
                top: calc(15px + env(safe-area-inset-top, 0px));
                left: 15px;
                padding: 10px 18px;
                font-size: 14px;
            }

            .controls {
                flex-direction: column;
                gap: 15px;
            }
        }

        /* Book spine effect - removed for single page view */

        /* Clickable areas for page navigation */
        .book-click-left,
        .book-click-right {
            position: absolute;
            top: 0;
            width: 48%;
            height: 100%;
            cursor: pointer;
            z-index: 101;
            transition: background 0.3s;
        }

        .book-click-left {
            left: 0;
        }

        .book-click-right {
            right: 0;
        }

        .book-click-left:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .book-click-right:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        /* Cursor hints */
        .book-click-left:not(.disabled) {
            cursor: w-resize;
        }

        .book-click-right:not(.disabled) {
            cursor: e-resize;
        }

        .book-click-left.disabled,
        .book-click-right.disabled {
            cursor: not-allowed;
            opacity: 0;
        }
    </style>
</head>
<body>
    <div class="safe-area-top"></div>
    <div class="safe-area-bottom"></div>
    <div class="bg-animation" id="bgAnimation"></div>

    <a href="/patient-menu.html" class="back-btn">
        <i class="fa fa-arrow-left"></i> Kembali ke Dashboard
    </a>

    <!-- Fullscreen Image Viewer -->
    <div id="imageViewer" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.95);z-index:10000;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);">
        <button onclick="closeImageViewer()" style="position:absolute;top:calc(20px + env(safe-area-inset-top,0));right:20px;background:rgba(255,255,255,0.2);border:none;color:white;width:44px;height:44px;border-radius:50%;font-size:24px;cursor:pointer;z-index:10001;">×</button>
        <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:auto;touch-action:pinch-zoom pan-x pan-y;">
            <img id="viewerImage" src="" alt="Zoom" style="max-width:200%;max-height:200%;object-fit:contain;touch-action:pinch-zoom;">
        </div>
    </div>

    <div class="container-wrapper">
        <div class="header">
            <h1><i class="fa fa-book"></i> Perjalanan menjadi Ibu</h1>
            <p>Jelajahi momen indah dalam perjalanan kehamilan Anda</p>
        </div>

        <div class="flipbook-container">
            <div class="book" id="book">
                <!-- Clickable areas for navigation -->
                <div class="book-click-left" id="clickLeft" onclick="prevPage()" title="Halaman sebelumnya"></div>
                <div class="book-click-right" id="clickRight" onclick="nextPage()" title="Halaman selanjutnya"></div>
                <!-- Pages will be generated by JavaScript -->
            </div>
        </div>

        <div class="controls">
            <button class="nav-btn" id="prevBtn" onclick="prevPage()">
                <i class="fa fa-chevron-left"></i> Sebelumnya
            </button>
            <div class="page-indicator">
                Halaman <span id="currentPage">1</span> dari <span id="totalPages">16</span>
            </div>
            <button class="nav-btn" id="nextBtn" onclick="nextPage()">
                Selanjutnya <i class="fa fa-chevron-right"></i>
            </button>
        </div>
    </div>

    <script>
        // Check authentication - redirect to login if not authenticated
        (function() {
            const token = localStorage.getItem('vps_auth_token') || sessionStorage.getItem('vps_auth_token');
            const user = JSON.parse(localStorage.getItem('patient_user') || '{}');

            if (!token || !user.id) {
                // Check if from mobile app
                const fromMobile = localStorage.getItem('from_mobile_app') === 'true';
                if (fromMobile) {
                    console.log('[Perjalanan Ibu] From mobile app, redirecting to app login');
                    localStorage.removeItem('from_mobile_app');
                    window.location.href = 'dokterdibya://logout';
                } else {
                    window.location.href = '/patient-login.html';
                }
                return;
            }
        })();

        // Create floating bubbles
        function createBubbles() {
            const bgAnimation = document.getElementById('bgAnimation');
            const bubbleCount = 15;

            for (let i = 0; i < bubbleCount; i++) {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';

                const size = Math.random() * 60 + 20;
                bubble.style.width = size + 'px';
                bubble.style.height = size + 'px';
                bubble.style.left = Math.random() * 100 + '%';
                bubble.style.top = Math.random() * 100 + '%';
                bubble.style.animationDelay = Math.random() * 8 + 's';
                bubble.style.animationDuration = (Math.random() * 4 + 6) + 's';

                bgAnimation.appendChild(bubble);
            }
        }

        createBubbles();

        // Book images
        const images = [
            '1.png', '2.png', '6.png', '7.png', '8.png', '9.png',
            '10.png', '11.png', '12.png', '13.png', '14.png', '15.png',
            '16.png', '17.png', '37.png', '38.png'
        ];

        let currentPageIndex = 0;

        // Generate pages
        function generatePages() {
            const book = document.getElementById('book');

            images.forEach((img, index) => {
                const page = document.createElement('div');
                page.className = 'page';
                if (index === 0) {
                    page.classList.add('active');
                }

                const imgPath = `/images/dokter-dibya-book/${img}`;
                page.innerHTML = `
                    <div class="page-content">
                        <img src="${imgPath}" alt="Halaman ${index + 1}" onclick="openImageViewer('${imgPath}')">
                        <div class="page-number">${index + 1}</div>
                    </div>
                `;

                book.appendChild(page);
            });

            updateControls();
        }

        // Navigate to next page
        function nextPage() {
            if (currentPageIndex < images.length - 1) {
                const pages = document.querySelectorAll('.page');
                pages[currentPageIndex].classList.remove('active');
                pages[currentPageIndex].classList.add('flipped');
                currentPageIndex++;
                pages[currentPageIndex].classList.add('active');
                pages[currentPageIndex].classList.remove('flipped');
                updateControls();
            }
        }

        // Navigate to previous page
        function prevPage() {
            if (currentPageIndex > 0) {
                const pages = document.querySelectorAll('.page');
                pages[currentPageIndex].classList.remove('active');
                currentPageIndex--;
                pages[currentPageIndex].classList.add('active');
                pages[currentPageIndex].classList.remove('flipped');
                updateControls();
            }
        }

        // Update navigation controls
        function updateControls() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const clickLeft = document.getElementById('clickLeft');
            const clickRight = document.getElementById('clickRight');
            const currentPageSpan = document.getElementById('currentPage');
            const totalPagesSpan = document.getElementById('totalPages');

            // Update button states
            prevBtn.disabled = currentPageIndex === 0;
            nextBtn.disabled = currentPageIndex === images.length - 1;

            // Update clickable area states
            if (clickLeft) {
                if (currentPageIndex === 0) {
                    clickLeft.classList.add('disabled');
                } else {
                    clickLeft.classList.remove('disabled');
                }
            }

            if (clickRight) {
                if (currentPageIndex === images.length - 1) {
                    clickRight.classList.add('disabled');
                } else {
                    clickRight.classList.remove('disabled');
                }
            }

            // Update page indicator
            currentPageSpan.textContent = currentPageIndex + 1;
            totalPagesSpan.textContent = images.length;
        }

        // Image viewer functions
        function openImageViewer(imgSrc) {
            document.getElementById('viewerImage').src = imgSrc;
            document.getElementById('imageViewer').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeImageViewer() {
            document.getElementById('imageViewer').style.display = 'none';
            document.body.style.overflow = '';
        }

        // Close viewer on click outside image
        document.getElementById('imageViewer').addEventListener('click', function(e) {
            if (e.target === this || e.target.parentElement === this) {
                closeImageViewer();
            }
        });

        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight') {
                nextPage();
            } else if (e.key === 'ArrowLeft') {
                prevPage();
            } else if (e.key === 'Escape') {
                closeImageViewer();
            }
        });

        // Initialize on page load
        window.addEventListener('load', generatePages);
    </script>
<script src="/js/patient-tracker.js?v=20260209"></script>
</body>
</html>
