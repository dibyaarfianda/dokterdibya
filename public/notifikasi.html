<!DOCTYPE html>
<html lang="id">
<head>
    <script src="/scripts/patient-session.js?v=20260801stage2f1"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#ffffff">
    <title>Notifikasi - SISIwanita</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/images/logo-dokter-dibya.png">
    <link rel="apple-touch-icon" href="/images/logo-dokter-dibya.png">

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Portal theme sticky navigation -->
<style>
        /* ========== CSS VARIABLES (Monochrome Design System) ========== */
        :root {
            --bg-page: #ffffff;
            --bg-secondary: #ffffff;
            --bg-surface: #ffffff;
            --bg-elevated: #ebebeb;
            --text-primary: #111111;
            --text-body: #2b2b2b;
            --text-secondary: #606060;
            --text-muted: #686868;
            --accent: #111111;
            --accent-hover: #2a2a2a;
            --accent-soft: rgba(0, 0, 0, 0.08);
            --line-soft: rgba(0, 0, 0, 0.1);
            --line-strong: rgba(0, 0, 0, 0.18);
            --font-main: 'Inter', Arial, sans-serif;
        }

        /* ========== RESET ========== */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            background: var(--bg-page);
        }

        body {
            font-family: var(--font-main);
            background: var(--bg-page);
            min-height: 100vh;
            color: var(--text-primary);
            font-size: 14px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            overflow-x: hidden;
        }

        ::selection {
            background: #e8e8e8;
            color: #141414;
        }

        /* ========== SAFE AREA BARS ========== */
        .safe-area-top {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: env(safe-area-inset-top, 0px);
            background: rgba(255, 255, 255, 0.95);
            z-index: 9999;
        }

        .safe-area-bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: env(safe-area-inset-bottom, 0px);
            background: rgba(255, 255, 255, 0.95);
            z-index: 9999;
        }

        /* ========== TOPBAR ========== */
        .topbar {
            position: fixed;
            top: env(safe-area-inset-top, 0px);
            left: 0;
            right: 0;
            z-index: 40;
            background: rgba(255, 255, 255, 0.92);
            -webkit-backdrop-filter: blur(24px);
            backdrop-filter: blur(24px);
            border-bottom: 1.5px dashed var(--line-soft);
        }

        .topbar.scrolled {
            border-bottom-color: var(--line-strong);
        }

        .topbar-inner {
            max-width: 760px;
            margin: 0 auto;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1.8px dashed var(--line-soft);
            background: transparent;
            color: var(--text-primary);
            display: grid;
            place-items: center;
            font-size: 14px;
            cursor: pointer;
            transition: border-color 0.2s, transform 0.2s;
            flex-shrink: 0;
        }

        .back-btn:hover {
            border-color: var(--line-strong);
        }

        .back-btn:active {
            transform: scale(0.92);
        }

        .topbar-title {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--text-primary);
            flex: 1;
        }

        .topbar-action {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px 12px;
            border: 1.8px dashed var(--line-soft);
            border-radius: 20px;
            background: transparent;
            transition: border-color 0.2s, color 0.2s;
            white-space: nowrap;
        }

        .topbar-action:hover {
            border-color: var(--line-strong);
            color: var(--text-primary);
        }

        /* ========== MAIN CONTENT ========== */
        .main-content {
            max-width: 760px;
            margin: 0 auto;
            padding: 80px 16px 40px;
            padding-top: calc(80px + env(safe-area-inset-top, 0px));
            min-height: 100vh;
        }

        /* ========== FILTER TABS ========== */
        .filter-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }

        .filter-tab {
            padding: 7px 16px;
            border-radius: 20px;
            border: 1.8px dashed var(--line-soft);
            background: transparent;
            color: var(--text-muted);
            font-family: var(--font-main);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-tab.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #ffffff;
            border-style: solid;
        }

        .filter-tab:hover:not(.active) {
            border-color: var(--line-strong);
            color: var(--text-primary);
        }

        .filter-count {
            font-weight: 600;
            font-size: 11px;
            opacity: 0.7;
        }

        /* ========== DATE GROUP ========== */
        .date-group {
            margin-bottom: 8px;
        }

        .date-header {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            padding: 12px 0 8px;
            border-bottom: 1.5px dashed var(--line-soft);
            margin-bottom: 12px;
        }

        /* ========== NOTIFICATION CARD ========== */
        .notif-card {
            border: 1.8px dashed var(--line-soft);
            border-radius: 12px;
            margin-bottom: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            background: transparent;
        }

        .notif-card:hover {
            border-color: var(--line-strong);
        }

        .notif-card:active {
            background: var(--accent-soft);
        }

        .notif-card.unread {
            background: var(--accent-soft);
            border-color: var(--line-strong);
        }

        .notif-card-inner {
            display: flex;
            gap: 12px;
            padding: 14px 16px;
            align-items: flex-start;
        }

        /* ========== NOTIFICATION ICON ========== */
        .notif-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 15px;
            flex-shrink: 0;
            border: 1.8px dashed var(--line-soft);
            background: transparent;
            color: var(--text-secondary);
        }

        .notif-card.unread .notif-icon {
            background: var(--accent);
            border-color: var(--accent);
            color: #ffffff;
            border-style: solid;
        }

        /* ========== NOTIFICATION CONTENT ========== */
        .notif-content {
            flex: 1;
            min-width: 0;
        }

        .notif-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2px;
            line-height: 1.35;
        }

        .notif-message {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.45;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .notif-time {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .notif-time i {
            font-size: 10px;
        }

        /* ========== UNREAD DOT ========== */
        .unread-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            flex-shrink: 0;
            margin-top: 6px;
        }

        /* ========== LOADING STATE ========== */
        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 60px 20px;
            color: var(--text-muted);
            font-size: 13px;
        }

        .loading-state i {
            font-size: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ========== EMPTY STATE ========== */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 60px 20px;
            text-align: center;
        }

        .empty-state .empty-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 1.8px dashed var(--line-soft);
            display: grid;
            place-items: center;
            font-size: 24px;
            color: var(--text-muted);
        }

        .empty-state p {
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1.5;
        }

        /* ========== TOAST ========== */
        #toast-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            pointer-events: none;
        }

        .toast {
            padding: 10px 20px;
            border-radius: 8px;
            background: var(--accent);
            color: #ffffff;
            font-size: 13px;
            font-weight: 500;
            font-family: var(--font-main);
            pointer-events: auto;
            animation: toastIn 0.3s ease;
        }

        .toast.error {
            background: #dc2626;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

</head>
<body>
    <!-- Safe Area Overlays -->
    <div class="safe-area-top"></div>
    <div class="safe-area-bottom"></div>

    <!-- Topbar -->
    <header class="topbar" id="topbar">
        <div class="topbar-inner">
            <button class="back-btn" onclick="window.location.href='/patient-menu.html'" aria-label="Kembali">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <h1 class="topbar-title">Notifikasi</h1>
            <button class="topbar-action" onclick="markAllRead()">Tandai Dibaca</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Loading State -->
        <div class="loading-state" id="loading-state">
            <i class="fa-solid fa-spinner"></i>
            <span>Memuat notifikasi...</span>
        </div>

        <!-- Content (hidden until loaded) -->
        <div id="content-wrapper" style="display: none;">
            <!-- Filter Tabs -->
            <div class="filter-tabs">
                <button class="filter-tab active" data-filter="all" onclick="filterNotif('all')">
                    Semua <span class="filter-count" id="count-all"></span>
                </button>
                <button class="filter-tab" data-filter="unread" onclick="filterNotif('unread')">
                    Belum Dibaca <span class="filter-count" id="count-unread"></span>
                </button>
            </div>

            <!-- Notifications List -->
            <div id="notif-list"></div>
        </div>
    </main>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <script type="module">
        // ===== Portal theme switch =====
        (function() {
            var p = new URLSearchParams(window.location.search);
            var t = p.get('theme');
            if (t === 'off' || t === 'old' || t === 'default') {
                try { sessionStorage.removeItem('patient_portal_mode'); } catch(e) {}
                window.location.replace('/notifikasi.html');
                return;
            }
            try { sessionStorage.setItem('patient_portal_mode', 'newdesign'); } catch(e) {}
        })();

        import { getToken, checkAuth, apiRequest, showToast, formatRelativeTime, showEmptyState, escapeHtml } from '/scripts/patient-utils.js';

        // State
        let allNotifications = [];
        let currentFilter = 'all';

        // Make functions globally available
        window.filterNotif = filterNotif;
        window.markAllRead = markAllRead;
        window.openNotification = openNotification;

        // Topbar scroll effect
        window.addEventListener('scroll', function() {
            var topbar = document.getElementById('topbar');
            if (topbar) {
                topbar.classList.toggle('scrolled', window.scrollY > 10);
            }
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', async function() {
            if (!checkAuth()) return;

            await loadNotifications();

            document.getElementById('loading-state').style.display = 'none';
            document.getElementById('content-wrapper').style.display = 'block';
        });

        // Load Notifications
        async function loadNotifications() {
            try {
                const data = await apiRequest('/api/patient-notifications');

                if (data && data.success && data.notifications) {
                    allNotifications = data.notifications;

                    // Update counts
                    const unreadCount = allNotifications.filter(n => !n.read_at).length;
                    document.getElementById('count-all').textContent = `(${allNotifications.length})`;
                    document.getElementById('count-unread').textContent = `(${unreadCount})`;

                    renderNotifications();
                } else {
                    renderNotifications();
                }
            } catch (error) {
                console.error('Error loading notifications:', error);
                showToast('Gagal memuat notifikasi', 'error');
            }
        }

        // Filter notifications
        function filterNotif(filter) {
            currentFilter = filter;

            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.filter === filter);
            });

            renderNotifications();
        }

        // Render notifications
        function renderNotifications() {
            const list = document.getElementById('notif-list');

            let notifications = [...allNotifications];
            if (currentFilter === 'unread') {
                notifications = notifications.filter(n => !n.read_at);
            }

            if (notifications.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">
                            <i class="fa-regular fa-bell-slash"></i>
                        </div>
                        <p>${currentFilter === 'unread' ? 'Tidak ada notifikasi yang belum dibaca' : 'Belum ada notifikasi'}</p>
                    </div>
                `;
                return;
            }

            // Group by date
            const grouped = {};
            notifications.forEach(notif => {
                const date = new Date(notif.created_at);
                const dateKey = getDateKey(date);
                if (!grouped[dateKey]) grouped[dateKey] = [];
                grouped[dateKey].push(notif);
            });

            let html = '';
            Object.keys(grouped).forEach(dateKey => {
                html += `
                    <div class="date-group">
                        <div class="date-header">${dateKey}</div>
                        ${grouped[dateKey].map(notif => renderNotifCard(notif)).join('')}
                    </div>
                `;
            });

            list.innerHTML = html;
        }

        // Get date key for grouping
        function getDateKey(date) {
            const today = new Date();
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);

            if (date.toDateString() === today.toDateString()) {
                return 'Hari Ini';
            } else if (date.toDateString() === yesterday.toDateString()) {
                return 'Kemarin';
            } else {
                return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
            }
        }

        // Get notification icon (Font Awesome 6)
        function getNotifIcon(type) {
            const iconMap = {
                'question_reply': 'fa-solid fa-reply',
                'thread_closed': 'fa-solid fa-circle-check',
                'booking_confirmed': 'fa-regular fa-calendar-check',
                'booking_cancelled': 'fa-regular fa-calendar-xmark',
                'appointment': 'fa-regular fa-calendar',
                'new_document': 'fa-regular fa-file-lines',
                'document': 'fa-regular fa-file-lines',
                'new_usg': 'fa-regular fa-image',
                'new_lab': 'fa-solid fa-flask',
                'announcement': 'fa-solid fa-bullhorn',
                'reminder': 'fa-solid fa-bell'
            };
            return iconMap[type] || 'fa-solid fa-bell';
        }

        // Render single notification card
        function renderNotifCard(notif) {
            const isUnread = !notif.read_at;
            const iconClass = getNotifIcon(notif.type);
            const timeStr = formatRelativeTime(notif.created_at);

            return `
                <div class="notif-card ${isUnread ? 'unread' : ''}" onclick="openNotification('${notif.id}', '${notif.type}', '${escapeHtml(JSON.stringify(notif.data || {}))}')">
                    <div class="notif-card-inner">
                        <div class="notif-icon">
                            <i class="${iconClass}"></i>
                        </div>
                        <div class="notif-content">
                            <div class="notif-title">${escapeHtml(notif.title)}</div>
                            <div class="notif-message">${escapeHtml(notif.message)}</div>
                            <div class="notif-time">
                                <i class="fa-regular fa-clock"></i> ${timeStr}
                            </div>
                        </div>
                        ${isUnread ? '<div class="unread-dot"></div>' : ''}
                    </div>
                </div>
            `;
        }

        // Open notification
        async function openNotification(id, type, dataStr) {
            // Mark as read
            try {
                await apiRequest(`/api/patient-notifications/${id}/read`, { method: 'POST' });

                // Update local state
                const notif = allNotifications.find(n => n.id == id);
                if (notif) notif.read_at = new Date().toISOString();

                // Update counts
                const unreadCount = allNotifications.filter(n => !n.read_at).length;
                document.getElementById('count-unread').textContent = `(${unreadCount})`;

                renderNotifications();
            } catch (e) {
                console.error('Error marking read:', e);
            }

            // Navigate based on type
            let data = {};
            try { data = JSON.parse(dataStr); } catch (e) {}

            switch (type) {
                case 'question_reply':
                case 'thread_closed':
                    window.location.href = `/tanya-dokter.html#history`;
                    break;
                case 'booking_confirmed':
                case 'booking_cancelled':
                case 'appointment':
                    window.location.href = '/booking-klinik.html';
                    break;
                case 'new_usg':
                    window.location.href = '/album-usg.html';
                    break;
                case 'new_lab':
                    window.location.href = '/hasil-lab.html';
                    break;
                case 'new_document':
                    window.location.href = '/dokumen-medis.html';
                    break;
                case 'document':
                    // Legacy type - check link or title to determine destination
                    if (data.link) {
                        window.location.href = data.link;
                    } else {
                        // Try to determine from notification content
                        const notif = allNotifications.find(n => n.id == id);
                        if (notif) {
                            const title = (notif.title || '').toLowerCase();
                            if (title.includes('usg')) {
                                window.location.href = '/album-usg.html';
                            } else if (title.includes('lab')) {
                                window.location.href = '/hasil-lab.html';
                            } else {
                                window.location.href = '/dokumen-medis.html';
                            }
                        } else {
                            window.location.href = '/dokumen-medis.html';
                        }
                    }
                    break;
                default:
                    // Stay on page
                    break;
            }
        }

        // Mark all as read
        async function markAllRead() {
            try {
                await apiRequest('/api/patient-notifications/read-all', { method: 'POST' });

                // Update local state
                allNotifications.forEach(n => {
                    if (!n.read_at) n.read_at = new Date().toISOString();
                });

                // Update counts
                document.getElementById('count-unread').textContent = '(0)';

                renderNotifications();
                showToast('Semua notifikasi ditandai sudah dibaca', 'success');
            } catch (e) {
                console.error('Error marking all read:', e);
                showToast('Gagal menandai notifikasi', 'error');
            }
        }
    </script>
    <script src="/js/patient-tracker.js?v=20260209"></script>
    <script src="/js/push-subscribe.js?v=20260209"></script>
    <script src="/scripts/portal-bottom-nav.js?v=20260621ruangbaca2" defer></script>
</body>
