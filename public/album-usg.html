<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>Album USG - dokterDIBYA</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/images/logo-dokter-dibya.png">
    <link rel="apple-touch-icon" href="/images/logo-dokter-dibya.png">

    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Shared Styles -->
    <link rel="stylesheet" href="/styles/patient-portal.css">

    <style>
        /* USG Gallery Styles */
        .usg-gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        @media (min-width: 500px) {
            .usg-gallery {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .usg-item {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .usg-item:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(40, 167, 233, 0.3);
        }

        .usg-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .usg-item .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            padding: 30px 10px 10px;
            color: white;
            font-size: 11px;
        }

        .usg-item .new-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #28e97f;
            color: #000;
            font-size: 10px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 10px;
            z-index: 3;
        }

        .usg-item .thumbnail-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: #ffd700;
            color: #000;
            font-size: 10px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 10px;
            z-index: 3;
        }

        .usg-item .type-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(40, 167, 233, 0.9);
            color: white;
            font-size: 10px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 10px;
            z-index: 2;
        }

        /* Filter Tabs */
        .filter-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .filter-tab {
            flex-shrink: 0;
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-tab.active {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border-color: #3b82f6;
            color: white;
        }

        .filter-tab:hover:not(.active) {
            background: rgba(59, 130, 246, 0.2);
            border-color: rgba(59, 130, 246, 0.5);
        }

        /* Stats */
        .stats-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-box {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }

        .stat-box .value {
            font-size: 24px;
            font-weight: 700;
            color: #3b82f6;
        }

        .stat-box .label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 3px;
        }

        /* Lightbox Modal */
        .lightbox-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000000;
            z-index: 9999;
            flex-direction: column;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        .lightbox-modal.active {
            display: flex;
        }

        .lightbox-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            padding-top: calc(15px + env(safe-area-inset-top, 0px));
            background: #000000;
        }

        .lightbox-header h3 {
            font-size: 14px;
            color: white;
        }

        .lightbox-close {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
        }

        .lightbox-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: auto;
        }

        .lightbox-body img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }

        .lightbox-footer {
            padding: 15px 20px;
            padding-bottom: calc(15px + env(safe-area-inset-bottom, 0px));
            background: #000000;
            text-align: center;
        }

        .lightbox-footer .date {
            font-size: 14px;
            color: white;
            margin-bottom: 5px;
        }

        .lightbox-footer .notes {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
        }

        .lightbox-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }

        .lightbox-actions button {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .lightbox-actions .btn-thumbnail {
            background: rgba(255, 215, 0, 0.2);
            border: 1px solid #ffd700;
            color: #ffd700;
        }

        .lightbox-actions .btn-thumbnail.active {
            background: #ffd700;
            color: #000;
        }

        .lightbox-actions .btn-download {
            background: rgba(40, 167, 233, 0.2);
            border: 1px solid #28a7e9;
            color: #28a7e9;
        }

        /* Navigation Arrows */
        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            font-size: 24px;
            padding: 15px;
            cursor: pointer;
            z-index: 10;
        }

        .lightbox-nav:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .lightbox-nav.prev {
            left: 10px;
        }

        .lightbox-nav.next {
            right: 10px;
        }
    </style>
</head>
<body>
    <!-- Safe Area Overlays -->
    <div class="safe-area-top" style="position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0);background:#000000;z-index:9999;"></div>
    <div class="safe-area-bottom" style="position:fixed;bottom:0;left:0;right:0;height:env(safe-area-inset-bottom,0);background:#000000;z-index:9999;"></div>
    <!-- Top Navbar -->
    <nav class="nav-bar">
        <div class="nav-left">
            <button class="back-btn" onclick="history.back()">
                <i class="fa fa-chevron-left"></i>
            </button>
            <h1 class="page-title">Album USG</h1>
        </div>
        <div class="nav-right">
            <span id="total-count" style="font-size: 12px; color: rgba(255,255,255,0.6);">0 foto</span>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="content">
        <!-- Loading State -->
        <div class="loading" id="loading-state">
            <i class="fa fa-spinner fa-spin"></i>
            <span>Memuat album...</span>
        </div>

        <!-- Content (hidden until loaded) -->
        <div id="content-wrapper" style="display: none;">
            <!-- Stats -->
            <div class="stats-row">
                <div class="stat-box">
                    <div class="value" id="stat-total">0</div>
                    <div class="label">Total Foto</div>
                </div>
                <div class="stat-box">
                    <div class="value" id="stat-new">0</div>
                    <div class="label">Foto Baru</div>
                </div>
            </div>

            <!-- Filter Tabs -->
            <div class="filter-tabs">
                <div class="filter-tab active" data-type="all" onclick="filterByType('all')">Semua</div>
                <div class="filter-tab" data-type="usg_2d" onclick="filterByType('usg_2d')">USG 2D</div>
                <div class="filter-tab" data-type="usg_4d" onclick="filterByType('usg_4d')">USG 4D</div>
            </div>

            <!-- Gallery -->
            <div class="usg-gallery" id="usg-gallery">
                <!-- USG items will be populated -->
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="/patient-menu.html" class="nav-item">
            <i class="fa fa-home"></i>
            <span>Home</span>
        </a>
        <a href="/notifikasi.html" class="nav-item">
            <i class="fa fa-bell"></i>
            <span>Notifikasi</span>
        </a>
        <a href="/profil.html" class="nav-item">
            <i class="fa fa-user"></i>
            <span>Profil</span>
        </a>
    </nav>

    <!-- Lightbox Modal -->
    <div class="lightbox-modal" id="lightbox-modal">
        <div class="lightbox-header">
            <h3 id="lightbox-title">USG</h3>
            <button class="lightbox-close" onclick="closeLightbox()">
                <i class="fa fa-times"></i>
            </button>
        </div>
        <div class="lightbox-body">
            <button class="lightbox-nav prev" onclick="navigateLightbox(-1)">
                <i class="fa fa-chevron-left"></i>
            </button>
            <img id="lightbox-img" src="" alt="USG">
            <button class="lightbox-nav next" onclick="navigateLightbox(1)">
                <i class="fa fa-chevron-right"></i>
            </button>
        </div>
        <div class="lightbox-footer">
            <div class="date" id="lightbox-date"></div>
            <div class="notes" id="lightbox-notes"></div>
            <div class="lightbox-actions">
                <button class="btn-thumbnail" id="btn-thumbnail" onclick="setAsThumbnail()">
                    <i class="fa fa-star-o"></i> Set Thumbnail
                </button>
                <button class="btn-download" onclick="downloadImage()">
                    <i class="fa fa-download"></i> Download
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Socket.IO for real-time USG updates from staff -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        (function() {
            var socketUrl = location.hostname === 'localhost'
                ? 'http://localhost:3000'
                : 'https://dokterdibya.com';
            var socket = io(socketUrl, { transports: ['polling'] });

            socket.on('usg:patient_updated', function(data) {
                if (window.refreshUsgGallery) {
                    window.refreshUsgGallery();
                }
            });
        })();
    </script>

    <script type="module">
        import { getToken, checkAuth, apiRequest, showToast, formatDate, showEmptyState, escapeHtml } from '/scripts/patient-utils.js';

        // State
        let allImages = [];
        let filteredImages = [];
        let currentFilter = 'all';
        let currentLightboxIndex = 0;
        let customThumbnailId = localStorage.getItem('usg_thumbnail_id');
        let detectedTypes = {}; // Cache for detected 2D/4D types

        // Make functions globally available
        window.filterByType = filterByType;
        window.openLightbox = openLightbox;
        window.closeLightbox = closeLightbox;
        window.navigateLightbox = navigateLightbox;
        window.setAsThumbnail = setAsThumbnail;
        window.downloadImage = downloadImage;
        window.refreshUsgGallery = loadUsgImages;

        /**
         * Analyze image to determine if it's grayscale (2D) or colored (4D)
         * @param {string} imageUrl - URL of the image to analyze
         * @returns {Promise<string>} - 'usg_2d' or 'usg_4d'
         */
        async function detectUsgType(imageUrl) {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';

                img.onload = function() {
                    try {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');

                        // Sample a smaller version for performance
                        const sampleSize = 100;
                        canvas.width = sampleSize;
                        canvas.height = sampleSize;

                        ctx.drawImage(img, 0, 0, sampleSize, sampleSize);
                        const imageData = ctx.getImageData(0, 0, sampleSize, sampleSize);
                        const pixels = imageData.data;

                        let coloredPixels = 0;
                        const threshold = 15; // Tolerance for color difference
                        const totalSamples = (sampleSize * sampleSize);

                        // Sample pixels to check for color
                        for (let i = 0; i < pixels.length; i += 4) {
                            const r = pixels[i];
                            const g = pixels[i + 1];
                            const b = pixels[i + 2];

                            // Check if pixel has significant color difference (not grayscale)
                            const rgDiff = Math.abs(r - g);
                            const gbDiff = Math.abs(g - b);
                            const rbDiff = Math.abs(r - b);

                            if (rgDiff > threshold || gbDiff > threshold || rbDiff > threshold) {
                                coloredPixels++;
                            }
                        }

                        // If more than 5% of pixels are colored, it's 4D
                        const colorRatio = coloredPixels / totalSamples;
                        resolve(colorRatio > 0.05 ? 'usg_4d' : 'usg_2d');
                    } catch (e) {
                        console.error('Error analyzing image:', e);
                        resolve('usg_2d'); // Default to 2D on error
                    }
                };

                img.onerror = function() {
                    resolve('usg_2d'); // Default to 2D on error
                };

                img.src = imageUrl;
            });
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', async function() {
            if (!checkAuth()) return;

            await loadUsgImages();

            document.getElementById('loading-state').style.display = 'none';
            document.getElementById('content-wrapper').style.display = 'block';
        });

        // Load USG Images
        async function loadUsgImages() {
            try {
                // Fetch all USG types
                const [responsePhoto, response2d, response4d] = await Promise.all([
                    apiRequest('/api/patient-documents/my-documents?type=usg_photo'),
                    apiRequest('/api/patient-documents/my-documents?type=usg_2d'),
                    apiRequest('/api/patient-documents/my-documents?type=usg_4d')
                ]);

                allImages = [];

                // Add explicitly typed images
                if (response2d && response2d.success && response2d.documents) {
                    allImages = allImages.concat(response2d.documents.map(d => ({ ...d, type: 'usg_2d', detectedType: 'usg_2d' })));
                }
                if (response4d && response4d.success && response4d.documents) {
                    allImages = allImages.concat(response4d.documents.map(d => ({ ...d, type: 'usg_4d', detectedType: 'usg_4d' })));
                }

                // Add usg_photo images (will detect 2D/4D automatically)
                if (responsePhoto && responsePhoto.success && responsePhoto.documents) {
                    allImages = allImages.concat(responsePhoto.documents.map(d => ({ ...d, type: 'usg_photo', detectedType: null })));
                }

                // Sort by date descending
                allImages.sort((a, b) => new Date(b.published_at || b.created_at) - new Date(a.published_at || a.created_at));

                // Update stats
                const newCount = allImages.filter(img => !img.first_viewed_at).length;
                document.getElementById('stat-total').textContent = allImages.length;
                document.getElementById('stat-new').textContent = newCount;
                document.getElementById('total-count').textContent = `${allImages.length} foto`;

                filterByType('all');

                // Auto-detect types for usg_photo images in background
                detectAllImageTypes();
            } catch (error) {
                console.error('Error loading USG:', error);
                showToast('Gagal memuat album', 'error');
            }
        }

        // Detect types for all usg_photo images
        async function detectAllImageTypes() {
            const photosToDetect = allImages.filter(img => img.type === 'usg_photo' && !img.detectedType);

            for (const img of photosToDetect) {
                try {
                    // Check cache first
                    const cacheKey = `usg_type_${img.id}`;
                    const cached = localStorage.getItem(cacheKey);

                    if (cached) {
                        img.detectedType = cached;
                    } else {
                        const detected = await detectUsgType(img.file_url);
                        img.detectedType = detected;
                        // Cache the result
                        localStorage.setItem(cacheKey, detected);
                    }
                } catch (e) {
                    console.error('Error detecting type for image:', img.id, e);
                    img.detectedType = 'usg_2d'; // Default to 2D
                }
            }

            // Re-render if any types were detected
            if (photosToDetect.length > 0) {
                renderGallery();
            }
        }

        // Filter by type
        function filterByType(type) {
            currentFilter = type;

            // Update tabs
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.type === type);
            });

            // Filter images - use detectedType for better accuracy
            if (type === 'all') {
                filteredImages = [...allImages];
            } else {
                filteredImages = allImages.filter(img => {
                    // Use detectedType if available, otherwise use original type
                    const effectiveType = img.detectedType || img.type;
                    return effectiveType === type || img.document_type === type;
                });
            }

            renderGallery();
        }

        // Render gallery
        function renderGallery() {
            const gallery = document.getElementById('usg-gallery');

            if (filteredImages.length === 0) {
                gallery.innerHTML = `
                    <div style="grid-column: 1 / -1;">
                        <div class="empty-state">
                            <i class="fa fa-image"></i>
                            <p>Belum ada foto USG</p>
                        </div>
                    </div>
                `;
                return;
            }

            const typeLabels = {
                'usg_2d': '2D',
                'usg_4d': '4D'
            };

            gallery.innerHTML = filteredImages.map((img, index) => {
                const date = new Date(img.published_at || img.created_at);
                const dateStr = date.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
                const isNew = !img.first_viewed_at;
                const isThumbnail = customThumbnailId && parseInt(customThumbnailId) === img.id;

                // Use detectedType for badge, fallback to original type
                const effectiveType = img.detectedType || img.type;
                const typeLabel = typeLabels[effectiveType] || '';

                return `
                    <div class="usg-item" onclick="openLightbox(${index})">
                        ${isNew ? '<span class="new-badge">BARU</span>' : ''}
                        ${isThumbnail ? '<span class="thumbnail-badge"><i class="fa fa-star"></i></span>' : ''}
                        ${currentFilter === 'all' && typeLabel ? `<span class="type-badge">${typeLabel}</span>` : ''}
                        <img src="${img.file_url}" alt="USG ${dateStr}" loading="lazy"
                             onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27200%27 height=%27200%27%3E%3Crect width=%27200%27 height=%27200%27 fill=%27%23404040%27/%3E%3Ctext x=%2750%25%27 y=%2750%25%27 font-size=%2720%27 fill=%27%2328a7e9%27 text-anchor=%27middle%27 dy=%27.3em%27%3EError%3C/text%3E%3C/svg%3E'">
                        <div class="overlay">
                            ${dateStr}
                            ${img.title ? '<br>' + escapeHtml(img.title) : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Open lightbox
        async function openLightbox(index) {
            currentLightboxIndex = index;
            const img = filteredImages[index];

            document.getElementById('lightbox-modal').classList.add('active');
            document.body.style.overflow = 'hidden';

            updateLightboxContent(img);

            // Mark as viewed
            if (!img.first_viewed_at) {
                try {
                    await apiRequest(`/api/patient-documents/${img.id}/view`, { method: 'POST' });
                    img.first_viewed_at = new Date().toISOString();
                    // Update stats
                    const newCount = allImages.filter(i => !i.first_viewed_at).length;
                    document.getElementById('stat-new').textContent = newCount;
                } catch (e) {
                    console.error('Error marking viewed:', e);
                }
            }
        }

        // Update lightbox content
        function updateLightboxContent(img) {
            const date = new Date(img.published_at || img.created_at);
            const dateStr = date.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

            document.getElementById('lightbox-img').src = img.file_url;
            document.getElementById('lightbox-date').textContent = dateStr;
            document.getElementById('lightbox-notes').textContent = img.title || img.description || '';
            document.getElementById('lightbox-title').textContent = img.title || 'USG';

            // Update thumbnail button
            const isThumbnail = customThumbnailId && parseInt(customThumbnailId) === img.id;
            const btnThumbnail = document.getElementById('btn-thumbnail');
            if (isThumbnail) {
                btnThumbnail.classList.add('active');
                btnThumbnail.innerHTML = '<i class="fa fa-star"></i> Thumbnail';
            } else {
                btnThumbnail.classList.remove('active');
                btnThumbnail.innerHTML = '<i class="fa fa-star-o"></i> Set Thumbnail';
            }
        }

        // Close lightbox
        function closeLightbox() {
            document.getElementById('lightbox-modal').classList.remove('active');
            document.body.style.overflow = '';
        }

        // Navigate lightbox
        function navigateLightbox(direction) {
            currentLightboxIndex += direction;

            if (currentLightboxIndex < 0) {
                currentLightboxIndex = filteredImages.length - 1;
            } else if (currentLightboxIndex >= filteredImages.length) {
                currentLightboxIndex = 0;
            }

            updateLightboxContent(filteredImages[currentLightboxIndex]);
        }

        // Set as thumbnail
        function setAsThumbnail() {
            const img = filteredImages[currentLightboxIndex];
            customThumbnailId = img.id.toString();
            localStorage.setItem('usg_thumbnail_id', customThumbnailId);

            // Update button
            const btnThumbnail = document.getElementById('btn-thumbnail');
            btnThumbnail.classList.add('active');
            btnThumbnail.innerHTML = '<i class="fa fa-star"></i> Thumbnail';

            showToast('Berhasil diset sebagai thumbnail', 'success');

            // Re-render gallery to show badge
            renderGallery();
        }

        // Download image
        function downloadImage() {
            const img = filteredImages[currentLightboxIndex];
            const link = document.createElement('a');
            link.href = img.file_url;
            link.download = `USG_${new Date(img.published_at || img.created_at).toISOString().split('T')[0]}.jpg`;
            link.target = '_blank';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (!document.getElementById('lightbox-modal').classList.contains('active')) return;

            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') navigateLightbox(-1);
            if (e.key === 'ArrowRight') navigateLightbox(1);
        });
    </script>
<script src="/js/patient-tracker.js?v=20260209"></script>
<script src="/js/push-subscribe.js?v=20260209"></script>
</body>
</html>
