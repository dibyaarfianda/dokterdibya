<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ruang Membaca - dokterDIBYA</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: #000000;
            min-height: 100vh;
            color: #ffffff;
            padding-bottom: 80px;
            padding-top: env(safe-area-inset-top, 0px);
        }

        .safe-area-top {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: env(safe-area-inset-top, 0px);
            background: #000000;
            z-index: 9999;
        }

        .safe-area-bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: env(safe-area-inset-bottom, 0px);
            background: #000000;
            z-index: 9999;
        }

        /* Navbar */
        .nav-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            padding-top: max(15px, env(safe-area-inset-top));
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .page-title {
            font-size: 18px;
            font-weight: 600;
            color: #f59e0b;
        }

        /* Main Content */
        .content {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Intro Card */
        .intro-card {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .intro-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -30%;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }

        .intro-card h2 {
            font-size: 18px;
            margin-bottom: 8px;
            position: relative;
        }

        .intro-card p {
            font-size: 13px;
            opacity: 0.9;
            line-height: 1.5;
            position: relative;
        }

        /* Filter Tabs */
        .filter-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .filter-tab {
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            color: #888;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-tab.active {
            background: rgba(245, 158, 11, 0.2);
            border-color: #f59e0b;
            color: #f59e0b;
        }

        /* Article Card */
        .article-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .article-card:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
        }

        .article-header {
            display: flex;
            gap: 15px;
            margin-bottom: 12px;
        }

        .article-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #fff;
            flex-shrink: 0;
        }

        .article-meta {
            flex: 1;
        }

        .article-category {
            display: inline-block;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 10px;
            margin-bottom: 6px;
            color: #fff;
        }

        .article-title {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            line-height: 1.4;
            margin-bottom: 4px;
        }

        .article-date {
            font-size: 11px;
            color: #888;
        }

        .article-summary {
            font-size: 13px;
            color: #aaa;
            line-height: 1.5;
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .article-source {
            font-size: 11px;
            color: #888;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .article-source i {
            color: #f59e0b;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.5);
        }

        .empty-state i {
            font-size: 50px;
            margin-bottom: 15px;
            color: #f59e0b;
            opacity: 0.5;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 60px;
            color: rgba(255, 255, 255, 0.6);
        }

        .loading i {
            margin-right: 8px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Article Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            display: none;
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: block;
        }

        .modal-content {
            background: #000000;
            min-height: 100vh;
            padding-top: env(safe-area-inset-top, 0px);
        }

        .modal-header {
            padding: 60px 20px 25px;
            padding-top: calc(20px + env(safe-area-inset-top, 0px));
            position: relative;
            text-align: center;
        }

        .modal-close {
            position: absolute;
            top: calc(15px + env(safe-area-inset-top, 0px));
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            z-index: 10;
        }

        .modal-icon {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: #fff;
            margin: 0 auto 15px;
        }

        .modal-category {
            display: inline-block;
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            margin-bottom: 12px;
        }

        .modal-title {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            line-height: 1.3;
        }

        .modal-body {
            padding: 25px 20px 40px;
            max-width: 600px;
            margin: 0 auto;
        }

        .modal-meta {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-meta-item {
            font-size: 12px;
            color: #888;
        }

        .modal-meta-item i {
            color: #f59e0b;
            margin-right: 5px;
        }

        .modal-text {
            font-size: 15px;
            color: #ccc;
            line-height: 1.8;
        }

        .modal-text p {
            margin-bottom: 15px;
        }

        .modal-text h3 {
            color: #fff;
            font-size: 17px;
            margin: 25px 0 15px;
        }

        .modal-text ul, .modal-text ol {
            margin-left: 20px;
            margin-bottom: 15px;
        }

        .modal-text li {
            margin-bottom: 8px;
        }

        /* Markdown styles */
        .modal-text h1 {
            color: #fff;
            font-size: 22px;
            margin: 30px 0 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 10px;
        }

        .modal-text h2 {
            color: #fff;
            font-size: 19px;
            margin: 25px 0 12px;
        }

        .modal-text h3 {
            color: #fff;
            font-size: 17px;
            margin: 25px 0 15px;
        }

        .modal-text h4, .modal-text h5, .modal-text h6 {
            color: #f59e0b;
            font-size: 15px;
            margin: 20px 0 10px;
        }

        .modal-text strong {
            color: #fff;
            font-weight: 600;
        }

        .modal-text em {
            font-style: italic;
            color: #ddd;
        }

        .modal-text code {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
            color: #f59e0b;
        }

        .modal-text pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 15px 0;
        }

        .modal-text pre code {
            background: none;
            padding: 0;
            color: #ddd;
        }

        .modal-text blockquote {
            border-left: 3px solid #f59e0b;
            padding-left: 15px;
            margin: 15px 0;
            color: #aaa;
            font-style: italic;
        }

        .modal-text hr {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            margin: 25px 0;
        }

        .modal-text a {
            color: #f59e0b;
            text-decoration: underline;
        }

        .modal-text table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
        }

        .modal-text th, .modal-text td {
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px;
            text-align: left;
        }

        .modal-text th {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .modal-text img {
            max-width: 100%;
            border-radius: 8px;
            margin: 15px 0;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 0;
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            background: rgba(0, 0, 0, 0.98);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
        }

        /* Pull to Refresh */
        .pull-indicator {
            position: fixed;
            top: calc(env(safe-area-inset-top, 0px) + 60px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(245, 158, 11, 0.9);
            color: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 200;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .pull-indicator.visible {
            opacity: 1;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 12px;
            padding: 8px 20px;
            transition: color 0.3s;
        }

        .nav-item.active,
        .nav-item:hover {
            color: #f59e0b;
        }

        .nav-item i {
            font-size: 20px;
        }

        /* Responsive */
        @media (max-width: 400px) {
            .content { padding: 15px; }
            .article-card { padding: 12px; }
        }
    </style>
</head>
<body>
    <div class="safe-area-top"></div>
    <div class="safe-area-bottom"></div>

    <!-- Top Navbar -->
    <nav class="nav-bar">
        <div class="nav-left">
            <button class="back-btn" onclick="history.back()">
                <i class="fa fa-chevron-left"></i>
            </button>
            <h1 class="page-title"><i class="fa fa-book"></i> Ruang Membaca</h1>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="content">
        <!-- Intro Card -->
        <div class="intro-card">
            <h2><i class="fa fa-graduation-cap"></i> Artikel Kesehatan</h2>
            <p>Artikel pilihan berdasarkan jurnal dan panduan medis terkini tentang kehamilan dan kesehatan kandungan.</p>
        </div>

        <!-- Filter Tabs -->
        <div class="filter-tabs">
            <button class="filter-tab active" data-filter="all">Semua</button>
            <button class="filter-tab" data-filter="kehamilan">Kehamilan</button>
            <button class="filter-tab" data-filter="program_hamil">Program Hamil</button>
            <button class="filter-tab" data-filter="gangguan_kandungan">Ginekologi</button>
        </div>

        <!-- Articles Container -->
        <div id="articles-container">
            <div class="loading">
                <i class="fa fa-spinner fa-spin"></i> Memuat artikel...
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="/patient-menu.html" class="nav-item">
            <i class="fa fa-home"></i>
            <span>Home</span>
        </a>
        <a href="/notifikasi.html" class="nav-item">
            <i class="fa fa-bell"></i>
            <span>Notifikasi</span>
        </a>
        <a href="/profil.html" class="nav-item">
            <i class="fa fa-user"></i>
            <span>Profil</span>
        </a>
    </nav>

    <!-- Pull Indicator -->
    <div class="pull-indicator" id="pullIndicator">
        <i class="fa fa-refresh"></i> Lepas untuk refresh
    </div>

    <!-- Article Modal -->
    <div class="modal-overlay" id="articleModal">
        <div class="modal-content">
            <div class="modal-header" id="modalHeader">
                <button class="modal-close" onclick="closeModal()">
                    <i class="fa fa-arrow-left"></i>
                </button>
                <div class="modal-icon" id="modalIcon">
                    <i class="fa fa-book"></i>
                </div>
                <span class="modal-category" id="modalCategory">Kategori</span>
                <h2 class="modal-title" id="modalTitle">Judul Artikel</h2>
            </div>
            <div class="modal-body">
                <div class="modal-meta">
                    <div class="modal-meta-item">
                        <i class="fa fa-book"></i>
                        <span id="modalSource">dokterDIBYA</span>
                    </div>
                    <div class="modal-meta-item">
                        <i class="fa fa-calendar"></i>
                        <span id="modalDate">-</span>
                    </div>
                </div>
                <div class="modal-text" id="modalText">
                    <!-- Article content here -->
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { checkAuth } from '/scripts/patient-utils.js';

        // Check auth
        if (!checkAuth()) {
            // Redirect handled by checkAuth
        }

        let articles = [];
        let currentFilter = 'all';

        // Setup filter tabs
        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentFilter = tab.dataset.filter;
                loadArticles();
            });
        });

        // Load articles
        loadArticles();

        async function loadArticles() {
            const container = document.getElementById('articles-container');
            container.innerHTML = `
                <div class="loading">
                    <i class="fa fa-spinner fa-spin"></i> Memuat artikel...
                </div>
            `;

            try {
                const params = new URLSearchParams({ limit: 50 });
                if (currentFilter !== 'all') {
                    params.append('category', currentFilter);
                }

                const response = await fetch(`/api/articles?${params}`);
                const result = await response.json();

                if (!result.success || !result.data) {
                    throw new Error('Failed to load articles');
                }

                articles = result.data;
                renderArticles();

            } catch (error) {
                console.error('Error:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fa fa-exclamation-circle"></i>
                        <p>Gagal memuat artikel</p>
                    </div>
                `;
            }
        }

        function renderArticles() {
            const container = document.getElementById('articles-container');

            if (articles.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fa fa-newspaper-o"></i>
                        <p>Belum ada artikel</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = articles.map(article => {
                const color = article.color || '#f59e0b';
                const icon = article.icon || 'fa-book';
                const dateStr = formatDate(article.created_at);
                const source = article.source || 'dokterDIBYA';

                return `
                    <div class="article-card" onclick="openArticle(${article.id})">
                        <div class="article-header">
                            <div class="article-icon" style="background: ${color};">
                                <i class="fa ${icon}"></i>
                            </div>
                            <div class="article-meta">
                                <span class="article-category" style="background: ${color};">${escapeHtml(article.category || 'Kehamilan')}</span>
                                <h3 class="article-title">${escapeHtml(article.title)}</h3>
                                <span class="article-date">${dateStr}</span>
                            </div>
                        </div>
                        <p class="article-summary">${escapeHtml(article.summary || '')}</p>
                        <div class="article-source">
                            <i class="fa fa-book"></i>
                            <span>${escapeHtml(source)}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
                           'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            return `${months[date.getMonth()]} ${date.getFullYear()}`;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        window.openArticle = async function(id) {
            const modal = document.getElementById('articleModal');
            document.getElementById('modalIcon').innerHTML = '<i class="fa fa-spinner fa-spin"></i>';
            document.getElementById('modalCategory').textContent = 'Memuat...';
            document.getElementById('modalTitle').textContent = '';
            document.getElementById('modalText').innerHTML = '<p style="text-align: center;"><i class="fa fa-spinner fa-spin"></i> Memuat...</p>';
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';

            try {
                const response = await fetch(`/api/articles/${id}`);
                const result = await response.json();

                if (!result.success || !result.data) {
                    throw new Error('Article not found');
                }

                const article = result.data;
                const color = article.color || '#f59e0b';
                const icon = article.icon || 'fa-book';
                const dateStr = formatDate(article.updated_at || article.created_at);

                document.getElementById('modalHeader').style.background = color;
                document.getElementById('modalIcon').innerHTML = `<i class="fa ${icon}"></i>`;
                document.getElementById('modalCategory').textContent = article.category || 'Kehamilan';
                document.getElementById('modalTitle').textContent = article.title;
                document.getElementById('modalSource').textContent = article.source || 'dokterDIBYA';
                document.getElementById('modalDate').textContent = dateStr;
                // Parse markdown content
                const content = article.content || 'Konten tidak tersedia';
                document.getElementById('modalText').innerHTML = marked.parse(content);

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('modalText').innerHTML = '<p>Gagal memuat artikel</p>';
            }
        };

        window.closeModal = function() {
            document.getElementById('articleModal').classList.remove('active');
            document.body.style.overflow = '';
        };

        // Close modal with back button
        window.addEventListener('popstate', () => {
            const modal = document.getElementById('articleModal');
            if (modal.classList.contains('active')) {
                closeModal();
            }
        });

        // Pull to Refresh
        let touchStartY = 0;
        let touchEndY = 0;
        const pullIndicator = document.getElementById('pullIndicator');

        document.addEventListener('touchstart', function(e) {
            if (window.scrollY === 0) {
                touchStartY = e.touches[0].clientY;
            }
        }, { passive: true });

        document.addEventListener('touchmove', function(e) {
            if (window.scrollY === 0 && touchStartY > 0) {
                touchEndY = e.touches[0].clientY;
                const pullDistance = touchEndY - touchStartY;
                if (pullDistance > 80) {
                    pullIndicator.classList.add('visible');
                } else {
                    pullIndicator.classList.remove('visible');
                }
            }
        }, { passive: true });

        document.addEventListener('touchend', function(e) {
            if (window.scrollY === 0 && touchStartY > 0) {
                const pullDistance = touchEndY - touchStartY;
                if (pullDistance > 80) {
                    pullIndicator.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Memuat...';
                    setTimeout(function() {
                        window.location.reload();
                    }, 300);
                }
            }
            touchStartY = 0;
            touchEndY = 0;
            pullIndicator.classList.remove('visible');
        }, { passive: true });
    </script>
</body>
</html>
