<!DOCTYPE html>
<html lang="id">
<head>
    <script src="/scripts/patient-session.js?v=20260731hardening1"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login dengan Google...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0f0f1a;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            padding: 20px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: #0066FF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error {
            color: #ef4444;
            margin-top: 20px;
        }
        a {
            color: #0066FF;
            text-decoration: none;
        }
    </style>
    <script src="/scripts/patient-theme.js"></script>
    <script src="/scripts/patient-native-app-guard.js?v=20260605pwa1"></script>
</head>
<body>
    <div class="container">
        <div class="spinner" id="spinner"></div>
        <h2 id="status">Memproses login...</h2>
        <p id="message">Harap tunggu sebentar</p>
        <div class="error" id="error" style="display:none;"></div>
    </div>

    <script>
        async function handleCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const error = urlParams.get('error');

            if (error) {
                showError('Login dibatalkan atau gagal: ' + error);
                return;
            }

            if (!code) {
                showError('Kode otorisasi tidak ditemukan');
                return;
            }

            try {
                // Get registration code from localStorage (set by mobile app before OAuth)
                const pendingRegCode = localStorage.getItem('pending_reg_code');
                console.log('[CALLBACK] Registration code from localStorage:', pendingRegCode || 'none');

                // Exchange code for token via backend
                const res = await fetch('/api/patients/google-auth-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        code,
                        redirectUri: 'https://dokterdibya.com/mobile-google-callback.html',
                        registration_code: pendingRegCode || undefined
                    })
                });

                const data = await res.json();

                // Clear pending registration code after use
                localStorage.removeItem('pending_reg_code');

                if (res.ok && data.success) {
                    document.getElementById('status').textContent = 'Login berhasil!';
                    document.getElementById('message').textContent = 'Mengalihkan...';

                    // Check if coming from mobile app
                    // Mobile app sets this flag before opening Google OAuth
                    const fromMobileApp = localStorage.getItem('from_mobile_app') === 'true';

                    // Also check if Capacitor is available (means we're in app webview)
                    const isCapacitor = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform();

                    if (fromMobileApp || isCapacitor) {
                        // Mobile app flow - show button to open app
                        const tokenData = encodeURIComponent(data.token);
                        const userData = encodeURIComponent(JSON.stringify(data.user));

                        // Intent URL for Android Chrome
                        const intentUrl = `intent://login?token=${tokenData}&user=${userData}#Intent;scheme=dokterdibya;package=com.dokterdibya.patient;end`;

                        // Show buttons - NO auto redirect (it doesn't work)
                        document.getElementById('spinner').style.display = 'none';
                        document.getElementById('message').innerHTML = `
                            <p style="margin-bottom:20px;color:#10b981;">Login Google berhasil!</p>
                            <a href="${intentUrl}" style="display:inline-block;padding:15px 30px;background:#0066FF;color:white;border-radius:10px;text-decoration:none;font-size:16px;margin-bottom:15px;">
                                Buka Aplikasi dokterDIBYA
                            </a>
                            <br><br>
                            <small style="color:rgba(255,255,255,0.6);">Tap tombol di atas untuk kembali ke aplikasi</small>
                        `;

                        // Clear the flag
                        localStorage.removeItem('from_mobile_app');
                    } else {
                        // Web browser flow - store token and redirect to dashboard
                        window.PatientSession.setToken(data.token, { persistent: true });
                        if (data.user) {
                            localStorage.setItem('patient_user', JSON.stringify(data.user));
                        }
                        localStorage.setItem('auth_provider', 'google');

                        // Redirect to patient menu
                        window.location.href = '/patient-menu.html';
                    }
                } else {
                    // Check if registration code is required
                    if (data.code_required) {
                        showRegistrationRequired();
                    } else {
                        showError(data.message || 'Login gagal. Silakan coba lagi.');
                    }
                }
            } catch (err) {
                console.error('Auth error:', err);
                showError('Terjadi kesalahan. Silakan coba lagi.');
            }
        }

        function showError(message) {
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('status').textContent = 'Login Gagal';
            document.getElementById('message').innerHTML = message + '<br><br><a href="/patient-login.html?mode=register">Kembali ke halaman daftar</a>';
        }

        function showRegistrationRequired() {
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('status').textContent = 'Pendaftaran Diperlukan';
            document.getElementById('status').style.color = '#f59e0b';

            // Check if in mobile app or web browser
            const fromMobileApp = localStorage.getItem('from_mobile_app') === 'true';
            const isCapacitor = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform();
            const isMobileApp = fromMobileApp || isCapacitor;

            // Intent URL to open app at registration page
            const intentUrl = 'intent://register#Intent;scheme=dokterdibya;package=com.dokterdibya.patient;end';

            if (isMobileApp) {
                document.getElementById('message').innerHTML = `
                    <div style="background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 12px; padding: 16px; margin-bottom: 20px; text-align: left;">
                        <p style="color: #f59e0b; margin: 0 0 10px 0; font-weight: 600;">Akun belum terdaftar</p>
                        <p style="color: rgba(255,255,255,0.8); margin: 0; font-size: 14px;">
                            Untuk mendaftar sebagai pasien baru, Anda memerlukan <strong>kode registrasi</strong>. Silakan:
                        </p>
                        <ol style="color: rgba(255,255,255,0.8); margin: 10px 0 0 0; padding-left: 20px; font-size: 14px;">
                            <li>Kembali ke aplikasi</li>
                            <li>Pilih menu <strong>"Daftar"</strong></li>
                            <li>Masukkan kode registrasi dari klinik</li>
                            <li>Lanjutkan dengan Google</li>
                        </ol>
                    </div>
                    <a href="${intentUrl}" style="display:inline-block;padding:15px 30px;background:#0066FF;color:white;border-radius:10px;text-decoration:none;font-size:16px;margin-bottom:15px;">
                        Buka Aplikasi
                    </a>
                    <br><br>
                    <small style="color:rgba(255,255,255,0.5);">Tap tombol di atas untuk kembali ke aplikasi</small>
                `;
            } else {
                // Web/PWA flow - redirect back to login page with registration
                document.getElementById('message').innerHTML = `
                    <div style="background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 12px; padding: 16px; margin-bottom: 20px; text-align: left;">
                        <p style="color: #f59e0b; margin: 0 0 10px 0; font-weight: 600;">Akun belum terdaftar</p>
                        <p style="color: rgba(255,255,255,0.8); margin: 0; font-size: 14px;">
                            Untuk mendaftar sebagai pasien baru, Anda memerlukan <strong>kode registrasi</strong> dari klinik. Pilih <strong>"Daftar"</strong> untuk memasukkan kode.
                        </p>
                    </div>
                    <a href="/patient-login.html?mode=register" style="display:inline-block;padding:15px 30px;background:#0066FF;color:white;border-radius:10px;text-decoration:none;font-size:16px;margin-bottom:15px;">
                        Kembali ke Daftar
                    </a>
                `;
            }
        }

        handleCallback();
    </script>
</body>
</html>
