<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a1a">
    <title>Menu - dokterDIBYA</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/images/logo-dokter-dibya.png">
    <link rel="apple-touch-icon" href="/images/logo-dokter-dibya.png">

    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #303030 100%);
            min-height: 100vh;
            color: #ffffff;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }

        /* Navbar */
        .nav-bar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 12px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-brand {
            display: flex;
            flex-direction: column;
        }

        .nav-brand h1 {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
        }

        .nav-brand h1 span {
            color: #28a7e9;
        }

        .nav-brand p {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .notification-bell {
            position: relative;
            cursor: pointer;
            padding: 8px;
        }

        .notification-bell i {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.8);
        }

        .notification-badge {
            position: absolute;
            top: 2px;
            right: 2px;
            background: #ef4444;
            color: white;
            font-size: 10px;
            font-weight: 600;
            min-width: 18px;
            height: 18px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            display: none;
        }

        /* Profile Summary */
        .profile-summary {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 20px;
            margin: 15px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .profile-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0066FF 0%, #00D4FF 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 600;
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(0, 102, 255, 0.3);
            overflow: hidden;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-info {
            flex: 1;
            min-width: 0;
        }

        .profile-info h2 {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .profile-info p {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
        }

        .profile-info .pregnancy-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(236, 72, 153, 0.2);
            border: 1px solid rgba(236, 72, 153, 0.3);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            color: #f472b6;
            margin-top: 6px;
        }

        .profile-info .pregnancy-badge i {
            font-size: 10px;
        }

        /* Menu Container */
        .menu-container {
            padding: 0 15px 20px;
        }

        /* Menu Grid - 2 columns */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        /* Menu Card */
        .menu-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 22px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .menu-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 100%);
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .menu-card:active {
            transform: scale(0.97);
        }

        .menu-card:active::before {
            opacity: 1;
        }

        /* Menu Icon */
        .menu-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-size: 22px;
            color: white;
            position: relative;
            z-index: 1;
        }

        .menu-card h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 3px;
            position: relative;
            z-index: 1;
        }

        .menu-card p {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5);
            position: relative;
            z-index: 1;
        }

        /* Menu Card Badge */
        .menu-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ef4444;
            color: white;
            font-size: 10px;
            font-weight: 600;
            min-width: 20px;
            height: 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Quick Status */
        .quick-status {
            padding: 0 15px 20px;
        }

        .status-card {
            background: rgba(40, 167, 233, 0.12);
            border: 1px solid rgba(40, 167, 233, 0.25);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-card.warning {
            background: rgba(245, 158, 11, 0.12);
            border-color: rgba(245, 158, 11, 0.25);
        }

        .status-card .status-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: rgba(40, 167, 233, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #28a7e9;
            flex-shrink: 0;
        }

        .status-card.warning .status-icon {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
        }

        .status-card .status-info {
            flex: 1;
        }

        .status-card .status-info h4 {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .status-card .status-info p {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
        }

        /* Version Footer */
        .version-footer {
            text-align: center;
            padding: 20px 15px 30px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 11px;
        }

        /* Loading State */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 200px;
        }

        .loading i {
            font-size: 32px;
            color: #28a7e9;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Reduce animations on mobile */
        @media (max-width: 768px) {
            .menu-card {
                transition: transform 0.1s ease;
            }
        }

        /* Small screens */
        @media (max-width: 360px) {
            .menu-grid {
                gap: 10px;
            }
            .menu-card {
                padding: 18px 12px;
            }
            .menu-icon {
                width: 46px;
                height: 46px;
                font-size: 20px;
            }
            .menu-card h3 {
                font-size: 13px;
            }
        }

        /* Prefers reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="nav-bar">
        <div class="nav-brand">
            <h1>dokter<span>DIBYA</span></h1>
            <p>Portal Privat Kandungan Anda</p>
        </div>
        <div class="nav-actions">
            <div class="notification-bell" onclick="navigateTo('notifikasi')">
                <i class="fa fa-bell-o"></i>
                <span class="notification-badge" id="notif-badge">0</span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main id="main-content">
        <!-- Loading State -->
        <div class="loading" id="loading-state">
            <i class="fa fa-spinner fa-spin"></i>
        </div>

        <!-- Content (hidden until loaded) -->
        <div id="content-wrapper" style="display: none;">
            <!-- Profile Summary -->
            <div class="profile-summary">
                <div class="profile-avatar" id="profile-avatar">
                    <span id="avatar-initials">--</span>
                </div>
                <div class="profile-info">
                    <h2 id="profile-name">Loading...</h2>
                    <p id="profile-email">-</p>
                    <div class="pregnancy-badge" id="pregnancy-badge" style="display: none;">
                        <i class="fa fa-heart"></i>
                        <span id="pregnancy-info">-</span>
                    </div>
                </div>
            </div>

            <!-- Quick Status (Active Booking) -->
            <div class="quick-status" id="quick-status" style="display: none;">
                <div class="status-card" id="booking-status-card">
                    <div class="status-icon">
                        <i class="fa fa-calendar-check-o"></i>
                    </div>
                    <div class="status-info">
                        <h4 id="booking-status-title">Booking Aktif</h4>
                        <p id="booking-status-desc">-</p>
                    </div>
                </div>
            </div>

            <!-- Menu Grid -->
            <div class="menu-container">
                <div class="menu-grid">
                    <!-- Card 1: Rekam Medis -->
                    <div class="menu-card" onclick="navigateTo('rekam-medis')">
                        <div class="menu-icon" style="background: linear-gradient(135deg, #3b82f6, #1d4ed8);">
                            <i class="fa fa-file-text-o"></i>
                        </div>
                        <h3>Rekam Medis</h3>
                        <p>USG, Lab, Riwayat</p>
                    </div>

                    <!-- Card 2: Kesehatan -->
                    <div class="menu-card" onclick="navigateTo('kesehatan')">
                        <div class="menu-icon" style="background: linear-gradient(135deg, #ec4899, #be185d);">
                            <i class="fa fa-heartbeat"></i>
                        </div>
                        <h3>Kesehatan</h3>
                        <p>Kick Counter, Tracker</p>
                    </div>

                    <!-- Card 3: Jadwal -->
                    <div class="menu-card" onclick="navigateTo('jadwal')">
                        <div class="menu-icon" style="background: linear-gradient(135deg, #10b981, #059669);">
                            <i class="fa fa-calendar"></i>
                        </div>
                        <h3>Jadwal</h3>
                        <p>Booking, Jadwal RS</p>
                    </div>

                    <!-- Card 4: Informasi -->
                    <div class="menu-card" onclick="navigateTo('informasi')">
                        <div class="menu-icon" style="background: linear-gradient(135deg, #f59e0b, #d97706);">
                            <i class="fa fa-book"></i>
                        </div>
                        <h3>Informasi</h3>
                        <p>Artikel, Pengumuman</p>
                    </div>

                    <!-- Card 5: Akun -->
                    <div class="menu-card" onclick="navigateTo('akun')">
                        <div class="menu-icon" style="background: linear-gradient(135deg, #8b5cf6, #6d28d9);">
                            <i class="fa fa-user-circle-o"></i>
                        </div>
                        <h3>Akun</h3>
                        <p>Profil, Pengaturan</p>
                    </div>

                    <!-- Card 6: Bantuan -->
                    <div class="menu-card" onclick="navigateTo('bantuan')">
                        <div class="menu-icon" style="background: linear-gradient(135deg, #6b7280, #4b5563);">
                            <i class="fa fa-question-circle"></i>
                        </div>
                        <h3>Bantuan</h3>
                        <p>FAQ, Kontak</p>
                    </div>
                </div>
            </div>

            <!-- Version Footer -->
            <div class="version-footer">
                <p>dokterDIBYA Patient Portal v2.0</p>
            </div>
        </div>
    </main>

    <script>
        // ==================== AUTHENTICATION ====================
        function getToken() {
            return localStorage.getItem('vps_auth_token') ||
                   sessionStorage.getItem('vps_auth_token') ||
                   localStorage.getItem('patient_token');
        }

        // Check authentication on page load
        document.addEventListener('DOMContentLoaded', function() {
            // Check for token in URL (from mobile app)
            const urlParams = new URLSearchParams(window.location.search);
            const urlToken = urlParams.get('token');
            if (urlToken) {
                localStorage.setItem('vps_auth_token', urlToken);
                localStorage.setItem('from_mobile_app', 'true');
                // Clean URL
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            const token = getToken();
            const user = JSON.parse(localStorage.getItem('patient_user') || '{}');

            if (!token || !user.id) {
                // Not authenticated, redirect to login
                const fromMobile = localStorage.getItem('from_mobile_app') === 'true';
                const isCapacitor = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform();

                if (fromMobile || isCapacitor) {
                    localStorage.removeItem('from_mobile_app');
                    window.location.href = 'dokterdibya://logout';
                } else {
                    window.location.href = '/patient-login.html';
                }
                return;
            }

            // Authenticated, load data
            loadProfile();
            loadNotificationCount();
            checkActiveBooking();
        });

        // ==================== LOAD PROFILE ====================
        async function loadProfile() {
            const token = getToken();
            try {
                const response = await fetch('/api/patients/profile', {
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Cache-Control': 'no-cache'
                    }
                });
                const data = await response.json();

                if (data.success && data.profile) {
                    const profile = data.profile;

                    // Update name
                    document.getElementById('profile-name').textContent = profile.fullname || 'Pasien';
                    document.getElementById('profile-email').textContent = profile.email || '-';

                    // Set avatar
                    if (profile.profile_picture) {
                        document.getElementById('profile-avatar').innerHTML =
                            `<img src="${profile.profile_picture}" alt="Profile" onerror="this.parentElement.innerHTML='<span>${getInitials(profile.fullname)}</span>'">`;
                    } else {
                        document.getElementById('avatar-initials').textContent = getInitials(profile.fullname);
                    }

                    // Pregnancy info
                    if (profile.gestational_age && profile.gestational_age > 0) {
                        document.getElementById('pregnancy-badge').style.display = 'inline-flex';
                        document.getElementById('pregnancy-info').textContent =
                            `Usia Kehamilan: ${profile.gestational_age} minggu`;
                    }

                    // Show content
                    document.getElementById('loading-state').style.display = 'none';
                    document.getElementById('content-wrapper').style.display = 'block';
                } else {
                    throw new Error('Failed to load profile');
                }
            } catch (error) {
                console.error('Error loading profile:', error);
                // Still show content with default values
                document.getElementById('loading-state').style.display = 'none';
                document.getElementById('content-wrapper').style.display = 'block';
            }
        }

        function getInitials(name) {
            if (!name) return '--';
            return name.split(' ')
                .map(n => n[0])
                .join('')
                .substring(0, 2)
                .toUpperCase();
        }

        // ==================== NOTIFICATIONS ====================
        async function loadNotificationCount() {
            const token = getToken();
            try {
                const response = await fetch('/api/patient-notifications/count', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await response.json();

                if (data.success && data.count > 0) {
                    const badge = document.getElementById('notif-badge');
                    badge.textContent = data.count > 99 ? '99+' : data.count;
                    badge.style.display = 'flex';
                }
            } catch (error) {
                // Silently fail
            }
        }

        // ==================== ACTIVE BOOKING ====================
        async function checkActiveBooking() {
            const token = getToken();
            try {
                const response = await fetch('/api/sunday-appointments/my-bookings?status=confirmed,pending', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await response.json();

                if (data.success && data.bookings && data.bookings.length > 0) {
                    const booking = data.bookings[0]; // Get first active booking
                    const date = new Date(booking.appointment_date);
                    const dateStr = date.toLocaleDateString('id-ID', {
                        weekday: 'long',
                        day: 'numeric',
                        month: 'long'
                    });

                    document.getElementById('booking-status-title').textContent =
                        booking.status === 'confirmed' ? 'Booking Dikonfirmasi' : 'Menunggu Konfirmasi';
                    document.getElementById('booking-status-desc').textContent =
                        `${dateStr} - ${booking.slot_time || '-'}`;

                    if (booking.status === 'pending') {
                        document.getElementById('booking-status-card').classList.add('warning');
                    }

                    document.getElementById('quick-status').style.display = 'block';
                }
            } catch (error) {
                // Silently fail
            }
        }

        // ==================== NAVIGATION ====================
        function navigateTo(section) {
            // Navigate to dashboard with section hash
            // The dashboard will scroll to the relevant section
            switch(section) {
                case 'rekam-medis':
                    window.location.href = '/patient-dashboard.html#usg-section';
                    break;
                case 'kesehatan':
                    window.location.href = '/patient-dashboard.html#kick-counter';
                    break;
                case 'jadwal':
                    window.location.href = '/patient-dashboard.html#booking-status';
                    break;
                case 'informasi':
                    window.location.href = '/patient-dashboard.html#articles-section';
                    break;
                case 'akun':
                    window.location.href = '/patient-dashboard.html#profile-section';
                    break;
                case 'bantuan':
                    // For now, go to dashboard
                    window.location.href = '/patient-dashboard.html';
                    break;
                case 'notifikasi':
                    window.location.href = '/patient-dashboard.html#notifications';
                    break;
                default:
                    window.location.href = '/patient-dashboard.html';
            }
        }

        // ==================== LOGOUT ====================
        function logout() {
            localStorage.removeItem('vps_auth_token');
            sessionStorage.removeItem('vps_auth_token');
            localStorage.removeItem('patient_token');
            localStorage.removeItem('patient_user');

            const isCapacitor = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform();
            if (isCapacitor) {
                window.location.href = 'dokterdibya://logout';
            } else {
                window.location.href = '/patient-login.html';
            }
        }
    </script>
</body>
</html>
