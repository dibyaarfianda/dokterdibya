<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Public My Corner - SISIwanita</title>
    <link rel="manifest" href="/patient-portal.webmanifest?v=20260516pwa2">
    <link rel="icon" type="image/png" href="/images/logo-dokter-dibya.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/styles/patient-my-corner.css?v=20260524f">
    <style>
        :root { --pmc-accent: #5c7f72; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            min-height: 100vh;
            background: radial-gradient(circle at 12% 4%, rgba(92, 127, 114, 0.12), transparent 30%), linear-gradient(180deg, #fbfbf8 0%, #f7f7f4 62%, #ffffff 100%);
            color: #111111;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) calc(env(safe-area-inset-bottom, 0) + 20px) env(safe-area-inset-left, 0);
        }
        .visit-app { width: min(100%, 560px); margin: 0 auto; padding: 14px; }
        .visit-topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
        .visit-brand { font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: -0.03em; }
        .visit-brand span { color: var(--pmc-accent); font-weight: 700; }
        .visit-label { display: inline-flex; align-items: center; gap: 7px; border: 1px solid rgba(17,17,17,0.09); border-radius: 999px; background: rgba(255,255,255,0.82); padding: 8px 10px; color: #555; font-size: 11px; font-weight: 800; }
        .visit-back { border: 1px solid rgba(17,17,17,0.1); background: rgba(255,255,255,0.88); color: #111; min-height: 40px; border-radius: 14px; padding: 0 12px; font-weight: 900; font-size: 12px; display: inline-flex; align-items: center; gap: 7px; text-decoration: none; }
        .visit-loading { min-height: 64vh; display: grid; place-items: center; text-align: center; color: #717171; gap: 8px; }
        .visit-card { border: 1px solid rgba(17,17,17,0.09); background: rgba(255,255,255,0.86); border-radius: 18px; padding: 14px; box-shadow: 0 1px 2px rgba(17,17,17,0.05); margin-top: 12px; }
        .visit-avatar { width: 56px; height: 56px; border-radius: 20px; display: grid; place-items: center; background: color-mix(in srgb, var(--pmc-accent) 16%, #ffffff); color: var(--pmc-accent); font-weight: 900; margin-bottom: 12px; }
        .visit-title { font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; font-size: 34px; line-height: 0.98; letter-spacing: -0.055em; margin-bottom: 10px; }
        .visit-intro { color: #555; font-size: 13px; line-height: 1.55; white-space: pre-wrap; }
        .visit-widget { display: none; }
        .visit-widget.is-visible { display: block; }
        .visit-empty { color: #717171; font-size: 12px; line-height: 1.5; }
        .visit-actions { display: grid; gap: 8px; margin-top: 12px; }
        .visit-action { border: 1px solid rgba(17,17,17,0.09); border-radius: 15px; padding: 12px; background: rgba(17,17,17,0.035); display: flex; align-items: center; justify-content: space-between; gap: 10px; color: #111; text-decoration: none; font-weight: 900; font-size: 13px; }
        .visit-action i { color: var(--pmc-accent); }
    </style>
    <link rel="stylesheet" href="/styles/patient-trial-theme.css?v=20260524o">
</head>
<body>
    <main class="visit-app">
        <header class="visit-topbar">
            <a class="visit-back" href="/patient-menu.html"><i class="fa-solid fa-arrow-left"></i> Portal</a>
            <div class="visit-label"><i class="fa-solid fa-eye"></i> Public Corner</div>
        </header>
        <div class="visit-brand">SISI<span>wanita</span></div>
        <div id="visit-root" class="visit-loading">
            <div><i class="fa-solid fa-spinner fa-spin"></i></div>
            <div>Memuat public corner...</div>
        </div>
    </main>
    <script src="/scripts/patient-my-corner-visit.js?v=20260524f"></script>
</body>
</html>
