<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>SISIwanita Ditutup</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            background: #ffffff;
            color: #16110f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px;
        }

        .closed-card {
            width: min(420px, 100%);
            text-align: center;
            padding: 34px 26px;
            border-radius: 30px;
            background: linear-gradient(180deg, #fffaf8 0%, #ffffff 100%);
            border: 1px solid rgba(185, 137, 113, 0.22);
            box-shadow: 0 22px 60px rgba(99, 58, 41, 0.12);
        }

        .closed-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 18px;
            border-radius: 24px;
            display: grid;
            place-items: center;
            background: #f7e5dc;
            color: #8f5f4b;
            font-size: 30px;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: -0.03em;
        }

        p {
            margin: 12px 0 0;
            color: rgba(22, 17, 15, 0.64);
            line-height: 1.55;
            font-size: 14px;
        }

        .reopen-btn {
            width: 100%;
            border: 0;
            border-radius: 999px;
            margin-top: 24px;
            padding: 14px 18px;
            background: #16110f;
            color: #ffffff;
            font-weight: 800;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <main class="closed-card" aria-live="polite">
        <div class="closed-icon">✓</div>
        <h1>Aplikasi ditutup</h1>
        <p>Notifikasi tetap aktif. Anda dapat menekan tombol Home atau membuka SISIwanita lagi kapan saja.</p>
        <button class="reopen-btn" type="button" onclick="window.location.replace('/patient-menu.html')">Buka lagi</button>
    </main>
    <script>
        try { window.open('', '_self').close(); } catch (error) {}
        try { window.close(); } catch (error) {}
    </script>
</body>
</html>
