    <style>
        body.pregnancy-tracker-page .hero-title {
            white-space: nowrap;
        }

        body.pregnancy-tracker-page .pregnancy-source {
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        body.pregnancy-tracker-page .pregnancy-ring-card {
            display: grid;
            grid-template-columns: minmax(210px, 280px) 1fr;
            gap: 22px;
            align-items: center;
            background: rgba(255,255,255,0.86) !important;
            overflow: hidden;
        }

        body.pregnancy-tracker-page .ring-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            max-width: 260px;
            margin: 0 auto;
        }

        body.pregnancy-tracker-page .ring-svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        body.pregnancy-tracker-page .ring-track {
            fill: none;
            stroke: var(--line);
            stroke-width: 10;
        }

        body.pregnancy-tracker-page .ring-progress {
            fill: none;
            stroke: var(--green);
            stroke-width: 10;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }

        body.pregnancy-tracker-page .ring-center {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        body.pregnancy-tracker-page .week-kicker {
            font-size: 10px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            font-weight: 800;
            color: var(--muted);
        }

        body.pregnancy-tracker-page .week-big {
            font-family: var(--display);
            font-size: clamp(68px, 19vw, 104px);
            line-height: 0.95;
            letter-spacing: -0.06em;
            font-weight: 800;
            color: var(--ink);
            margin: 3px 0 5px;
        }

        body.pregnancy-tracker-page .week-sub {
            font-size: 12px;
            color: var(--muted);
            font-weight: 700;
        }

        body.pregnancy-tracker-page .ring-info .info-kicker {
            font-size: 10px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-weight: 800;
            color: var(--green);
            margin-bottom: 8px;
        }

        body.pregnancy-tracker-page .ring-info h3 {
            font-family: var(--display);
            font-size: clamp(23px, 6vw, 34px);
            line-height: 1.05;
            letter-spacing: -0.04em;
            color: var(--ink);
            margin-bottom: 9px;
        }

        body.pregnancy-tracker-page .info-len {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: rgba(255,255,255,0.66);
            color: var(--muted);
            font-size: 11px;
            font-weight: 800;
            padding: 7px 10px;
            margin-bottom: 12px;
        }

        body.pregnancy-tracker-page .dev-list {
            list-style: none;
            display: grid;
            gap: 8px;
            margin: 0;
            padding: 0;
        }

        body.pregnancy-tracker-page .dev-list li {
            display: flex;
            gap: 9px;
            align-items: flex-start;
            color: var(--ink-soft);
            font-size: 12px;
            line-height: 1.45;
        }

        body.pregnancy-tracker-page .dev-list i {
            color: var(--green);
            font-size: 12px;
            margin-top: 3px;
            flex: 0 0 auto;
        }

        body.pregnancy-tracker-page .pregnancy-stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        body.pregnancy-tracker-page .stat-tile {
            min-height: 116px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        body.pregnancy-tracker-page .stat-kicker,
        body.pregnancy-tracker-page .panel-kicker {
            color: var(--muted);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 800;
        }

        body.pregnancy-tracker-page .stat-value {
            font-family: var(--display);
            font-weight: 800;
            letter-spacing: -0.04em;
            color: var(--ink);
            font-size: clamp(21px, 6vw, 30px);
            line-height: 1.05;
            margin: 8px 0 5px;
        }

        body.pregnancy-tracker-page .stat-sub {
            color: var(--muted);
            font-size: 11px;
            line-height: 1.35;
        }

        body.pregnancy-tracker-page .info-block h3,
        body.pregnancy-tracker-page .hpht-card h3 {
            font-family: var(--display);
            font-size: 19px;
            letter-spacing: -0.03em;
            line-height: 1.12;
            color: var(--ink);
            margin: 5px 0 8px;
        }

        body.pregnancy-tracker-page .info-block p,
        body.pregnancy-tracker-page .hpht-card p {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.5;
            margin: 0;
        }

        body.pregnancy-tracker-page .cta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
            margin-top: 14px;
        }

        body.pregnancy-tracker-page .hpht-form-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            align-items: end;
            margin-top: 14px;
        }

        body.pregnancy-tracker-page .portal-field label {
            display: block;
            color: var(--muted);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 800;
            margin-bottom: 6px;
        }

        body.pregnancy-tracker-page .portal-input {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: rgba(255,255,255,0.74);
            color: var(--ink);
            padding: 11px 12px;
            font: inherit;
            font-size: 13px;
            outline: none;
        }

        body.pregnancy-tracker-page .empty-state {
            text-align: center;
            padding: 22px 14px;
            color: var(--muted);
            font-size: 12px;
        }

        body.pregnancy-tracker-page .empty-state i {
            display: block;
            font-size: 30px;
            opacity: 0.42;
            margin-bottom: 9px;
        }

        @media (max-width: 720px) {
            body.pregnancy-tracker-page .pregnancy-ring-card {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            body.pregnancy-tracker-page .ring-info {
                text-align: center;
            }

            body.pregnancy-tracker-page .dev-list li {
                text-align: left;
            }
        }

        @media (max-width: 520px) {
            body.pregnancy-tracker-page .hero-title {
                font-size: clamp(27px, 7.4vw, 38px) !important;
            }

            body.pregnancy-tracker-page .pregnancy-stats-grid {
                grid-template-columns: 1fr;
            }

            body.pregnancy-tracker-page .hpht-form-row {
                grid-template-columns: 1fr;
            }

            body.pregnancy-tracker-page .cta-row .primary-action,
            body.pregnancy-tracker-page .cta-row .ghost-action {
                flex: 1 1 100%;
            }
        }
    </style>

    <script type="module">
        import { getToken, checkAuth, apiRequest, showToast, escapeHtml } from '/scripts/patient-utils.js';

        const HPHT_KEY = 'patient_pregnancy_tracker_hpht_preview';
        const urlParams = new URLSearchParams(window.location.search);
        const isMockTrackerMode = urlParams.has('mockApi') || urlParams.has('mockTracker');
        const isMockEmptyMode = urlParams.has('mockEmpty');

        if (isMockTrackerMode && !getToken()) {
            localStorage.setItem('vps_auth_token', 'mock-pregnancy-token');
            localStorage.setItem('patient_user', JSON.stringify({ fullname: 'Nanda Ananda' }));
        }

        window.PatientToolShell?.init({ activeNav: 'aplikasi' });

        if (checkAuth()) {
            initPregnancyTracker();
        }

        async function initPregnancyTracker() {
            window.PatientToolShell?.updateAvatarInitials();
            await loadPregnancyData();
            window.PatientToolShell?.showContent({ loadingId: 'loading-state', contentId: 'content-wrapper' });
        }

        async function loadPregnancyData() {
            const container = document.getElementById('tracker-content');
            if (!container) return;

            try {
                const result = await pregnancyApiRequest();
                if (result && result.success && result.data) {
                    renderPregnancyTracker(normalizeTrackerData(result.data));
                    return;
                }

                const localHpht = localStorage.getItem(HPHT_KEY);
                if (localHpht) {
                    renderPregnancyTracker(createTrackerDataFromHpht(localHpht, 'local'));
                    showToast('Menampilkan pratinjau HPHT dari perangkat ini', 'info', 2200);
                    return;
                }

                renderEmpty(container, result?.message || 'Belum ada data USG dengan HPL.');
            } catch (error) {
                console.error('Pregnancy tracker error:', error);
                const localHpht = localStorage.getItem(HPHT_KEY);
                if (localHpht) {
                    renderPregnancyTracker(createTrackerDataFromHpht(localHpht, 'local'));
                    showToast('Koneksi bermasalah, memakai pratinjau lokal', 'warning', 2600);
                    return;
                }
                renderError(container);
            }
        }

        async function pregnancyApiRequest() {
            if (isMockTrackerMode) {
                await new Promise(resolve => setTimeout(resolve, 140));
                if (isMockEmptyMode && !localStorage.getItem(HPHT_KEY)) {
                    return { success: true, data: null, message: 'Belum ada data USG dengan HPL' };
                }
                const hpht = localStorage.getItem(HPHT_KEY) || getMockHpht();
                return { success: true, data: createTrackerDataFromHpht(hpht, 'mock') };
            }
            return apiRequest('/api/patients/pregnancy-tracker?_t=' + Date.now());
        }

        function renderEmpty(container, message) {
            setTrackerSource('Belum aktif');
            container.innerHTML = `
                <section class="section reveal">
                    <div class="status-panel">
                        <div class="status-icon"><i class="fa-solid fa-circle-info"></i></div>
                        <div class="status-body">
                            <h3>Data kehamilan belum tersedia</h3>
                            <p>${escapeHtml(message || 'Tracker akan aktif setelah HPL tersedia dari data USG.')}</p>
                        </div>
                    </div>
                </section>

                <section class="section reveal">
                    <div class="tool-panel hpht-card">
                        <div class="panel-kicker">Pratinjau Lokal</div>
                        <h3>Hitung dari HPHT</h3>
                        <p>Gunakan tanggal Hari Pertama Haid Terakhir untuk melihat pratinjau usia kehamilan di perangkat ini. Data resmi tetap mengikuti catatan USG dokter.</p>
                        <form class="hpht-form-row" id="hpht-form">
                            <div class="portal-field">
                                <label for="hphtInput">Tanggal HPHT</label>
                                <input type="date" id="hphtInput" class="portal-input" required>
                            </div>
                            <button type="submit" class="portal-button" id="hphtSubmit"><i class="fa-solid fa-calculator"></i> Hitung</button>
                        </form>
                    </div>
                </section>
            `;
            bindHphtForm();
        }

        function renderError(container) {
            setTrackerSource('Tidak tersambung');
            container.innerHTML = `
                <section class="section reveal">
                    <div class="tool-panel empty-state">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                        <p>Gagal memuat data kehamilan. Periksa koneksi Anda lalu coba lagi.</p>
                        <button type="button" class="portal-button" onclick="loadPregnancyData()"><i class="fa fa-refresh"></i> Coba Lagi</button>
                    </div>
                </section>
            `;
        }

        function renderPregnancyTracker(data) {
            const container = document.getElementById('tracker-content');
            const weeks = Number(data.weeksPregnant || 0);
            const totalWeeks = 40;
            const progressPercent = clamp(Number(data.progressPercent || Math.round((weeks / totalWeeks) * 100)), 0, 100);
            const radius = 92;
            const circumference = 2 * Math.PI * radius;
            const dashOffset = circumference - (progressPercent / 100) * circumference;
            const sourceLabel = data.source === 'local'
                ? 'Pratinjau HPHT'
                : data.source === 'mock'
                    ? 'Mock data'
                    : 'USG terakhir';
            const babySize = data.babySize || getBabySize(weeks);
            const developments = Array.isArray(data.developments) && data.developments.length
                ? data.developments
                : getDevelopments(weeks);

            setTrackerSource(sourceLabel);

            container.innerHTML = `
                ${data.source === 'local' ? `
                    <section class="section reveal">
                        <div class="status-panel">
                            <div class="status-icon"><i class="fa-solid fa-mobile-screen"></i></div>
                            <div class="status-body">
                                <h3>Pratinjau di perangkat ini</h3>
                                <p>Hitungan ini berasal dari HPHT yang Anda isi. Data resmi pasien tetap mengikuti catatan USG dokter.</p>
                            </div>
                        </div>
                    </section>
                ` : ''}

                <section class="section reveal">
                    <div class="tool-panel pregnancy-ring-card">
                        <div class="ring-wrap">
                            <svg class="ring-svg" viewBox="0 0 200 200" aria-hidden="true">
                                <circle class="ring-track" cx="100" cy="100" r="${radius}"></circle>
                                <circle class="ring-progress" cx="100" cy="100" r="${radius}" stroke-dasharray="${circumference.toFixed(2)}" stroke-dashoffset="${dashOffset.toFixed(2)}"></circle>
                            </svg>
                            <div class="ring-center">
                                <div class="week-kicker">Minggu</div>
                                <div class="week-big">${weeks}</div>
                                <div class="week-sub">${Number(data.daysExtra || 0)} hari · ${progressPercent}%</div>
                            </div>
                        </div>
                        <div class="ring-info">
                            <div class="info-kicker">Trimester ${escapeHtml(data.trimester || '-')}</div>
                            <h3>Ukuran seperti ${escapeHtml(babySize.size || '-')}</h3>
                            <div class="info-len"><i class="fa-solid fa-ruler"></i> ${babySize.length ? '~' + escapeHtml(babySize.length) : 'Estimasi ukuran'}</div>
                            <ul class="dev-list">
                                ${developments.slice(0, 4).map(dev => `<li><i class="fa fa-check-circle"></i><span>${escapeHtml(dev)}</span></li>`).join('')}
                            </ul>
                        </div>
                    </div>
                </section>

                <section class="section reveal">
                    <div class="pregnancy-stats-grid">
                        <div class="tool-panel stat-tile">
                            <div>
                                <div class="stat-kicker">Taksiran Persalinan</div>
                                <div class="stat-value">${escapeHtml(data.eddFormatted || '-')}</div>
                            </div>
                            <div class="stat-sub">HPL berdasarkan ${data.source === 'local' ? 'HPHT' : 'USG'}</div>
                        </div>
                        <div class="tool-panel stat-tile">
                            <div>
                                <div class="stat-kicker">Sisa Hari</div>
                                <div class="stat-value">${data.daysUntilEdd != null ? Number(data.daysUntilEdd) : '-'}</div>
                            </div>
                            <div class="stat-sub">menuju persalinan</div>
                        </div>
                        <div class="tool-panel stat-tile">
                            <div>
                                <div class="stat-kicker">Progress</div>
                                <div class="stat-value">${progressPercent}%</div>
                            </div>
                            <div class="stat-sub">dari 40 minggu</div>
                        </div>
                    </div>
                </section>

                <section class="section reveal">
                    <div class="tool-panel info-block">
                        <div class="panel-kicker">Tips Minggu Ini</div>
                        <h3>Untuk minggu ke-${weeks || '-'}</h3>
                        <p>${escapeHtml(data.tip || getTip(weeks))}</p>
                        <div class="cta-row">
                            <button type="button" class="primary-action soundable" onclick="go('/kick-counter.html')"><i class="fa-solid fa-hand"></i> Gerakan Bayi</button>
                            <button type="button" class="ghost-action soundable" onclick="go('/tanya-dokter.html')"><i class="fa-solid fa-comments"></i> Tanya Dokter</button>
                        </div>
                    </div>
                </section>
            `;
        }

        function bindHphtForm() {
            const form = document.getElementById('hpht-form');
            const input = document.getElementById('hphtInput');
            if (!form || !input) return;
            input.value = localStorage.getItem(HPHT_KEY) || '';
            form.addEventListener('submit', function(event) {
                event.preventDefault();
                const hpht = input.value;
                if (!hpht || !isValidLocalDate(hpht)) {
                    showToast('Tanggal HPHT belum valid', 'warning');
                    return;
                }
                localStorage.setItem(HPHT_KEY, hpht);
                renderPregnancyTracker(createTrackerDataFromHpht(hpht, 'local'));
                showToast('Pratinjau kehamilan dihitung', 'success');
            });
        }

        function normalizeTrackerData(data) {
            return {
                ...data,
                source: data.source || 'server',
                babySize: data.babySize || getBabySize(data.weeksPregnant || 0),
                developments: data.developments || getDevelopments(data.weeksPregnant || 0),
                tip: data.tip || getTip(data.weeksPregnant || 0)
            };
        }

        function createTrackerDataFromHpht(hpht, source) {
            const hphtDate = parseLocalDate(hpht);
            const today = startOfLocalDay(new Date());
            const edd = addDays(hphtDate, 280);
            const daysPregnant = Math.max(0, Math.floor((today.getTime() - hphtDate.getTime()) / 86400000));
            const weeksPregnant = Math.floor(daysPregnant / 7);
            const daysExtra = daysPregnant % 7;
            const daysUntilEdd = Math.max(0, Math.floor((edd.getTime() - today.getTime()) / 86400000));
            const trimester = weeksPregnant >= 28 ? 3 : weeksPregnant >= 14 ? 2 : 1;
            const progressPercent = Math.min(100, Math.round((weeksPregnant / 40) * 100));
            return {
                source,
                hpht,
                edd: formatLocalDate(edd),
                eddFormatted: edd.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }),
                weeksPregnant,
                daysExtra,
                daysUntilEdd,
                trimester,
                progressPercent,
                babySize: getBabySize(weeksPregnant),
                developments: getDevelopments(weeksPregnant),
                tip: getTip(weeksPregnant)
            };
        }

        function getBabySize(weeks) {
            const sizes = {
                4: { size: 'Biji Poppy', length: '0.1 cm' },
                8: { size: 'Raspberry', length: '1.6 cm' },
                12: { size: 'Jeruk Nipis', length: '5.4 cm' },
                16: { size: 'Alpukat', length: '11.6 cm' },
                20: { size: 'Pisang', length: '16.4 cm' },
                24: { size: 'Jagung Besar', length: '30 cm' },
                28: { size: 'Terong Besar', length: '37.6 cm' },
                32: { size: 'Nangka', length: '42.4 cm' },
                36: { size: 'Pepaya', length: '47.4 cm' },
                40: { size: 'Semangka', length: '51.2 cm' }
            };
            const key = Object.keys(sizes).map(Number).filter(week => week <= Number(weeks || 0)).pop() || 4;
            return sizes[key];
        }

        function getDevelopments(weeks) {
            if (weeks >= 36) return ['Bayi mematangkan paru-paru dan refleks menyusu.', 'Posisi kepala biasanya semakin turun.', 'Gerakan tetap perlu dipantau setiap hari.', 'Persiapan persalinan mulai masuk fase akhir.'];
            if (weeks >= 28) return ['Trimester ketiga dimulai dengan pertumbuhan berat badan cepat.', 'Bayi semakin peka pada cahaya dan suara.', 'Pola tidur dan gerak mulai lebih terasa.', 'Kontrol rutin membantu memantau posisi dan cairan ketuban.'];
            if (weeks >= 20) return ['Gerakan bayi biasanya semakin jelas terasa.', 'Pendengaran bayi berkembang dan mulai mengenali suara.', 'Organ utama terus matang minggu demi minggu.', 'USG membantu memantau pertumbuhan dan HPL.'];
            if (weeks >= 14) return ['Trimester kedua biasanya mulai terasa lebih nyaman.', 'Wajah, tangan, dan kaki bayi semakin proporsional.', 'Tulang dan otot berkembang aktif.', 'Nutrisi dan hidrasi tetap penting dijaga.'];
            return ['Organ awal sedang terbentuk.', 'Asam folat dan istirahat cukup sangat penting.', 'Kontrol awal membantu memastikan lokasi dan usia kehamilan.', 'Keluhan ringan tetap perlu dicatat bila mengganggu.'];
        }

        function getTip(weeks) {
            if (weeks >= 36) return 'Siapkan tas persalinan dan tetap pantau gerakan bayi. Hubungi klinik jika kontraksi teratur atau cairan ketuban keluar.';
            if (weeks >= 28) return 'Mulai perhatikan pola gerakan harian bayi. Gunakan fitur Gerakan Bayi bila gerakan terasa berbeda dari biasanya.';
            if (weeks >= 20) return 'Jadwalkan kontrol sesuai anjuran dokter dan catat pertanyaan yang muncul sebelum kunjungan.';
            if (weeks >= 14) return 'Jaga aktivitas ringan, asupan protein, dan hidrasi. Dengarkan tubuh jika mulai mudah lelah.';
            return 'Istirahat cukup, konsumsi vitamin sesuai anjuran, dan segera konsultasi bila ada nyeri hebat atau perdarahan.';
        }

        function getMockHpht() {
            const date = startOfLocalDay(new Date());
            date.setDate(date.getDate() - 24 * 7 - 3);
            return formatLocalDate(date);
        }

        function setTrackerSource(text) {
            const source = document.getElementById('tracker-source');
            if (source) source.innerHTML = `<i class="fa-solid fa-wave-square"></i> ${escapeHtml(text)}`;
        }

        function parseLocalDate(value) {
            const parts = String(value || '').split('-').map(Number);
            return new Date(parts[0], (parts[1] || 1) - 1, parts[2] || 1);
        }

        function isValidLocalDate(value) {
            const date = parseLocalDate(value);
            return value && !Number.isNaN(date.getTime()) && date <= startOfLocalDay(new Date());
        }

        function startOfLocalDay(date) {
            return new Date(date.getFullYear(), date.getMonth(), date.getDate());
        }

        function addDays(date, days) {
            const next = new Date(date.getFullYear(), date.getMonth(), date.getDate());
            next.setDate(next.getDate() + days);
            return next;
        }

        function formatLocalDate(date) {
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        }

        function clamp(value, min, max) {
            return Math.min(max, Math.max(min, Number.isFinite(value) ? value : min));
        }

        window.loadPregnancyData = loadPregnancyData;
    </script>
