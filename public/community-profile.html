<!DOCTYPE html>
<html lang="id">
<head>
    <script src="/scripts/patient-session.js?v=20260801stage2f1"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Profile - SISIwanita</title>
    <style>
        :root {
            --bg: #f7f7f4;
            --surface: rgba(255, 255, 255, 0.9);
            --line: rgba(17, 17, 17, 0.1);
            --ink: #161d1a;
            --muted: #62726c;
            --green: #5c7f72;
            --green-soft: rgba(92, 127, 114, 0.13);
            --shadow: 0 18px 42px rgba(17, 17, 17, 0.1);
        }

        body {
            margin: 0;
            font-family: "Segoe UI", "Inter", Arial, sans-serif;
            background:
                radial-gradient(circle at 12% 4%, rgba(92, 127, 114, 0.14), transparent 28%),
                linear-gradient(180deg, #fbfbf8 0%, #f2f5f2 54%, #ffffff 100%);
            color: var(--ink);
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 18px;
        }

        .card {
            width: min(560px, 100%);
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 22px;
            box-shadow: var(--shadow);
            overflow: hidden;
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
        }

        .head {
            padding: 13px 14px;
            border-bottom: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.72);
        }

        .head-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .back-btn {
            width: 34px;
            height: 34px;
            border-radius: 12px;
            border: 1px solid rgba(92, 127, 114, 0.22);
            background: rgba(255, 255, 255, 0.86);
            color: #2f4f45;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 14px;
            box-shadow: 0 8px 16px rgba(34, 61, 52, 0.12);
        }

        .brand-link {
            display: inline-flex;
            flex-direction: column;
            text-decoration: none;
            min-width: 0;
        }

        .brand-title {
            font-size: 16px;
            line-height: 1.03;
            font-weight: 800;
            letter-spacing: -0.04em;
            color: #7EA89F;
            text-shadow: 0 2px 10px rgba(26, 45, 38, 0.2);
            white-space: nowrap;
        }

        .brand-title span {
            color: #7EA89F;
            font-weight: 700;
        }

        .brand-sub {
            margin-top: 2px;
            font-size: 6.8px;
            line-height: 1.2;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: #7EA89F;
        }

        .body {
            padding: 20px;
            display: grid;
            gap: 16px;
        }

        .profile-top {
            display: flex;
            gap: 14px;
            align-items: center;
        }

        .avatar {
            width: 78px;
            height: 78px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.84);
            background: linear-gradient(145deg, #dfeee8, #c8dfd5);
            object-fit: cover;
            display: none;
            box-shadow: 0 10px 20px rgba(45, 74, 64, 0.14);
        }

        .avatar-fallback {
            width: 78px;
            height: 78px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.84);
            background: linear-gradient(145deg, #dfeee8, #c8dfd5);
            display: grid;
            place-items: center;
            font-size: 28px;
            font-weight: bold;
            color: #486e5f;
            box-shadow: 0 10px 20px rgba(45, 74, 64, 0.14);
        }

        .name {
            margin: 0;
            font-size: 24px;
        }

        .chip {
            display: inline-block;
            margin-top: 6px;
            font-size: 12px;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(223, 238, 232, 0.74);
            border: 1px solid rgba(92, 127, 114, 0.24);
            color: #385e50;
        }

        .label {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 6px;
        }

        .box {
            border: 1px solid var(--line);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.74);
            padding: 12px;
            line-height: 1.5;
            color: var(--ink);
        }

        .status {
            color: var(--muted);
            font-size: 14px;
            min-height: 20px;
            text-align: right;
        }

        @media (max-width: 720px) {
            .body {
                padding: 16px;
                gap: 14px;
            }

            .profile-top {
                align-items: flex-start;
            }

            .name {
                font-size: 22px;
            }

            .status {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
<div class="card">
    <div class="head">
        <div class="head-left">
            <a class="back-btn" href="/community-chat.html" aria-label="Kembali ke Community Chat">&#8592;</a>
            <a class="brand-link" href="/patient-menu.html" aria-label="Beranda SISIwanita">
                <span class="brand-title">SISI<span>wanita</span></span>
                <span class="brand-sub">Portal Wanita Sehat</span>
            </a>
        </div>
        <span id="status" class="status"></span>
    </div>

    <div class="body">
        <div class="profile-top">
            <img id="avatar" class="avatar" alt="Avatar">
            <div id="avatar-fallback" class="avatar-fallback">U</div>
            <div>
                <h1 id="name" class="name">Memuat...</h1>
                <span id="user-type" class="chip">-</span>
            </div>
        </div>

        <div>
            <div class="label">Bio</div>
            <div id="bio" class="box">-</div>
        </div>

        <div>
            <div class="label">Nickname</div>
            <div id="nickname" class="box">-</div>
        </div>
    </div>
</div>

<script type="module">
    const TOKEN_KEYS = ['vps_auth_token', 'token', 'idToken', 'patient_token'];
    const API_BASE = window.location.hostname === 'localhost' ? 'http://localhost:3000' : '';

    const avatar = document.getElementById('avatar');
    const avatarFallback = document.getElementById('avatar-fallback');
    const nameEl = document.getElementById('name');
    const typeEl = document.getElementById('user-type');
    const bioEl = document.getElementById('bio');
    const nicknameEl = document.getElementById('nickname');
    const statusEl = document.getElementById('status');

    function getToken() {
        for (const key of TOKEN_KEYS) {
            const local = localStorage.getItem(key);
            const session = sessionStorage.getItem(key);
            if (local) return local;
            if (session) return session;
        }
        return null;
    }

    function initials(name) {
        return String(name || 'U').trim().split(/\s+/).map((part) => part[0]).slice(0, 2).join('').toUpperCase() || 'U';
    }

    function applyAvatar(url, displayName) {
        avatarFallback.textContent = initials(displayName || 'U');

        if (!url) {
            avatar.style.display = 'none';
            avatar.removeAttribute('src');
            avatarFallback.style.display = 'grid';
            return;
        }

        avatar.onload = () => {
            avatar.style.display = 'block';
            avatarFallback.style.display = 'none';
        };

        avatar.onerror = () => {
            avatar.style.display = 'none';
            avatarFallback.style.display = 'grid';
        };

        avatar.src = url;
    }

    async function loadProfile() {
        const params = new URLSearchParams(window.location.search);
        const userType = params.get('userType') || 'patient';
        const userId = params.get('userId') || '';

        if (!userId) {
            statusEl.textContent = 'Parameter profile tidak valid';
            return;
        }

        const token = getToken();
        if (!token) {
            window.location.href = '/patient-login.html';
            return;
        }

        statusEl.textContent = 'Memuat...';

        const response = await fetch(`${API_BASE}/api/community-chat/profiles/${encodeURIComponent(userType)}/${encodeURIComponent(userId)}`, {
            headers: {
                'Authorization': `Bearer ${token}`
            }
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok || data.success === false || !data.profile) {
            statusEl.textContent = data.message || 'Profile tidak tersedia';
            return;
        }

        const profile = data.profile;

        nameEl.textContent = profile.display_name || '-';
        typeEl.textContent = profile.user_type === 'staff' ? 'Staff' : 'Patient';
        bioEl.textContent = profile.bio || 'Belum ada bio.';
        nicknameEl.textContent = profile.nickname || 'Belum diset.';
        applyAvatar(profile.avatar_url, profile.display_name || 'U');

        statusEl.textContent = 'Profile publik';
    }

    loadProfile().catch((error) => {
        statusEl.textContent = error.message || 'Gagal memuat profile';
    });
</script>
</body>
</html>
