<html lang="id" data-portal-nav="off" data-portal-nav-active="dokumen">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a1a">
    <title>Hasil Lab - SISIwanita</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/images/logo-dokter-dibya.png">
    <link rel="apple-touch-icon" href="/images/logo-dokter-dibya.png">

    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Shared Styles -->
    <link rel="stylesheet" href="/styles/patient-portal.css">

    <style>
        /* Lab Result Card */
        .lab-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            margin-bottom: 12px;
            overflow: hidden;
            transition: all 0.2s;
        }

        .lab-card:hover {
            border-color: #10b981;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(16, 185, 129, 0.2);
        }

        .lab-card-inner {
            display: flex;
            gap: 12px;
            padding: 15px;
            cursor: pointer;
        }

        .lab-icon {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            background: linear-gradient(135deg, #10b981, #059669);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: white;
            flex-shrink: 0;
        }

        .lab-icon.pdf {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        .lab-icon.image {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
        }

        .lab-info {
            flex: 1;
            min-width: 0;
        }

        .lab-title {
            font-size: 14px;
            font-weight: 600;
            color: white;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .lab-date {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .lab-description {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 5px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .new-badge {
            background: #28e97f;
            color: #000;
            font-size: 10px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 8px;
        }

        /* Stats */
        .stats-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-box {
            flex: 1;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }

        .stat-box .value {
            font-size: 24px;
            font-weight: 700;
            color: #10b981;
        }

        .stat-box .label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 3px;
        }

        /* Preview Modal */
        .preview-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            flex-direction: column;
        }

        .preview-modal.active {
            display: flex;
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            padding-top: calc(15px + env(safe-area-inset-top, 0px));
            background: rgba(26, 26, 46, 0.95);
        }

        .preview-header h3 {
            font-size: 14px;
            color: white;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-right: 15px;
        }

        .preview-close {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
        }

        .preview-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: auto;
        }

        .preview-body img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }

        .preview-body iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 8px;
        }

        .preview-footer {
            padding: 15px 20px;
            padding-bottom: calc(15px + env(safe-area-inset-bottom, 0px));
            background: rgba(26, 26, 46, 0.95);
        }

        .preview-date {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 5px;
        }

        .preview-desc {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 15px;
        }

        .preview-actions {
            display: flex;
            gap: 10px;
        }

        .preview-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-download {
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            color: white;
        }

        /* Empty placeholder message */
        .empty-info {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .empty-info p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
            margin: 0;
        }

        .empty-info i {
            color: #10b981;
            margin-right: 8px;
        }
    </style>

<body class="home-sections-locked patient-tool-shell legacy-tool-retrofit hasil-lab-page" data-tool-shell-active="dokumen" data-tool-kicker="Hasil Lab" data-tool-title="Hasil laboratorium." data-tool-copy="Lihat hasil pemeriksaan laboratorium yang dikirim dokter, dengan preview dan unduhan saat file tersedia." data-tool-meta-label="Dokumen" data-tool-meta-value="Lab Result">
    <!-- Safe Area Overlays -->
    <div class="safe-area-top" style="position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0);background:#1a1a2e;z-index:9999;"></div>
    <div class="safe-area-bottom" style="position:fixed;bottom:0;left:0;right:0;height:env(safe-area-inset-bottom,0);background:#1a1a2e;z-index:9999;"></div>
    <!-- Top Navbar -->
    <nav class="nav-bar">
        <div class="nav-left">
            <button class="back-btn" onclick="history.back()">
                <i class="fa fa-chevron-left"></i>
            </button>
            <h1 class="page-title">Hasil Lab</h1>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="content">
        <!-- Loading State -->
        <div class="loading" id="loading-state">
            <i class="fa fa-spinner fa-spin"></i>
            <span>Memuat hasil lab...</span>
        </div>

        <!-- Content (hidden until loaded) -->
        <div id="content-wrapper" style="display: none;">
            <!-- Info -->
            <div class="empty-info">
                <p><i class="fa fa-info-circle"></i> Hasil laboratorium yang dikirim oleh dokter Anda akan muncul di sini.</p>
            </div>

            <!-- Stats -->
            <div class="stats-row">
                <div class="stat-box">
                    <div class="value" id="stat-total">0</div>
                    <div class="label">Total Hasil</div>
                </div>
                <div class="stat-box">
                    <div class="value" id="stat-new">0</div>
                    <div class="label">Belum Dibaca</div>
                </div>
            </div>

            <!-- Lab Results List -->
            <div id="lab-list">
                <!-- Lab items will be populated -->
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="/patient-menu.html" class="nav-item">
            <i class="fa fa-home"></i>
            <span>Home</span>
        </a>
        <a href="#" class="nav-item" onclick="openNotificationModal(event); return false;">
            <i class="fa fa-bell"></i>
            <span>Notifikasi</span>
        </a>
        <a href="#" class="nav-item" onclick="openProfileModal(event); return false;">
            <i class="fa fa-user"></i>
            <span>Profil</span>
        </a>
    </nav>

    <!-- Preview Modal -->
    <div class="preview-modal" id="preview-modal">
        <div class="preview-header">
            <h3 id="preview-title">Hasil Lab</h3>
            <button class="preview-close" onclick="closePreview()">
                <i class="fa fa-times"></i>
            </button>
        </div>
        <div class="preview-body" id="preview-body">
            <!-- Content will be loaded -->
        </div>
        <div class="preview-footer">
            <div class="preview-date" id="preview-date"></div>
            <div class="preview-desc" id="preview-desc"></div>
            <div class="preview-actions">
                <button class="btn-download" onclick="downloadFile()">
                    <i class="fa fa-download"></i> Download
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <script type="module">
        import { getToken, checkAuth, apiRequest, showToast, formatDate, showEmptyState, escapeHtml } from '/scripts/patient-utils.js';

        // State
        let labResults = [];
        let currentLabItem = null;

        // Make functions globally available
        window.openLabPreview = openLabPreview;
        window.closePreview = closePreview;
        window.downloadFile = downloadFile;

        // Initialize
        document.addEventListener('DOMContentLoaded', async function() {
            if (!checkAuth()) return;

            await loadLabResults();

            // Mark bell notifications for this page as read
            try {
                await apiRequest('/api/patient-notifications/mark-read-by-link', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ link: '/hasil-lab.html' })
                });
            } catch (e) { /* silent */ }

            document.getElementById('loading-state').style.display = 'none';
            document.getElementById('content-wrapper').style.display = 'block';
        });

        // Load Lab Results
        async function loadLabResults() {
            try {
                const data = await apiRequest('/api/patient-documents/my-documents?type=lab_result');

                if (data && data.success && data.documents) {
                    labResults = data.documents.map(doc => ({
                        id: doc.id,
                        url: doc.file_url,
                        date: doc.published_at || doc.created_at,
                        title: doc.title,
                        description: doc.description,
                        isNew: !doc.first_viewed_at,
                        fileType: normalizeMimeType(doc.file_type) || getFileType(doc.file_url)
                    }));

                    // Sort by date descending
                    labResults.sort((a, b) => new Date(b.date) - new Date(a.date));

                    // Update stats
                    const newCount = labResults.filter(r => r.isNew).length;
                    document.getElementById('stat-total').textContent = labResults.length;
                    document.getElementById('stat-new').textContent = newCount;

                    renderLabList();
                } else {
                    renderLabList();
                }
            } catch (error) {
                console.error('Error loading lab results:', error);
                showToast('Gagal memuat hasil lab', 'error');
            }
        }

        // Normalize MIME type to simple type ('image', 'pdf', 'unknown')
        function normalizeMimeType(mimeType) {
            if (!mimeType) return null;
            if (mimeType.startsWith('image/')) return 'image';
            if (mimeType === 'application/pdf') return 'pdf';
            return null;
        }

        // Get file type from URL (handles signed URLs with query params)
        function getFileType(url) {
            if (!url) return 'unknown';
            // Remove query parameters first
            const urlWithoutQuery = url.split('?')[0];
            const ext = urlWithoutQuery.split('.').pop().toLowerCase();
            if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext)) return 'image';
            if (ext === 'pdf') return 'pdf';
            return 'unknown';
        }

        // Render lab list
        function renderLabList() {
            const list = document.getElementById('lab-list');

            if (labResults.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <i class="fa fa-flask"></i>
                        <p>Belum ada hasil lab dari dokter</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = labResults.map((lab, index) => {
                const date = new Date(lab.date);
                const dateStr = date.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });

                const iconClass = lab.fileType === 'pdf' ? 'pdf' : (lab.fileType === 'image' ? 'image' : '');
                const iconName = lab.fileType === 'pdf' ? 'fa-file-pdf-o' : (lab.fileType === 'image' ? 'fa-file-image-o' : 'fa-file-o');

                return `
                    <div class="lab-card">
                        <div class="lab-card-inner" onclick="openLabPreview(${index})">
                            <div class="lab-icon ${iconClass}">
                                <i class="fa ${iconName}"></i>
                            </div>
                            <div class="lab-info">
                                <div class="lab-title">
                                    ${escapeHtml(lab.title || 'Hasil Lab')}
                                    ${lab.isNew ? '<span class="new-badge">BARU</span>' : ''}
                                </div>
                                <div class="lab-date">
                                    <i class="fa fa-calendar"></i> ${dateStr}
                                </div>
                                ${lab.description ? `<div class="lab-description">${escapeHtml(lab.description)}</div>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Open lab preview
        async function openLabPreview(index) {
            currentLabItem = labResults[index];

            document.getElementById('preview-modal').classList.add('active');
            document.body.classList.add('document-viewer-open');
            document.body.style.overflow = 'hidden';

            const date = new Date(currentLabItem.date);
            const dateStr = date.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

            document.getElementById('preview-title').textContent = currentLabItem.title || 'Hasil Lab';
            document.getElementById('preview-date').textContent = dateStr;
            document.getElementById('preview-desc').textContent = currentLabItem.description || '';

            const previewBody = document.getElementById('preview-body');

            if (currentLabItem.fileType === 'image') {
                previewBody.innerHTML = `<img src="${currentLabItem.url}" alt="${escapeHtml(currentLabItem.title || 'Lab Result')}">`;
            } else if (currentLabItem.fileType === 'pdf') {
                previewBody.innerHTML = `
                    <div class="document-viewer-empty">
                        <i class="fa fa-file-pdf-o"></i>
                        <p>File PDF tidak dapat ditampilkan langsung.</p>
                        <p>Klik tombol Download untuk membuka file.</p>
                    </div>
                `;
            } else {
                previewBody.innerHTML = `
                    <div class="document-viewer-empty">
                        <i class="fa fa-file-o"></i>
                        <p>Preview tidak tersedia.</p>
                        <p>Klik tombol Download untuk membuka file.</p>
                    </div>
                `;
            }

            // Mark as viewed
            if (currentLabItem.isNew) {
                try {
                    await apiRequest(`/api/patient-documents/${currentLabItem.id}/view`, { method: 'POST' });
                    currentLabItem.isNew = false;
                    // Update stats
                    const newCount = labResults.filter(r => r.isNew).length;
                    document.getElementById('stat-new').textContent = newCount;
                    // Re-render to remove badge
                    renderLabList();
                } catch (e) {
                    console.error('Error marking viewed:', e);
                }
            }
        }

        // Close preview
        function closePreview() {
            document.getElementById('preview-modal').classList.remove('active');
            document.body.classList.remove('document-viewer-open');
            document.body.style.overflow = '';
            currentLabItem = null;
        }

        // Download file
        function downloadFile() {
            if (!currentLabItem) return;

            const link = document.createElement('a');
            link.href = currentLabItem.url;
            link.download = currentLabItem.title || 'hasil-lab';
            link.target = '_blank';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (!document.getElementById('preview-modal').classList.contains('active')) return;
            if (e.key === 'Escape') closePreview();
        });
    </script>
