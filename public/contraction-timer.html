    <script type="module">
        import { getToken, checkAuth, apiRequest, showToast, escapeHtml } from '/scripts/patient-utils.js';

        const HPHT_KEY = 'patient_pregnancy_tracker_hpht_preview';
        const WHATSAPP_SUPPORT_URL = 'https://wa.me/62895320726801';
        const urlParams = new URLSearchParams(window.location.search);
        const isMockMode = urlParams.has('mockApi') || urlParams.has('mockContraction');

        const state = {
            gestationalAge: null,
            gestationalSource: 'unknown',
            activeSession: null,
            todaySessions: [],
            contractionStartedAt: null,
            timerInterval: null,
            currentHistoryPage: 1,
            totalHistoryPages: 1,
            redFlags: []
        };

        const mockState = {
            session: null,
            sessions: []
        };

        if (isMockMode && !getToken()) {
            localStorage.setItem('vps_auth_token', 'mock-contraction-token');
            localStorage.setItem('patient_user', JSON.stringify({ fullname: 'Nanda Ananda' }));
        }

        window.PatientToolShell?.init({ activeNav: 'aplikasi' });

        if (checkAuth()) {
            initContractionTimer();
        }

        async function initContractionTimer() {
            window.PatientToolShell?.updateAvatarInitials();
            await loadGestationalAge();
            await loadTodaySessions();
            render();
            window.PatientToolShell?.showContent({ loadingId: 'loading-state', contentId: 'content-wrapper' });
        }

        async function loadGestationalAge() {
            try {
                const tracker = await pregnancyApiRequest();
                if (tracker?.success && tracker.data) {
                    const data = normalizeTrackerData(tracker.data);
                    state.gestationalAge = { weeks: Number(data.weeksPregnant || 0), days: Number(data.daysExtra || 0) };
                    state.gestationalSource = data.source === 'local' ? 'HPHT lokal' : data.source === 'mock' ? 'Mock data' : 'USG terakhir';
                    setGestationalSource();
                    return;
                }
            } catch (error) {
                console.warn('Pregnancy tracker unavailable:', error);
            }

            const localHpht = localStorage.getItem(HPHT_KEY);
            if (localHpht && isValidLocalDate(localHpht)) {
                const data = createTrackerDataFromHpht(localHpht, 'local');
                state.gestationalAge = { weeks: data.weeksPregnant, days: data.daysExtra };
                state.gestationalSource = 'HPHT lokal';
                setGestationalSource();
                return;
            }

            state.gestationalAge = null;
            state.gestationalSource = 'Belum tersedia';
            setGestationalSource();
        }

        async function pregnancyApiRequest() {
            if (isMockMode) {
                await wait(90);
                const hpht = localStorage.getItem(HPHT_KEY) || getMockHpht(39, 1);
                return { success: true, data: createTrackerDataFromHpht(hpht, 'mock') };
            }
            return apiRequest('/api/patients/pregnancy-tracker?_t=' + Date.now());
        }

        async function loadTodaySessions() {
            try {
                const result = await contractionApiRequest('/api/contraction-timer/today');
                if (result?.success) {
                    state.todaySessions = result.sessions || [];
                    state.activeSession = result.active_session || state.todaySessions.find(session => session.status === 'active') || null;
                    state.redFlags = Array.isArray(state.activeSession?.red_flags) ? state.activeSession.red_flags : [];
                }
            } catch (error) {
                console.error('Contraction today error:', error);
                showToast('Gagal memuat sesi kontraksi', 'error');
            }
        }

        async function contractionApiRequest(url, options = {}) {
            if (!isMockMode) return apiRequest(url, options);
            const method = String(options.method || 'GET').toUpperCase();
            const body = options.body ? JSON.parse(options.body) : {};
            await wait(90);

            if (url.startsWith('/api/contraction-timer/today')) {
                return {
                    success: true,
                    sessions: [mockState.session, ...mockState.sessions].filter(Boolean),
                    active_session: mockState.session,
                    summary: {
                        total_sessions: mockState.sessions.length + (mockState.session ? 1 : 0),
                        total_contractions: getMockEvents(mockState.session).length
                    }
                };
            }

            if (url.startsWith('/api/contraction-timer/session') && method === 'POST') {
                mockState.session = {
                    id: Date.now(),
                    session_date: formatLocalDate(new Date()),
                    gestational_age_weeks: body.gestational_age?.weeks ?? body.gestationalAge?.weeks ?? 39,
                    gestational_age_days: body.gestational_age?.days ?? body.gestationalAge?.days ?? 0,
                    status: 'active',
                    started_at: new Date().toISOString(),
                    ended_at: null,
                    contraction_count: 0,
                    rest_hydration_result: 'unknown',
                    red_flags: [],
                    events: [],
                    assessment: createClientAssessment([], { weeks: 39, days: 0 }, 'unknown', [])
                };
                return { success: true, session: mockState.session };
            }

            if (url.startsWith('/api/contraction-timer/event') && method === 'POST') {
                if (!mockState.session) return { success: false, message: 'Belum ada sesi aktif' };
                const startedAt = new Date(body.started_at_client || body.startedAtClient);
                const endedAt = new Date(body.ended_at_client || body.endedAtClient);
                const previous = mockState.session.events[mockState.session.events.length - 1];
                const interval = previous ? Math.max(0, Math.round((startedAt.getTime() - new Date(previous.started_at_client).getTime()) / 1000)) : null;
                const event = {
                    id: Date.now(),
                    started_at_client: startedAt.toISOString(),
                    ended_at_client: endedAt.toISOString(),
                    duration_seconds: Math.max(1, Math.round((endedAt.getTime() - startedAt.getTime()) / 1000)),
                    interval_from_previous_seconds: interval
                };
                mockState.session.events.push(event);
                mockState.session.contraction_count = mockState.session.events.length;
                mockState.session.assessment = createClientAssessment(
                    mockState.session.events,
                    { weeks: mockState.session.gestational_age_weeks, days: mockState.session.gestational_age_days },
                    mockState.session.rest_hydration_result,
                    mockState.session.red_flags
                );
                return { success: true, event, session: mockState.session };
            }

            if (/\/api\/contraction-timer\/session\/\d+\/assessment/.test(url) && method === 'PUT') {
                if (!mockState.session) return { success: false, message: 'Sesi tidak ditemukan' };
                mockState.session.rest_hydration_result = body.rest_hydration_result || body.restHydrationResult || 'unknown';
                mockState.session.red_flags = body.red_flags || body.redFlags || [];
                mockState.session.assessment = createClientAssessment(
                    mockState.session.events,
                    { weeks: mockState.session.gestational_age_weeks, days: mockState.session.gestational_age_days },
                    mockState.session.rest_hydration_result,
                    mockState.session.red_flags
                );
                return { success: true, session: mockState.session };
            }

            if (/\/api\/contraction-timer\/session\/\d+\/end/.test(url) && method === 'PUT') {
                if (!mockState.session) return { success: false, message: 'Sesi tidak ditemukan' };
                mockState.session.status = 'completed';
                mockState.session.ended_at = new Date().toISOString();
                mockState.sessions.unshift(mockState.session);
                const completed = mockState.session;
                mockState.session = null;
                return { success: true, session: completed };
            }

            if (url.startsWith('/api/contraction-timer/history')) {
                return {
                    success: true,
                    sessions: [mockState.session, ...mockState.sessions].filter(Boolean),
                    pagination: { page: 1, limit: 10, total: mockState.sessions.length + (mockState.session ? 1 : 0), totalPages: 1 }
                };
            }

            return { success: false, message: 'Mock endpoint tidak tersedia' };
        }

        function render() {
            const container = document.getElementById('contraction-content');
            if (!container) return;

            container.innerHTML = `
                <section class="section reveal">
                    <div class="timer-grid">
                        ${renderTimerPanel()}
                        ${renderAssessmentPanel()}

                </section>

                <section class="section reveal">
                    ${renderSummaryPanel()}
                </section>

                <section class="section reveal">
                    ${renderRedFlagPanel()}
                </section>

                <section class="section reveal">
                    ${renderRecentPanel()}
                </section>
            `;

            updateTimerVisual();
        }

        function renderHphtFallback() {
            return `
                <section class="section reveal">
                    <div class="hpht-card">
                        <div class="panel-kicker">Data Kehamilan</div>
                        <h3 class="panel-title">Usia kehamilan belum tersedia</h3>
                        <p class="panel-copy">Isi HPHT untuk pratinjau lokal. Data resmi tetap mengikuti catatan USG dokter di Monitoring Kehamilan.</p>

        }

        function renderTimerPanel() {
            const isRunning = Boolean(state.contractionStartedAt);

                    <div class="panel-kicker">${state.activeSession ? 'Sesi aktif' : 'Sesi baru'}</div>

                    <p class="panel-copy">${state.activeSession ? 'Sesi tersimpan di akun pasien dan akan muncul lagi setelah refresh.' : 'Tekan mulai saat kontraksi dimulai, lalu selesai saat kontraksi berhenti.'}</p>
                    <div class="duration-display" id="duration-display">00:00</div>

        }

        function renderAssessmentPanel() {
            const assessment = getAssessment();
            const code = assessment.code || 'inconclusive';
            const urgent = ['emergency_now', 'preterm_warning', 'urgent_evaluation'].includes(code);
            const actionText = urgent ? 'segera ke unit persalinan/IGD' : assessment.next_action;
            return `
                <div class="assessment-panel ${escapeHtml(code)}">
                    <div class="assessment-icon"><i class="fa-solid ${urgent ? 'fa-triangle-exclamation' : 'fa-circle-info'}"></i></div>
                    <div class="panel-kicker">Hasil sementara</div>
                    <h3 class="panel-title">${escapeHtml(assessment.label || 'Belum cukup data')}</h3>
                    <p class="panel-copy">${escapeHtml(assessment.copy || 'Catat beberapa kontraksi lagi agar pola lebih mudah dibaca.')}</p>
                    <ul class="reason-list">
                        ${(assessment.reasons || []).slice(0, 4).map(reason => `<li><i class="fa-solid fa-check"></i><span>${escapeHtml(reason)}</span></li>`).join('') || '<li><i class="fa-solid fa-clock"></i><span>Butuh minimal 3 kontraksi untuk membaca pola.</span></li>'}
                    </ul>
                    <div class="action-row">
                        ${urgent ? `
                            <button type="button" class="primary-action soundable" onclick="showUrgentInstruction()"><i class="fa-solid fa-triangle-exclamation"></i> Segera ke unit persalinan/IGD</button>

                    </div>
                    <p class="panel-copy" style="margin-top:10px;font-weight:800;color:${urgent ? '#7f1d1d' : 'var(--muted)'}">${escapeHtml(actionText || '')}</p>

        }

        function renderSummaryPanel() {
            const events = getEvents();
            const stats = summarizeEvents(events);
            return `
                <div class="summary-panel">
                    <div class="panel-kicker">Ringkasan Sesi</div>
                    <div class="summary-grid">
                        <div class="summary-stat">
                            <div class="value">${events.length}</div>
                            <div class="label">Kontraksi</div>
                        </div>
                        <div class="summary-stat">
                            <div class="value">${stats.avgDuration ? Math.round(stats.avgDuration) : '-'}</div>
                            <div class="label">Detik rata-rata</div>
                        </div>
                        <div class="summary-stat">
                            <div class="value">${stats.avgInterval ? Math.round(stats.avgInterval / 60) : '-'}</div>

                        </div>
                    </div>
                    ${events.length >= 3 ? `
                        <div class="recheck-row">
                            <button type="button" class="portal-button-ghost soundable" onclick="setRestHydrationResult('improved')"><i class="fa-solid fa-mug-hot"></i> Mereda setelah istirahat/minum/ganti posisi</button>
                            <button type="button" class="portal-button-ghost soundable" onclick="setRestHydrationResult('not_improved')"><i class="fa-solid fa-wave-square"></i> Tidak mereda</button>
                        </div>
                    ` : ''}
                </div>
            `;

        function renderRedFlagPanel() {
            const flags = [
                ['bleeding', 'Perdarahan'],
                ['ketuban_pecah', 'Air ketuban keluar'],
                ['constant_pain', 'Nyeri menetap di luar kontraksi'],
                ['reduced_fetal_movement', 'Gerak bayi berkurang'],
                ['severe_symptoms', 'Gejala berat lain']
            ];
            return `
                <div class="red-flag-panel">
                    <div class="panel-kicker">Tanda Bahaya</div>
                    <h3 class="panel-title">Utamakan alarm klinis</h3>
                    <p class="panel-copy">Jika salah satu muncul, hasil pola kontraksi tidak dipakai sebagai penentu. Arah utama: segera ke unit persalinan/IGD.</p>
                    <div class="red-flag-grid">
                        ${flags.map(([value, label]) => `
                            <label class="flag-option">
                                <input type="checkbox" value="${value}" onchange="toggleRedFlag(this)">
                                <span>${label}</span>
                            </label>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderRecentPanel() {
            const events = getEvents();
            const todayCompleted = state.todaySessions.filter(session => session.status !== 'active').slice(0, 3);
            return `
                <div class="history-panel">
                    <div class="panel-kicker">Catatan Terakhir</div>
                    <h3 class="panel-title">Kontraksi hari ini</h3>
                    <div class="event-list">
                        ${events.length ? events.slice(-5).reverse().map((event, index) => renderEventRow(event, events.length - index)).join('') : '<div class="empty-state">Belum ada kontraksi tercatat.</div>'}
                    </div>
                    ${todayCompleted.length ? `
                        <div class="history-list">
                            ${todayCompleted.map(session => renderHistoryRow(session)).join('')}
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function renderEventRow(event, number) {
            const interval = event.interval_from_previous_seconds ? `${Math.round(event.interval_from_previous_seconds / 60)} menit dari sebelumnya` : 'Kontraksi pertama';
            return `
                <div class="event-row">
                    <div>
                        <div class="row-title">Kontraksi ${number}</div>
                        <div class="row-sub">${formatTime(event.started_at_client)} - ${interval}</div>
                    </div>
                    <div class="row-pill">${Math.round(Number(event.duration_seconds || 0))} detik</div>
                </div>
            `;
        }

        function renderHistoryRow(session) {
            const assessment = session.assessment || {};
            const events = Array.isArray(session.events) ? session.events : [];
            return `
                <div class="history-row">
                    <div>
                        <div class="row-title">${formatDate(session.started_at || session.session_date)} - ${escapeHtml(assessment.label || 'Sesi kontraksi')}</div>
                        <div class="row-sub">${events.length || Number(session.contraction_count || 0)} kontraksi - ${escapeHtml(formatGestationalAge({ weeks: session.gestational_age_weeks, days: session.gestational_age_days }))}</div>
                    </div>
                    <div class="row-pill">${escapeHtml(session.status === 'active' ? 'Aktif' : 'Selesai')}</div>
                </div>
            `;

        function getAssessment() {
            if (state.activeSession?.assessment) return state.activeSession.assessment;
            if (state.redFlags.length) {
                return {
                    code: 'emergency_now',
                    label: 'Tanda bahaya',
                    copy: 'Ada tanda bahaya yang perlu dinilai langsung, terlepas dari pola kontraksi.',
                    reasons: state.redFlags.map(flag => getFlagLabel(flag)),
                    next_action: 'Segera ke IGD/unit persalinan terdekat.'
                };
            }
            return {
                code: 'inconclusive',
                label: 'Belum cukup data',
                copy: 'Catat beberapa kontraksi lagi agar pola lebih mudah dibaca.',
                reasons: [],
                next_action: 'Lanjutkan pencatatan dan perhatikan tanda bahaya.'
            };
        }

        async function toggleContraction() {
            if (state.contractionStartedAt) {
                await finishContraction();
                return;
            }
            await startContraction();
        }

        async function startContraction() {
            if (!state.activeSession) {
                const started = await startSession();
                if (!started) return;
            }

            state.contractionStartedAt = new Date();
            startTimerInterval();
            render();
        }

        async function startSession() {
            try {
                const result = await contractionApiRequest('/api/contraction-timer/session', {
                    method: 'POST',
                    body: JSON.stringify({
                        gestational_age: state.gestationalAge,
                        source: state.gestationalSource || 'unknown'
                    })
                });
                if (!result?.success || !result.session) {
                    showToast(result?.message || 'Gagal memulai sesi kontraksi', 'error');
                    return false;
                }
                state.activeSession = result.session;
                state.todaySessions = [result.session, ...state.todaySessions.filter(session => session.id !== result.session.id)];
                if (state.redFlags.length) await updateAssessment();
                showToast('Sesi kontraksi dimulai', 'success');
                return true;
            } catch (error) {
                console.error('Start session error:', error);
                showToast('Gagal memulai sesi kontraksi', 'error');
                return false;
            }
        }

        async function finishContraction() {
            if (!state.activeSession || !state.contractionStartedAt) return;
            const startedAt = state.contractionStartedAt;
            const endedAt = new Date();
            stopTimerInterval();
            state.contractionStartedAt = null;

            try {
                const result = await contractionApiRequest('/api/contraction-timer/event', {
                    method: 'POST',
                    body: JSON.stringify({
                        session_id: state.activeSession.id,
                        started_at_client: startedAt.toISOString(),
                        ended_at_client: endedAt.toISOString()
                    })
                });
                if (result?.success && result.session) {
                    state.activeSession = result.session;
                    state.todaySessions = [result.session, ...state.todaySessions.filter(session => session.id !== result.session.id)];
                    state.redFlags = Array.isArray(result.session.red_flags) ? result.session.red_flags : state.redFlags;
                    showToast('Kontraksi tercatat', 'success');
                    render();
                    return;
                }
                showToast(result?.message || 'Gagal mencatat kontraksi', 'error');
            } catch (error) {
                console.error('Finish contraction error:', error);
                showToast('Gagal mencatat kontraksi', 'error');
            }
            render();
        }

        async function endSession() {
            if (!state.activeSession) return;
            if (state.contractionStartedAt) {
                showToast('Selesaikan kontraksi yang sedang berjalan dulu', 'warning');
                return;
            }
            try {
                const result = await contractionApiRequest(`/api/contraction-timer/session/${state.activeSession.id}/end`, { method: 'PUT' });
                if (result?.success) {
                    state.todaySessions = [result.session, ...state.todaySessions.filter(session => session.id !== result.session.id)];
                    state.activeSession = null;
                    state.redFlags = [];
                    showToast('Sesi kontraksi selesai', 'success');
                    render();
                    return;
                }
                showToast(result?.message || 'Gagal menyelesaikan sesi', 'error');
            } catch (error) {
                console.error('End session error:', error);
                showToast('Gagal menyelesaikan sesi', 'error');
            }
        }

        async function setRestHydrationResult(value) {
            if (!state.activeSession) {
                showToast('Mulai sesi dulu untuk menyimpan hasil reassessment', 'warning');
                return;
            }
            state.activeSession.rest_hydration_result = value;
            await updateAssessment();
        }

        async function toggleRedFlag(input) {
            const value = input.value;
            state.redFlags = input.checked
                ? Array.from(new Set([...state.redFlags, value]))
                : state.redFlags.filter(flag => flag !== value);
            if (state.activeSession) await updateAssessment();
            else render();
        }

        async function updateAssessment() {
            if (!state.activeSession) return;
            try {
                const result = await contractionApiRequest(`/api/contraction-timer/session/${state.activeSession.id}/assessment`, {
                    method: 'PUT',
                    body: JSON.stringify({
                        rest_hydration_result: state.activeSession.rest_hydration_result || 'unknown',
                        red_flags: state.redFlags
                    })
                });
                if (result?.success && result.session) {
                    state.activeSession = result.session;
                    state.redFlags = Array.isArray(result.session.red_flags) ? result.session.red_flags : state.redFlags;
                    state.todaySessions = [result.session, ...state.todaySessions.filter(session => session.id !== result.session.id)];
                    render();
                    return;
                }
                showToast(result?.message || 'Gagal memperbarui asesmen', 'error');
            } catch (error) {
                console.error('Assessment update error:', error);
                showToast('Gagal memperbarui asesmen', 'error');
            }
        }

        function bindHphtForm() {
            const form = document.getElementById('hpht-form');
            const input = document.getElementById('hphtInput');
            if (!form || !input) return;
            input.value = localStorage.getItem(HPHT_KEY) || '';
            form.addEventListener('submit', async function(event) {
                event.preventDefault();
                const hpht = input.value;
                if (!hpht || !isValidLocalDate(hpht)) {
                    showToast('Tanggal HPHT belum valid', 'warning');
                    return;
                }
                localStorage.setItem(HPHT_KEY, hpht);
                const data = createTrackerDataFromHpht(hpht, 'local');
                state.gestationalAge = { weeks: data.weeksPregnant, days: data.daysExtra };
                state.gestationalSource = 'HPHT lokal';
                setGestationalSource();
                await loadTodaySessions();
                render();
                showToast('Usia kehamilan dihitung dari HPHT lokal', 'success');
            });
        }

        function startTimerInterval() {
            stopTimerInterval();
            state.timerInterval = window.setInterval(updateTimerVisual, 250);
        }

        function stopTimerInterval() {
            if (state.timerInterval) window.clearInterval(state.timerInterval);
            state.timerInterval = null;
        }

        function updateTimerVisual() {
            const display = document.getElementById('duration-display');
            const sub = document.getElementById('duration-sub');
            if (!display) return;
            if (!state.contractionStartedAt) {
                display.textContent = '00:00';
                if (sub) sub.textContent = 'Durasi kontraksi';
                return;
            }
            const seconds = Math.max(0, Math.floor((Date.now() - state.contractionStartedAt.getTime()) / 1000));
            display.textContent = formatDuration(seconds);
            if (sub) sub.textContent = 'Kontraksi berlangsung';
        }

        function openHistoryModal() {
            document.getElementById('history-modal')?.classList.add('active');
            loadHistory(1);
        }

        function closeHistoryModal() {
            document.getElementById('history-modal')?.classList.remove('active');
        }

        function changeHistoryPage(delta) {
            const nextPage = Math.max(1, Math.min(state.totalHistoryPages, state.currentHistoryPage + delta));
            if (nextPage !== state.currentHistoryPage) loadHistory(nextPage);
        }

        function showUrgentInstruction() {
            showToast('Segera ke unit persalinan/IGD terdekat', 'warning', 4200);
        }

        async function loadHistory(page) {
            const container = document.getElementById('history-modal-body');
            if (!container) return;
            container.innerHTML = '<div class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i><br>Memuat riwayat...</div>';
            try {
                const result = await contractionApiRequest(`/api/contraction-timer/history?page=${page}&limit=10`);
                if (!result?.success) {
                    container.innerHTML = '<div class="empty-state">Gagal memuat riwayat.</div>';
                    return;
                }
                const sessions = result.sessions || [];
                container.innerHTML = sessions.length
                    ? `<div class="history-list">${sessions.map(session => renderHistoryRow(session)).join('')}</div>`
                    : '<div class="empty-state">Belum ada riwayat kontraksi.</div>';
                state.currentHistoryPage = page;
                state.totalHistoryPages = result.pagination?.totalPages || 1;
                const pager = document.getElementById('history-pagination');
                if (pager) pager.style.display = state.totalHistoryPages > 1 ? 'flex' : 'none';
                document.getElementById('page-info').textContent = `Halaman ${state.currentHistoryPage} dari ${state.totalHistoryPages}`;
                document.getElementById('prev-page-btn').disabled = state.currentHistoryPage <= 1;
                document.getElementById('next-page-btn').disabled = state.currentHistoryPage >= state.totalHistoryPages;
            } catch (error) {
                console.error('History error:', error);
                container.innerHTML = '<div class="empty-state">Gagal memuat riwayat.</div>';
            }
        }

        function syncRedFlagInputs() {
            document.querySelectorAll('.flag-option input').forEach(input => {
                input.checked = state.redFlags.includes(input.value);
            });
        }

        function setGestationalSource() {
            const source = document.getElementById('gestational-source');
            const text = state.gestationalAge
                ? `${formatGestationalAge(state.gestationalAge)} - ${state.gestationalSource}`
                : state.gestationalSource;
            if (source) source.innerHTML = `<i class="fa-solid fa-baby"></i> ${escapeHtml(text)}`;
        }

        function getEvents() {
            return Array.isArray(state.activeSession?.events) ? state.activeSession.events : [];
        }

        function getMockEvents(session) {
            return Array.isArray(session?.events) ? session.events : [];
        }

        function summarizeEvents(events) {
            const durations = events.map(event => Number(event.duration_seconds || 0)).filter(value => Number.isFinite(value) && value > 0);
            const intervals = events.map(event => Number(event.interval_from_previous_seconds || 0)).filter(value => Number.isFinite(value) && value > 0);
            return {
                avgDuration: durations.length ? durations.reduce((sum, value) => sum + value, 0) / durations.length : 0,
                avgInterval: intervals.length ? intervals.reduce((sum, value) => sum + value, 0) / intervals.length : 0
            };
        }

        function getGestationalTotalDays() {
            if (!state.gestationalAge) return 0;
            return Number(state.gestationalAge.weeks || 0) * 7 + Number(state.gestationalAge.days || 0);
        }

        function normalizeTrackerData(data) {
            return {
                ...data,
                source: data.source || 'server',
                weeksPregnant: data.weeksPregnant ?? data.weeks_pregnant ?? data.weeks ?? 0,
                daysExtra: data.daysExtra ?? data.days_extra ?? data.days ?? 0
            };
        }

        function createTrackerDataFromHpht(hpht, source) {
            const hphtDate = parseLocalDate(hpht);
            const today = startOfLocalDay(new Date());
            const daysPregnant = Math.max(0, Math.floor((today.getTime() - hphtDate.getTime()) / 86400000));
            return {
                source,
                hpht,
                weeksPregnant: Math.floor(daysPregnant / 7),
                daysExtra: daysPregnant % 7
            };
        }

        function createClientAssessment(events, gestationalAge, restHydrationResult, redFlags) {
            const stats = summarizeEvents(events);
            const totalDays = Number(gestationalAge.weeks || 0) * 7 + Number(gestationalAge.days || 0);
            if (redFlags?.length) return {
                code: 'emergency_now',
                label: 'Tanda bahaya',
                copy: 'Ada tanda bahaya yang perlu dinilai langsung, terlepas dari pola kontraksi.',
                reasons: redFlags.map(flag => getFlagLabel(flag)),
                next_action: 'Segera ke IGD/unit persalinan terdekat.',
                stats
            };
            if (events.length < 3) return {
                code: 'inconclusive',
                label: 'Belum cukup data',
                copy: 'Catat beberapa kontraksi lagi agar pola lebih mudah dibaca.',
                reasons: [],
                next_action: 'Lanjutkan pencatatan dan perhatikan tanda bahaya.',
                stats
            };
            if (restHydrationResult === 'improved') return {
                code: 'braxton_hicks_like',
                label: 'Lebih mirip Braxton Hicks',
                copy: 'Pola kontraksi tidak teratur atau mereda setelah istirahat, minum, dan ganti posisi.',
                reasons: ['kontraksi mereda setelah istirahat, hidrasi, atau ganti posisi'],
                next_action: 'Istirahat, cukup minum, dan ulangi pencatatan bila kontraksi muncul lagi.',
                stats
            };
            if (totalDays < 37 * 7) return {
                code: 'preterm_warning',
                label: 'Kontraksi sebelum 37 minggu',
                copy: 'Kontraksi teratur sebelum 37 minggu perlu dievaluasi karena bisa terkait persalinan prematur.',
                reasons: [`${events.length} kontraksi tercatat`],
                next_action: 'Segera hubungi unit persalinan/IGD atau datang ke fasilitas kesehatan.',
                stats
            };
            if (stats.avgInterval > 0 && stats.avgInterval <= 300 && stats.avgDuration >= 60) return {
                code: 'urgent_evaluation',
                label: 'Perlu evaluasi persalinan',
                copy: 'pola kontraksi sudah teratur dan perlu evaluasi persalinan. Fase aktif hanya bisa dipastikan lewat pemeriksaan serviks.',
                reasons: [`${events.length} kontraksi tercatat`],
                next_action: 'Segera hubungi unit persalinan/IGD atau datang ke fasilitas kesehatan.',
                stats
            };
            return {
                code: stats.avgDuration < 40 ? 'braxton_hicks_like' : 'latent_like',
                label: stats.avgDuration < 40 ? 'Lebih mirip Braxton Hicks' : 'Lebih mirip fase laten',
                copy: stats.avgDuration < 40
                    ? 'Pola kontraksi tidak teratur atau durasinya masih pendek.'
                    : 'Pola ini lebih mirip fase laten: kontraksi menetap, tetapi belum cukup rapat dan lama untuk evaluasi persalinan aktif.',
                reasons: [`${events.length} kontraksi tercatat`],
                next_action: 'Tetap pantau. Ke fasilitas kesehatan bila makin teratur, makin kuat, atau ada tanda bahaya.',
                stats
            };
        }

        function getFlagLabel(value) {
            const map = {
                bleeding: 'perdarahan',
                ketuban_pecah: 'air ketuban keluar',
                constant_pain: 'nyeri menetap di luar kontraksi',
                reduced_fetal_movement: 'gerak bayi berkurang',
                severe_symptoms: 'gejala berat'
            };
            return map[value] || value;
        }

        function getMockHpht(weeks, days) {
            const date = startOfLocalDay(new Date());
            date.setDate(date.getDate() - ((Number(weeks || 39) * 7) + Number(days || 0)));
            return formatLocalDate(date);
        }

        function parseLocalDate(value) {
            const parts = String(value || '').split('-').map(Number);
            return new Date(parts[0], (parts[1] || 1) - 1, parts[2] || 1);
        }

        function isValidLocalDate(value) {
            const date = parseLocalDate(value);
            return value && !Number.isNaN(date.getTime()) && date <= startOfLocalDay(new Date());
        }

        function startOfLocalDay(date) {
            return new Date(date.getFullYear(), date.getMonth(), date.getDate());
        }

        function formatLocalDate(date) {
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        }

        function formatDate(value) {
            if (!value) return '-';
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return '-';
            return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
        }

        function formatTime(value) {
            if (!value) return '-';
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return '-';
            return date.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        }

        function formatDuration(seconds) {
            const safeSeconds = Math.max(0, Number(seconds || 0));
            const minutes = Math.floor(safeSeconds / 60);
            const rest = Math.floor(safeSeconds % 60);
            return `${String(minutes).padStart(2, '0')}:${String(rest).padStart(2, '0')}`;
        }

        function formatGestationalAge(value) {
            if (!value || value.weeks == null) return '-';
            return `${Number(value.weeks || 0)} minggu ${Number(value.days || 0)} hari`;
        }

        function wait(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        window.toggleContraction = toggleContraction;
        window.endSession = endSession;
        window.setRestHydrationResult = setRestHydrationResult;
        window.toggleRedFlag = toggleRedFlag;
        window.openHistoryModal = openHistoryModal;
        window.closeHistoryModal = closeHistoryModal;
        window.changeHistoryPage = changeHistoryPage;
        window.showUrgentInstruction = showUrgentInstruction;
    </script>
