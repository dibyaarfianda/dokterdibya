    <style>
        /* ========== CSS VARIABLES (Monochrome Design System) ========== */
        :root {
            --bg-page: #ffffff;
            --bg-secondary: #ffffff;
            --bg-surface: #ffffff;
            --text-primary: #111111;
            --text-body: #2b2b2b;
            --text-secondary: #606060;
            --text-muted: #686868;
            --accent: #111111;
            --accent-hover: #2a2a2a;
            --accent-soft: rgba(0, 0, 0, 0.08);
            --line-soft: rgba(0, 0, 0, 0.1);
            --line-strong: rgba(0, 0, 0, 0.18);
            --font-main: 'Inter', Arial, sans-serif;
        }

        /* ========== RESET ========== */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            background: var(--bg-page);
        }

        body {
            font-family: var(--font-main);
            background: var(--bg-page);
            min-height: 100vh;
            color: var(--text-primary);
            font-size: 14px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            overflow-x: hidden;
        }

        ::selection {
            background: #e8e8e8;
            color: #141414;
        }

        /* ========== SAFE AREA ========== */
        .safe-area-top {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: env(safe-area-inset-top, 0px);
            background: rgba(255, 255, 255, 0.95);
            z-index: 9999;
        }

        .safe-area-bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: env(safe-area-inset-bottom, 0px);
            background: rgba(255, 255, 255, 0.95);
            z-index: 9999;
        }

        /* ========== TOPBAR ========== */
        .topbar {
            position: fixed;
            top: env(safe-area-inset-top, 0px);
            left: 0;
            right: 0;
            z-index: 40;
            background: rgba(255, 255, 255, 0.92);
            -webkit-backdrop-filter: blur(24px);
            backdrop-filter: blur(24px);
            border-bottom: 1.5px dashed var(--line-soft);
            transition: border-color 0.3s ease;
        }

        .topbar.scrolled {
            border-bottom-color: var(--line-strong);
        }

        .topbar-inner {
            max-width: 760px;
            margin: 0 auto;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .back-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1.8px dashed var(--line-soft);
            background: transparent;
            display: grid;
            place-items: center;
            cursor: pointer;
            color: var(--text-primary);
            font-size: 14px;
            flex-shrink: 0;
            transition: border-color 0.2s, background 0.2s;
        }

        .back-btn:active {
            background: var(--accent-soft);
            border-color: var(--line-strong);
        }

        .topbar-title {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--text-primary);
        }

        /* ========== MAIN CONTENT ========== */
        .main-content {
            max-width: 760px;
            margin: 0 auto;
            padding: 16px;
            padding-top: calc(70px + env(safe-area-inset-top, 0px));
            padding-bottom: 40px;
            min-height: 100vh;
        }

        /* ========== STATS ROW ========== */
        .stats-row {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        .stat-box {
            flex: 1;
            border: 1.8px dashed var(--line-soft);
            border-radius: 14px;
            padding: 14px 16px;
            text-align: center;
            background: transparent;
        }

        .stat-box .value {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.2;
        }

        .stat-box .label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            margin-top: 2px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* ========== DOCUMENT CARDS ========== */
        .doc-card {
            border: 1.8px dashed var(--line-soft);
            border-radius: 14px;
            margin-bottom: 12px;
            background: transparent;
            transition: border-color 0.2s;
        }

        .doc-card:active {
            border-color: var(--line-strong);
        }

        .doc-card-inner {
            display: flex;
            gap: 14px;
            padding: 16px;
            align-items: flex-start;
        }

        .doc-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            font-size: 18px;
            flex-shrink: 0;
            border: 1.8px dashed var(--line-soft);
            color: var(--text-primary);
            background: var(--accent-soft);
        }

        .doc-info {
            flex: 1;
            min-width: 0;
        }

        .doc-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 4px;
        }

        .doc-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3;
        }

        .doc-location {
            font-size: 10px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 10px;
            flex-shrink: 0;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            border: 1.5px dashed var(--line-soft);
            color: var(--text-secondary);
            background: transparent;
        }

        .new-badge {
            display: inline-block;
            background: var(--text-primary);
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 8px;
            margin-left: 8px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            vertical-align: middle;
        }

        .doc-date {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .doc-date i {
            font-size: 11px;
            opacity: 0.6;
        }

        .doc-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .doc-btn {
            flex: 1;
            padding: 9px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            font-family: var(--font-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.15s;
        }

        .doc-btn.view-btn {
            background: var(--text-primary);
            border: none;
            color: #fff;
        }

        .doc-btn.view-btn:active {
            background: var(--accent-hover);
        }

        .doc-btn.download-btn {
            background: transparent;
            border: 1.8px dashed var(--line-soft);
            color: var(--text-primary);
        }

        .doc-btn.download-btn:active {
            border-color: var(--line-strong);
            background: var(--accent-soft);
        }

        /* ========== LOADING STATE ========== */
        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            color: var(--text-muted);
            gap: 12px;
        }

        .loading-state i {
            font-size: 28px;
            opacity: 0.4;
        }

        .loading-state span {
            font-size: 13px;
            font-weight: 500;
        }

        /* ========== EMPTY STATE ========== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 40px;
            opacity: 0.25;
            margin-bottom: 12px;
            display: block;
        }

        .empty-state p {
            font-size: 14px;
            font-weight: 500;
        }

        /* ========== PREVIEW MODAL ========== */
        .preview-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.98);
            -webkit-backdrop-filter: blur(24px);
            backdrop-filter: blur(24px);
            z-index: 9999;
            flex-direction: column;
        }

        .preview-modal.active {
            display: flex;
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            padding-top: calc(14px + env(safe-area-inset-top, 0px));
            border-bottom: 1.5px dashed var(--line-soft);
            background: rgba(255, 255, 255, 0.95);
        }

        .preview-header h3 {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-right: 12px;
        }

        .preview-close {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1.8px dashed var(--line-soft);
            background: transparent;
            display: grid;
            place-items: center;
            cursor: pointer;
            color: var(--text-primary);
            font-size: 16px;
            flex-shrink: 0;
            transition: border-color 0.2s, background 0.2s;
        }

        .preview-close:active {
            background: var(--accent-soft);
            border-color: var(--line-strong);
        }

        .preview-body {
            flex: 1;
            overflow: auto;
            padding: 20px 16px;
        }

        .preview-body img {
            max-width: 100%;
            border-radius: 10px;
            border: 1.8px dashed var(--line-soft);
        }

        .preview-body iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .preview-footer {
            padding: 14px 16px;
            padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
            border-top: 1.5px dashed var(--line-soft);
            background: rgba(255, 255, 255, 0.95);
        }

        .preview-actions {
            display: flex;
            gap: 10px;
            max-width: 760px;
            margin: 0 auto;
        }

        .preview-actions button {
            flex: 1;
            padding: 13px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            font-family: var(--font-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.15s;
        }

        .btn-download {
            background: var(--text-primary);
            border: none;
            color: #fff;
        }

        .btn-download:active {
            background: var(--accent-hover);
        }

        .btn-share {
            background: transparent;
            border: 1.8px dashed var(--line-soft);
            color: var(--text-primary);
        }

        .btn-share:active {
            border-color: var(--line-strong);
            background: var(--accent-soft);
        }

        /* ========== RESUME CONTENT (in preview) ========== */
        .resume-content {
            border: 1.8px dashed var(--line-soft);
            border-radius: 14px;
            padding: 20px;
            color: var(--text-body);
            line-height: 1.8;
            font-size: 14px;
        }

        .resume-content h4 {
            color: var(--text-primary);
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
        }

        .resume-content p {
            margin-bottom: 14px;
            font-size: 14px;
        }

        .resume-loading {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-muted);
        }

        .resume-loading i {
            font-size: 30px;
            margin-bottom: 14px;
            opacity: 0.35;
            display: block;
        }

        .resume-loading p {
            font-size: 13px;
            font-weight: 500;
        }

        /* ========== TOAST ========== */
        #toast-container {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .toast {
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            font-family: var(--font-main);
            background: var(--text-primary);
            color: #fff;
            border: none;
            animation: toastIn 0.3s ease;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ========== SCROLL FADE-IN ========== */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .doc-card {
            animation: fadeInUp 0.35s ease both;
        }

        .doc-card:nth-child(1) { animation-delay: 0.05s; }
        .doc-card:nth-child(2) { animation-delay: 0.1s; }
        .doc-card:nth-child(3) { animation-delay: 0.15s; }
        .doc-card:nth-child(4) { animation-delay: 0.2s; }
        .doc-card:nth-child(5) { animation-delay: 0.25s; }
        .doc-card:nth-child(6) { animation-delay: 0.3s; }
        .doc-card:nth-child(7) { animation-delay: 0.35s; }
        .doc-card:nth-child(8) { animation-delay: 0.4s; }
    </style>

    <script>
    /* ===== Trial theme switch ===== */
    (function() {
        var p = new URLSearchParams(window.location.search);
        var t = p.get('theme');
        if (t === 'off' || t === 'old' || t === 'default') {
            try { sessionStorage.removeItem('patient_portal_theme_mode'); } catch(e) {}
            window.location.replace('/dokumen-medis.html');
            return;
        }
        try { sessionStorage.setItem('patient_portal_theme_mode', 'newdesign'); } catch(e) {}
    })();

    /* ===== Topbar scroll behavior ===== */
    (function() {
        var topbar = document.getElementById('topbar');
        var lastY = 0;
        window.addEventListener('scroll', function() {
            var y = window.scrollY;
            if (y > 20) {
                topbar.classList.add('scrolled');
            } else {
                topbar.classList.remove('scrolled');
            }
            lastY = y;
        }, { passive: true });
    })();
    </script>

    <script type="module">
        import { getToken, checkAuth, apiRequest, showToast, formatDate, showEmptyState, escapeHtml } from '/scripts/patient-utils.js';

        // State
        let allDocuments = [];
        let filteredDocuments = [];
        let currentFilter = 'all';
        let currentDoc = null;

        // Make functions globally available
        window.filterByType = filterByType;
        window.viewDocument = viewDocument;
        window.closePreview = closePreview;
        window.downloadFile = downloadFile;
        window.shareFile = shareFile;

        // Initialize
        document.addEventListener('DOMContentLoaded', async function() {
            if (!checkAuth()) return;

            await loadDocuments();

            // Mark bell notifications for this page as read
            try {
                await apiRequest('/api/patient-notifications/mark-read-by-link', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ link: '/dokumen-medis.html' })
                });
            } catch (e) { /* silent */ }

            document.getElementById('loading-state').style.display = 'none';
            document.getElementById('content-wrapper').style.display = 'block';
        });

        // Load Documents
        async function loadDocuments() {
            try {
                const data = await apiRequest('/api/patient-documents/my-documents');

                if (data && data.success && data.documents) {
                    // Filter to only show resume_medis
                    allDocuments = data.documents.filter(doc =>
                        doc.document_type === 'resume_medis'
                    );

                    // Sort by date descending
                    allDocuments.sort((a, b) => new Date(b.published_at || b.created_at) - new Date(a.published_at || a.created_at));

                    // Update stats
                    const resumeCount = allDocuments.length;
                    document.getElementById('stat-resume').textContent = resumeCount;

                    // Set filtered documents
                    filteredDocuments = [...allDocuments];
                    renderDocList();
                } else {
                    renderDocList();
                }
            } catch (error) {
                console.error('Error loading documents:', error);
                showToast('Gagal memuat dokumen', 'error');
            }
        }

        // Filter by type
        function filterByType(type) {
            currentFilter = type;

            // Update tabs
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.type === type);
            });

            // Filter documents
            if (type === 'all') {
                filteredDocuments = [...allDocuments];
            } else {
                filteredDocuments = allDocuments.filter(doc => doc.document_type === type);
            }

            renderDocList();
        }

        // Render document list
        function renderDocList() {
            const list = document.getElementById('doc-list');

            if (filteredDocuments.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-regular fa-folder-open"></i>
                        <p>Belum ada dokumen</p>
                    </div>
                `;
                return;
            }

            const locationMap = {
                'klinik_private': { name: 'Klinik Privat' },
                'rsia_melinda': { name: 'RSIA Melinda' },
                'rsud_gambiran': { name: 'RSUD Gambiran' },
                'rs_bhayangkara': { name: 'RS Bhayangkara' }
            };

            list.innerHTML = filteredDocuments.map((doc, index) => {
                const date = new Date(doc.published_at || doc.created_at);
                const dateStr = date.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
                const isNew = !doc.first_viewed_at;
                const location = locationMap[doc.visit_location] || { name: '' };

                return `
                    <div class="doc-card">
                        <div class="doc-card-inner">
                            <div class="doc-icon">
                                <i class="fa-regular fa-file-lines"></i>
                            </div>
                            <div class="doc-info">
                                <div class="doc-header">
                                    <span class="doc-title">
                                        ${escapeHtml(doc.title || 'Resume Medis')}
                                        ${isNew ? '<span class="new-badge">BARU</span>' : ''}
                                    </span>
                                    ${location.name ? `<span class="doc-location">${location.name}</span>` : ''}
                                </div>
                                <div class="doc-date">
                                    <i class="fa-regular fa-calendar"></i> ${dateStr}
                                </div>
                                <div class="doc-actions">
                                    <button class="doc-btn view-btn" onclick="viewDocument(${index})">
                                        <i class="fa-regular fa-eye"></i> Lihat
                                    </button>
                                    ${doc.file_url ? `
                                        <button class="doc-btn download-btn" onclick="downloadFile(${index})">
                                            <i class="fa-solid fa-download"></i> Unduh
                                        </button>
                                    ` : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // View document
        async function viewDocument(index) {
            currentDoc = filteredDocuments[index];

            document.getElementById('preview-modal').classList.add('active');
            document.body.style.overflow = 'hidden';

            document.getElementById('preview-title').textContent = currentDoc.title || 'Dokumen';

            const previewBody = document.getElementById('preview-body');
            const btnDownload = document.getElementById('btn-download');

            // Check document type
            if (currentDoc.document_type === 'resume_medis' && (!currentDoc.file_url || currentDoc.file_url.startsWith('resume:'))) {
                // Load resume medis content from API
                previewBody.innerHTML = `
                    <div class="resume-loading">
                        <i class="fa-solid fa-spinner fa-spin"></i>
                        <p>Memuat resume medis...</p>
                    </div>
                `;
                btnDownload.style.display = 'none';

                try {
                    const data = await apiRequest(`/api/patient-documents/${currentDoc.id}/content`);

                    if (data && data.success && data.document) {
                        const content = data.document.content || '';
                        previewBody.innerHTML = `
                            <div class="resume-content">
                                ${content.replace(/\n/g, '<br>')}
                            </div>
                        `;
                    } else {
                        previewBody.innerHTML = `
                            <div class="resume-loading">
                                <i class="fa-solid fa-triangle-exclamation" style="color: #999;"></i>
                                <p>Gagal memuat resume medis</p>
                            </div>
                        `;
                    }
                } catch (e) {
                    previewBody.innerHTML = `
                        <div class="resume-loading">
                            <i class="fa-solid fa-triangle-exclamation" style="color: #999;"></i>
                            <p>Gagal memuat resume medis</p>
                        </div>
                    `;
                }
            } else if (currentDoc.file_url) {
                const fileType = getFileType(currentDoc.file_url);
                btnDownload.style.display = 'flex';

                if (fileType === 'image') {
                    previewBody.innerHTML = `<img src="${currentDoc.file_url}" alt="${escapeHtml(currentDoc.title || 'Document')}">`;
                } else if (fileType === 'pdf') {
                    previewBody.innerHTML = `
                        <div class="resume-loading">
                            <i class="fa-regular fa-file-pdf" style="color: #999;"></i>
                            <p>File PDF</p>
                            <p style="font-size: 12px; margin-top: 5px; color: var(--text-muted);">Klik Download untuk membuka</p>
                        </div>
                    `;
                } else {
                    previewBody.innerHTML = `
                        <div class="resume-loading">
                            <i class="fa-regular fa-file"></i>
                            <p>Preview tidak tersedia</p>
                            <p style="font-size: 12px; margin-top: 5px; color: var(--text-muted);">Klik Download untuk membuka</p>
                        </div>
                    `;
                }
            } else {
                btnDownload.style.display = 'none';
                previewBody.innerHTML = `
                    <div class="resume-loading">
                        <i class="fa-regular fa-file"></i>
                        <p>Dokumen tidak tersedia</p>
                    </div>
                `;
            }

            // Mark as viewed
            if (!currentDoc.first_viewed_at) {
                try {
                    await apiRequest(`/api/patient-documents/${currentDoc.id}/view`, { method: 'POST' });
                    currentDoc.first_viewed_at = new Date().toISOString();
                    renderDocList();
                } catch (e) {
                    console.error('Error marking viewed:', e);
                }
            }
        }

        // Get file type
        function getFileType(url) {
            if (!url) return 'unknown';
            const ext = url.split('.').pop().toLowerCase().split('?')[0];
            if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext)) return 'image';
            if (ext === 'pdf') return 'pdf';
            return 'unknown';
        }

        // Close preview
        function closePreview() {
            document.getElementById('preview-modal').classList.remove('active');
            document.body.style.overflow = '';
            currentDoc = null;
        }

        // Download file
        function downloadFile(index) {
            const doc = index !== undefined ? filteredDocuments[index] : currentDoc;
            if (!doc || !doc.file_url) return;

            window.open(doc.file_url, '_blank');
        }

        // Share file
        async function shareFile() {
            if (!currentDoc || !currentDoc.file_url) return;

            if (navigator.share) {
                try {
                    await navigator.share({
                        title: currentDoc.title || 'Dokumen',
                        url: currentDoc.file_url
                    });
                } catch (e) {
                    if (e.name !== 'AbortError') {
                        copyToClipboard(currentDoc.file_url);
                    }
                }
            } else {
                copyToClipboard(currentDoc.file_url);
            }
        }

        // Copy to clipboard
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast('Link berhasil disalin', 'success');
            }).catch(() => {
                showToast('Gagal menyalin link', 'error');
            });
        }

        // Keyboard
        document.addEventListener('keydown', function(e) {
            if (!document.getElementById('preview-modal').classList.contains('active')) return;
            if (e.key === 'Escape') closePreview();
        });
    </script>
