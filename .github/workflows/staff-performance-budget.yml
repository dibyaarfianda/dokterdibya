name: Staff Performance Budget

on:
  workflow_dispatch:
  schedule:
    - cron: "15 23 * * 0"

permissions:
  contents: read

jobs:
  production-budget:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: staff/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: staff/backend/package-lock.json
      - name: Install locked backend dependencies
        run: npm ci
      - name: Verify sandboxed system Chrome
        run: |
          test -x /opt/google/chrome/chrome
          /opt/google/chrome/chrome --version
      - name: Check production performance budgets
        run: node scripts/perf-budget-check.js --base-url https://dokterdibya.com
