name: Staff Performance Budget

on:
  workflow_dispatch:
  schedule:
    - cron: "15 23 * * 0"

permissions:
  contents: read

jobs:
  production-budget:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: staff/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: staff/backend/package-lock.json
      - name: Install locked backend dependencies
        run: npm ci
      - name: Install pinned Chromium and system dependencies
        run: |
          sudo apt-get update
          PUPPETEER_CACHE_DIR="$RUNNER_TEMP/staff-puppeteer-cache"
          mkdir -p "$PUPPETEER_CACHE_DIR"
          echo "PUPPETEER_CACHE_DIR=$PUPPETEER_CACHE_DIR" >> "$GITHUB_ENV"
          sudo env "PATH=$PATH" "PUPPETEER_CACHE_DIR=$PUPPETEER_CACHE_DIR" "$(command -v npx)" puppeteer browsers install chrome --install-deps
          sudo chown -R "$(id -u):$(id -g)" "$PUPPETEER_CACHE_DIR"
      - name: Check production performance budgets
        run: node scripts/perf-budget-check.js --base-url https://dokterdibya.com
