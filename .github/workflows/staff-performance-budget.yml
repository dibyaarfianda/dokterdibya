name: Staff Performance Budget

on:
  workflow_dispatch:
  schedule:
    - cron: "15 23 * * 0"

permissions:
  contents: read

jobs:
  production-budget:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: staff/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: staff/backend/package-lock.json
      - name: Require CI credential
        env:
          STAFF_PERF_TOKEN: ${{ secrets.STAFF_PERF_TOKEN }}
        run: test -n "$STAFF_PERF_TOKEN"
      - name: Install locked backend dependencies
        run: npm ci
      - name: Install pinned Chromium
        run: ./node_modules/.bin/puppeteer browsers install chrome
      - name: Check production performance budgets
        env:
          STAFF_PERF_TOKEN: ${{ secrets.STAFF_PERF_TOKEN }}
        run: node scripts/perf-budget-check.js --base-url https://dokterdibya.com --page-url https://dokterdibya.com/staff/public/index-adminlte.html
