name: Build Asisten DAF monitor APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assistant-daf-monitor/**'
      - '.github/workflows/build-assistant-daf-monitor.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: sdkmanager --install 'platforms;android-34' 'build-tools;34.0.0'
      - name: Build pilot APK
        working-directory: assistant-daf-monitor/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Asisten-DAF-Monitor-Pilot
          path: assistant-daf-monitor/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
