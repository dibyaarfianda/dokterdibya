name: Build Asisten DAF monitor APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assistant-daf-monitor/**'
      - '.github/workflows/build-assistant-daf-monitor.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          for manager in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$manager" ]; then
              "$manager" --install 'platforms;android-34' 'build-tools;34.0.0'
              exit 0
            fi
          done
          exit 1
      - name: Restore release signing key
        env:
          KEYSTORE_B64: ${{ secrets.ASSISTANT_DAF_MONITOR_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/assistant-daf-monitor.p12"
          chmod 600 "$RUNNER_TEMP/assistant-daf-monitor.p12"
      - name: Build signed release APK
        working-directory: assistant-daf-monitor/android
        env:
          ASSISTANT_DAF_MONITOR_KEYSTORE_FILE: ${{ runner.temp }}/assistant-daf-monitor.p12
          ASSISTANT_DAF_MONITOR_STORE_PASSWORD: ${{ secrets.ASSISTANT_DAF_MONITOR_STORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Asisten-DAF-Monitor-Release
          path: assistant-daf-monitor/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
