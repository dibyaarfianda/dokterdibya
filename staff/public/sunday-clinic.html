<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Mengalihkan Sunday Clinic</title>
    <noscript>
        <meta http-equiv="refresh" content="0; url=/staff/public/index-adminlte.html?page=sunday-clinic">
    </noscript>
</head>
<body>
    <script>
        (function redirectToEmbeddedSundayClinic() {
            var currentUrl = new URL(window.location.href);
            var targetUrl = new URL('/staff/public/index-adminlte.html', window.location.origin);

            currentUrl.searchParams.forEach(function(value, key) {
                if (key === 'page') {
                    return;
                }
                targetUrl.searchParams.set(key, value);
            });

            targetUrl.searchParams.set('page', 'sunday-clinic');

            var hasMrContext = targetUrl.searchParams.has('mr') || targetUrl.searchParams.has('patient');
            if (!targetUrl.searchParams.has('section') && hasMrContext) {
                targetUrl.searchParams.set('section', 'identitas');
            }

            if (currentUrl.hash) {
                targetUrl.hash = currentUrl.hash;
            }

            window.location.replace(targetUrl.toString());
        })();
    </script>
</body>
</html>
