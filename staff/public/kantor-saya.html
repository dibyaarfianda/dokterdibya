<div class="content">
    <div id="kantor-saya-page">
    <style>
        #kantor-saya-page {
            --kantor-accent: #0d6efd;
            --kantor-surface: rgba(255, 255, 255, 0.88);
            --kantor-border: rgba(15, 23, 42, 0.08);
            min-height: calc(100vh - 170px);
            border-radius: 16px;
            padding: 14px;
            background: radial-gradient(circle at 15% 10%, rgba(13, 110, 253, 0.15), transparent 42%),
                        radial-gradient(circle at 80% 0%, rgba(16, 185, 129, 0.14), transparent 40%),
                        linear-gradient(160deg, #f8fafc 0%, #eef4ff 50%, #f3f8f5 100%);
            background-size: cover;
            background-position: center;
        }

        #kantor-saya-page .ks-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
            align-items: center;
        }

        #kantor-saya-page .ks-toolbar .btn {
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        #kantor-saya-page .ks-dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            display: inline-block;
            margin-right: 6px;
            background: var(--kantor-accent);
        }

        #kantor-saya-page .ks-grid-shell {
            border: 1px solid var(--kantor-border);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            padding: 6px;
        }

        /* Fallback essentials when external GridStack CSS is delayed or blocked. */
        #kantor-saya-page .grid-stack {
            position: relative;
            min-height: 120px;
        }

        #kantor-saya-page .grid-stack > .grid-stack-item {
            position: absolute;
        }

        #kantor-saya-page .grid-stack-item-content {
            overflow: hidden;
            border-radius: 12px;
            background: var(--kantor-surface);
            border: 1px solid var(--kantor-border);
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
        }

        #kantor-saya-page .ks-widget {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        #kantor-saya-page .ks-widget-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 12px;
            border-bottom: 1px solid rgba(15, 23, 42, 0.06);
            background: linear-gradient(90deg, color-mix(in srgb, var(--kantor-accent) 13%, white) 0%, #ffffff 100%);
        }

        #kantor-saya-page .ks-widget-title {
            font-size: 12px;
            font-weight: 700;
            color: #0f172a;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #kantor-saya-page .ks-widget-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        #kantor-saya-page .ks-widget-actions .btn {
            border-radius: 8px;
            padding: 2px 8px;
            font-size: 11px;
            line-height: 1.3;
        }

        #kantor-saya-page .ks-widget-body {
            padding: 10px 12px 12px;
            flex: 1;
            overflow: auto;
            font-size: 12px;
            color: #1f2937;
        }

        #kantor-saya-page .ks-edit-only {
            display: none;
        }

        #kantor-saya-page.ks-edit-mode .ks-edit-only,
        #kantor-saya-page.ks-editing .ks-edit-only {
            display: inline-flex;
        }

        #kantor-saya-page .ks-edit-hint {
            display: none;
            font-size: 11px;
            color: #6b7280;
        }

        #kantor-saya-page.ks-edit-mode .ks-edit-hint,
        #kantor-saya-page.ks-editing .ks-edit-hint {
            display: inline-flex;
        }

        #kantor-saya-page.ks-edit-mode .ks-widget-header,
        #kantor-saya-page.ks-editing .ks-widget-header {
            cursor: move;
            touch-action: none;
        }

        #kantor-saya-page .grid-stack-item .ui-resizable-handle {
            position: absolute;
            opacity: 0;
            pointer-events: none;
            z-index: 6;
            transition: opacity 0.16s ease;
        }

        #kantor-saya-page.ks-edit-mode .grid-stack-item .ui-resizable-handle,
        #kantor-saya-page.ks-editing .grid-stack-item .ui-resizable-handle {
            opacity: 1;
            pointer-events: auto;
            touch-action: none;
        }

        #kantor-saya-page .grid-stack-item .ui-resizable-se {
            width: 22px;
            height: 22px;
            right: 4px;
            bottom: 4px;
            background: linear-gradient(145deg, color-mix(in srgb, var(--kantor-accent) 24%, #ffffff), color-mix(in srgb, var(--kantor-accent) 46%, #111827));
            border-right: 2px solid color-mix(in srgb, var(--kantor-accent) 75%, #111827);
            border-bottom: 2px solid color-mix(in srgb, var(--kantor-accent) 75%, #111827);
            border-radius: 8px;
            cursor: nwse-resize;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.45);
        }

        #kantor-saya-page .grid-stack-item .ui-resizable-se::before {
            content: '';
            position: absolute;
            width: 9px;
            height: 9px;
            right: 5px;
            bottom: 5px;
            background-image:
                linear-gradient(135deg, transparent 45%, rgba(255, 255, 255, 0.92) 45%, rgba(255, 255, 255, 0.92) 58%, transparent 58%),
                linear-gradient(135deg, transparent 63%, rgba(255, 255, 255, 0.72) 63%, rgba(255, 255, 255, 0.72) 75%, transparent 75%);
        }

        #kantor-saya-page .grid-stack-item .ui-resizable-s,
        #kantor-saya-page .grid-stack-item .ui-resizable-e {
            display: none !important;
        }

        @media (max-width: 767.98px) {
            #kantor-saya-page .grid-stack-item .ui-resizable-se {
                width: 28px;
                height: 28px;
                right: 3px;
                bottom: 3px;
            }
        }

        #kantor-saya-page .ks-empty {
            color: #6b7280;
            text-align: center;
            padding: 12px;
        }

        #kantor-saya-page .ks-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            gap: 6px;
        }

        #kantor-saya-page .ks-list li {
            background: rgba(15, 23, 42, 0.04);
            border-radius: 8px;
            padding: 7px 8px;
            line-height: 1.35;
        }

        #kantor-saya-page .ks-mini-grid {
            display: grid;
            gap: 7px;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        #kantor-saya-page .ks-stat {
            border: 1px solid rgba(15, 23, 42, 0.06);
            border-radius: 10px;
            padding: 8px;
            background: #fff;
        }

        #kantor-saya-page .ks-stat-label {
            font-size: 11px;
            color: #6b7280;
        }

        #kantor-saya-page .ks-stat-value {
            margin-top: 2px;
            font-size: 18px;
            font-weight: 700;
            color: #111827;
        }

        #kantor-saya-page .ks-sticky-note {
            width: 100%;
            min-height: 110px;
            border: 1px solid rgba(15, 23, 42, 0.08);
            border-radius: 10px;
            padding: 8px;
            resize: vertical;
            background: linear-gradient(180deg, #fffceb 0%, #fff8cf 100%);
            font-size: 12px;
        }

        #kantor-saya-page .ks-todo-item {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        #kantor-saya-page .ks-todo-item input[type="text"] {
            flex: 1;
        }

        #kantor-saya-page .ks-shortcuts {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        #kantor-saya-page .ks-shortcut {
            border: 1px solid rgba(15, 23, 42, 0.09);
            border-radius: 999px;
            padding: 5px 10px;
            font-size: 11px;
            background: #fff;
            cursor: pointer;
        }

        #kantor-saya-page .ks-shortcut:hover {
            border-color: var(--kantor-accent);
            color: #0f172a;
        }

        #kantor-saya-page .ks-calendar {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 4px;
            font-size: 11px;
        }

        #kantor-saya-page .ks-calendar-head,
        #kantor-saya-page .ks-calendar-day {
            border-radius: 7px;
            text-align: center;
            padding: 6px 4px;
        }

        #kantor-saya-page .ks-calendar-head {
            background: rgba(15, 23, 42, 0.07);
            font-weight: 600;
            color: #475569;
        }

        #kantor-saya-page .ks-calendar-day {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(15, 23, 42, 0.05);
        }

        #kantor-saya-page .ks-calendar-day.is-today {
            border-color: color-mix(in srgb, var(--kantor-accent) 35%, white);
            background: color-mix(in srgb, var(--kantor-accent) 18%, white);
            color: #0f172a;
            font-weight: 700;
        }

        #kantor-saya-page .ks-iframe-wrap iframe {
            border: 1px solid rgba(15, 23, 42, 0.08);
            border-radius: 10px;
            width: 100%;
            min-height: 180px;
            background: #fff;
        }

        #kantor-saya-page .ks-widget-catalog {
            display: grid;
            gap: 8px;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
        }

        #kantor-saya-page .ks-widget-option {
            border: 1px solid rgba(15, 23, 42, 0.12);
            background: #fff;
            border-radius: 10px;
            padding: 10px;
            cursor: pointer;
            transition: 0.18s ease;
        }

        #kantor-saya-page .ks-widget-option:hover {
            border-color: var(--kantor-accent);
            box-shadow: 0 7px 20px rgba(15, 23, 42, 0.1);
            transform: translateY(-1px);
        }

        #kantor-saya-page .ks-preset-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            margin-top: 8px;
        }

        #kantor-saya-page .ks-preset {
            border: 1px solid rgba(15, 23, 42, 0.15);
            border-radius: 10px;
            height: 56px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        #kantor-saya-page .ks-preset.is-selected::after {
            content: '';
            position: absolute;
            inset: 0;
            border: 2px solid #0f172a;
            border-radius: 10px;
        }

        #kantor-saya-page .ks-preset.preset-morning {
            background: linear-gradient(140deg, #f8fdff, #dbeafe, #d1fae5);
        }

        #kantor-saya-page .ks-preset.preset-dusk {
            background: linear-gradient(140deg, #e2e8f0, #fce7f3, #e9d5ff);
        }

        #kantor-saya-page .ks-preset.preset-forest {
            background: linear-gradient(140deg, #ecfdf5, #d9f99d, #bbf7d0);
        }

        #kantor-saya-page .ks-preset.preset-sand {
            background: linear-gradient(140deg, #fffbeb, #fed7aa, #fde68a);
        }

        #kantor-saya-page .ks-preset.preset-ice {
            background: linear-gradient(140deg, #eff6ff, #bfdbfe, #bae6fd);
        }

        #kantor-saya-page .ks-preset.preset-darkglass {
            background: linear-gradient(140deg, #1f2937, #374151, #4b5563);
        }

        @media (max-width: 767.98px) {
            #kantor-saya-page {
                padding: 10px;
                min-height: calc(100vh - 140px);
            }

            #kantor-saya-page .ks-toolbar {
                gap: 6px;
            }

            #kantor-saya-page .ks-toolbar .btn {
                font-size: 11px;
                padding: 4px 10px;
            }

            #kantor-saya-page .ks-mini-grid {
                grid-template-columns: 1fr;
            }

            #kantor-saya-page .ks-preset-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
    </style>

    <div class="ks-toolbar">
        <span class="badge badge-light"><span class="ks-dot"></span>Kantor Saya</span>
        <button type="button" class="btn btn-sm btn-primary" id="ks-btn-edit">
            <i class="fas fa-pen mr-1"></i>Mode Edit
        </button>
        <button type="button" class="btn btn-sm btn-outline-primary" id="ks-btn-add-widget">
            <i class="fas fa-plus mr-1"></i>Tambah Widget
        </button>
        <button type="button" class="btn btn-sm btn-outline-secondary" id="ks-btn-theme">
            <i class="fas fa-palette mr-1"></i>Tema
        </button>
        <button type="button" class="btn btn-sm btn-outline-secondary" id="ks-btn-refresh">
            <i class="fas fa-sync-alt mr-1"></i>Refresh
        </button>
        <small class="ks-edit-hint">Drag sudut/tepi widget untuk ubah ukuran</small>
        <small class="text-muted ml-auto" id="ks-last-saved">Belum tersimpan</small>
    </div>

    <div class="ks-grid-shell">
        <div id="kantor-grid" class="grid-stack"></div>
    </div>

    <div class="modal fade" id="ks-widget-modal" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-th-large mr-2"></i>Pilih Widget</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="ks-widget-catalog" id="ks-widget-catalog"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="ks-theme-modal" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-palette mr-2"></i>Personalisasi Kantor</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>Accent Color</label>
                        <input type="color" class="form-control" id="ks-theme-color" value="#0d6efd">
                    </div>
                    <div class="form-group">
                        <label>Wallpaper Preset</label>
                        <div class="ks-preset-grid" id="ks-wallpaper-presets">
                            <button type="button" class="ks-preset preset-morning" data-preset="morning" title="Morning"></button>
                            <button type="button" class="ks-preset preset-dusk" data-preset="dusk" title="Dusk"></button>
                            <button type="button" class="ks-preset preset-forest" data-preset="forest" title="Forest"></button>
                            <button type="button" class="ks-preset preset-sand" data-preset="sand" title="Sand"></button>
                            <button type="button" class="ks-preset preset-ice" data-preset="ice" title="Ice"></button>
                            <button type="button" class="ks-preset preset-darkglass" data-preset="darkglass" title="Dark Glass"></button>
                        </div>
                    </div>
                    <div class="form-group mb-0">
                        <label>Upload Wallpaper (JPG/PNG)</label>
                        <div class="d-flex align-items-center" style="gap: 8px;">
                            <button type="button" class="btn btn-outline-primary btn-sm" id="ks-btn-upload-wallpaper">
                                <i class="fas fa-upload mr-1"></i>Upload
                            </button>
                            <small class="text-muted">Maksimal 5MB, auto-resize server-side</small>
                        </div>
                        <input type="file" id="ks-wallpaper-file" accept="image/png,image/jpeg,image/webp" class="d-none">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Tutup</button>
                    <button type="button" class="btn btn-primary" id="ks-save-theme">
                        <i class="fas fa-save mr-1"></i>Simpan Tema
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
</div>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@10.2.0/dist/gridstack.min.css">
<script src="https://cdn.jsdelivr.net/npm/gridstack@10.2.0/dist/gridstack-all.js"></script>
<script src="./scripts/kantor-saya.js?v=v152"></script>
