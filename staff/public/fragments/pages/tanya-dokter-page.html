                    <div class="row">
                        <div class="col-12">
                            <div class="card">
                                <div class="card-header d-flex justify-content-between align-items-center" style="background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: white;">
                                    <h3 class="card-title mb-0"><i class="fas fa-comments mr-2"></i>Tanya Dokter - Q&A Pasien</h3>
                                    <div class="card-tools">
                                        <button type="button" class="btn btn-sm btn-light" onclick="loadTanyaDokterQuestions()">
                                            <i class="fas fa-sync-alt"></i> Refresh
                                        </button>
                                    </div>
                                </div>
                                <div class="card-body">
                                    <!-- Stats Cards -->
                                    <div class="row mb-4">
                                        <div class="col-lg-3 col-6">
                                            <div class="small-box bg-warning">
                                                <div class="inner">
                                                    <h3 id="tanya-stat-open">0</h3>
                                                    <p>Menunggu Jawaban</p>
                                                </div>
                                                <div class="icon"><i class="fas fa-clock"></i></div>
                                            </div>
                                        </div>
                                        <div class="col-lg-3 col-6">
                                            <div class="small-box bg-info">
                                                <div class="inner">
                                                    <h3 id="tanya-stat-answered">0</h3>
                                                    <p>Sudah Dijawab</p>
                                                </div>
                                                <div class="icon"><i class="fas fa-reply"></i></div>
                                            </div>
                                        </div>
                                        <div class="col-lg-3 col-6">
                                            <div class="small-box bg-success">
                                                <div class="inner">
                                                    <h3 id="tanya-stat-closed">0</h3>
                                                    <p>Selesai</p>
                                                </div>
                                                <div class="icon"><i class="fas fa-check-circle"></i></div>
                                            </div>
                                        </div>
                                        <div class="col-lg-3 col-6">
                                            <div class="small-box bg-secondary">
                                                <div class="inner">
                                                    <h3 id="tanya-stat-total">0</h3>
                                                    <p>Total Pertanyaan</p>
                                                </div>
                                                <div class="icon"><i class="fas fa-comments"></i></div>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Filter Tabs -->
                                    <ul class="nav nav-tabs mb-2" id="tanya-tabs">
                                        <li class="nav-item">
                                            <a class="nav-link active" href="#" data-filter="all" onclick="filterTanyaQuestions('all'); return false;">
                                                <i class="fas fa-list mr-1"></i> Semua
                                            </a>
                                        </li>
                                        <li class="nav-item">
                                            <a class="nav-link" href="#" data-filter="open" onclick="filterTanyaQuestions('open'); return false;">
                                                <i class="fas fa-clock mr-1"></i> Menunggu
                                                <span class="badge badge-warning" id="tanya-tab-open-badge">0</span>
                                            </a>
                                        </li>
                                        <li class="nav-item">
                                            <a class="nav-link" href="#" data-filter="answered" onclick="filterTanyaQuestions('answered'); return false;">
                                                <i class="fas fa-reply mr-1"></i> Dijawab
                                            </a>
                                        </li>
                                        <li class="nav-item">
                                            <a class="nav-link" href="#" data-filter="closed" onclick="filterTanyaQuestions('closed'); return false;">
                                                <i class="fas fa-check-circle mr-1"></i> Selesai
                                            </a>
                                        </li>
                                    </ul>

                                    <!-- Questions List -->
                                    <div class="tanya-questions-table-shell">
                                        <div id="tanya-questions-list">
                                            <div class="text-center py-4 text-muted">
                                                <i class="fas fa-spinner fa-spin fa-2x mb-2"></i>
                                                <p>Memuat pertanyaan...</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
