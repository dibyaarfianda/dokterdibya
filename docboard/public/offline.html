<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocBoard - Offline</title>
  <style>
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #F8FAFC;
      color: #0F172A;
      text-align: center;
      padding: 24px;
    }
    h2 { font-size: 20px; margin-bottom: 8px; }
    p { color: #64748B; font-size: 14px; }
    button {
      margin-top: 20px;
      padding: 12px 24px;
      background: #0F172A;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div>
    <h2>Tidak Ada Koneksi</h2>
    <p>Periksa koneksi internet Anda dan coba lagi.</p>
    <button onclick="location.reload()">Coba Lagi</button>
  </div>
</body>
</html>
